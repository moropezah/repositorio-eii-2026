r:"ECCO-ESP histopathology consensus · Guía Estudio EII 2026 §3"},

{id:"CU47",md:"E",b:"CU",t:"Biomarcadores",n:"R",
q:"¿Cuál es la limitación más relevante de la calprotectina fecal?",
o:["No se eleva en CU","Falsos positivos con AINE, infecciones entéricas, neoplasia, sangrado y posiblemente IBP; debe interpretarse en tendencia","Solo sirve para EC ileal","Tiene vida media de horas"],
c:1,
e:"La calprotectina es una proteína de neutrófilos: cualquier inflamación o neutrófilos en el lumen la eleva (AINE, infección, cáncer, pólipos, sangrado). <100–150 µg/g sugiere remisión endoscópica; >250 sugiere actividad; STRIDE-II: rango 100–250 como meta intermedia. Su ascenso precede meses a la recaída clínica.",
w:{0:"Es especialmente sensible en colitis.",2:"Es más sensible en colon que en íleon aislado.",3:"Es estable días en heces a temperatura ambiente."},
p:"En EC ileal aislada la correlación con actividad es menor; complementar con IUS o entero-RM.",
m:"La calprotectina constituye ~60% de las proteínas citosólicas del neutrófilo; se libera al lumen por migración transepitelial de neutrófilos y resiste la degradación bacteriana, lo que la hace un marcador cuantitativo de inflamación mucosa.",
r:"STRIDE-II 2021 · Guía Estudio EII 2026 §4.2"},

{id:"CU48",md:"E",b:"CU",t:"Complicaciones",n:"R",
q:"Definición de megacolon tóxico:",
o:["Dilatación del colon transverso >6 cm (o ciego >9 cm) con toxicidad sistémica, sin obstrucción","Dilatación >3 cm con dolor","Neumoperitoneo en CU","Íleo paralítico postoperatorio"],
c:0,
e:"Megacolon tóxico: dilatación colónica no obstructiva (>6 cm transverso) + toxicidad sistémica (fiebre, taquicardia, leucocitosis, anemia; hipotensión, alteración de conciencia). Precipitantes: <i>C. difficile</i>, CMV, opioides/antidiarreicos/anticolinérgicos, hipopotasemia, colonoscopía en colitis grave. Manejo: corticoides IV, antibióticos, corrección electrolítica, descompresión; baja respuesta en 24–72 h → colectomía.",
w:{1:"Umbral incorrecto.",2:"Es perforación.",3:"Otra entidad."},
p:"En CUAG la radiografía de abdomen al ingreso y ante deterioro es parte del paquete.",
m:"La inflamación transmural profunda (excepcional en CU) afecta el plexo mioentérico y la musculatura; el óxido nítrico y citoquinas inducen parálisis del músculo liso y dilatación, con riesgo de perforación.",
r:"ACG UC 2025 · Guía Estudio EII 2026 §12.4"},

{id:"CU49",md:"E",b:"CU",t:"Cirugía",n:"F",
q:"Respecto de la apendicectomía en CU refractaria, ¿qué afirmación es correcta según ECCO quirúrgica 2026?",
o:["Está contraindicada","Se sugiere como opción en pacientes seleccionados con CU refractaria (enunciado 8); evidencia de PASSION, ACCURE y COSTA","Reemplaza a la colectomía en CUAG","Solo tiene rol en EC"],
c:1,
e:"La apendicectomía laparoscópica es una alternativa de nicho para el paciente seleccionado que quiere evitar o postergar la colectomía. <b>ACCURE</b> (mantención tras remisión): menos recaída a 1 año. <b>COSTA</b>: comparó apendicectomía con cambio a JAK tras falla biológica. No es opción en CUAG.",
w:{0:"ECCO la sugiere como opción.",2:"No tiene rol en CUAG.",3:"La evidencia es en CU."},
p:"El antecedente de apendicectomía antes de los 20 años se asocia a menor riesgo de desarrollar CU (epidemiología).",
m:"El apéndice es tejido linfoide asociado a mucosa y reservorio de microbiota; se postula que actúa como 'ganglio' de priming de linfocitos colitogénicos, especialmente con 'parche' periapendicular inflamado.",
r:"ECCO UC Surgical 2026 enunciado 8 · Visser E et al. Lancet Gastroenterol Hepatol 2025 (ACCURE)"},

{id:"CU50",md:"E",b:"CU",t:"Reservorio",n:"R",
q:"Clasificación de las complicaciones inflamatorias del reservorio ileoanal. ¿Cuál corresponde a cuffitis?",
o:["Inflamación del manguito rectal remanente: se maneja como proctitis (5-ASA o corticoide tópico)","Reservoritis antibiótico-dependiente","Inflamación tipo Crohn del reservorio","Ileítis pre-reservorio"],
c:0,
e:"Tipos: A aguda; B crónica antibiótico-dependiente; C crónica antibiótico-refractaria; D inflamación tipo Crohn; E <b>cuffitis</b> (manguito rectal). El manguito debe ser ≤2 cm (ECCO quirúrgica 2026, enunciado 16): manguitos largos aumentan cuffitis y displasia.",
w:{1:"Es tipo B.",2:"Es tipo D; exige descartar EC mal diagnosticada.",3:"Se asocia a CEP y reservoritis crónica."},
p:"Función normal del reservorio: 6–8 deposiciones/día, 1–2 nocturnas en la mitad de los pacientes.",
m:"El manguito es mucosa rectal residual, con el mismo sustrato de la CU; por eso responde a terapia tópica de CU, mientras que la reservoritis es inflamación de mucosa ileal con disbiosis.",
r:"ECCO UC Surgical 2026 · Guía Simposio PANCCO–ACTECCU 2026 §14"},

{id:"CU51",md:"E",b:"CU",t:"Anti-integrina",n:"R",
q:"Formulación subcutánea de vedolizumab: ¿cuándo y cómo se usa?",
o:["108 mg SC c/2 semanas desde la semana 6, tras al menos 2 infusiones IV de inducción","300 mg SC c/8 semanas desde el inicio","Solo como rescate en CUAG","108 mg SC semanal como inducción"],
c:0,
e:"Vedolizumab SC 108 mg c/2 semanas, iniciado tras la inducción IV (sem 0 y 2), aprobado en CU (VISIBLE 1) y EC (VISIBLE 2). Permite mantención domiciliaria. La transición de IV a SC en pacientes estables es factible.",
w:{1:"Esquema inexistente.",2:"Vedolizumab no es fármaco de rescate.",3:"La inducción es IV."},
p:"Respuesta parcial a sem 10 → dosis IV adicional o c/4 semanas antes de declarar falla.",
m:"La biodisponibilidad SC (~75%) con dosificación frecuente mantiene concentraciones valle estables y más altas que el IV c/8 semanas; la saturación de α4β7 en linfocitos circulantes es casi completa con ambas vías.",
r:"Sandborn WJ et al. Gastroenterology 2020 (VISIBLE 1)"},

{id:"CU52",md:"E",b:"CU",t:"CU leve–moderada",n:"R",
q:"Proctitis ulcerosa refractaria a mesalazina supositorio 1 g/día y mesalazina oral 4 g/día. Siguiente paso razonable:",
o:["Corticoide tópico (espuma de budesonida) y, si persiste, escalar a terapia avanzada tras confirmar extensión, adherencia y descartar otras causas","Colectomía","Antibióticos","Aumentar mesalazina oral a 8 g/día"],
c:0,
e:"Proctitis refractaria: verificar <b>adherencia</b> a la terapia rectal (la causa más frecuente), técnica, extensión real (colonoscopía completa), infección, prolapso mucoso/proctitis por otras causas. Luego corticoide tópico, corticoide sistémico, tiopurina o terapia avanzada. Los ensayos de terapia avanzada suelen excluir proctitis aislada, pero en refractaria se usan.",
w:{1:"Desproporcionado.",2:"Sin rol.",3:"Sin beneficio sobre 4,8 g y más toxicidad."},
p:"La constipación proximal en proctitis puede impedir la llegada del fármaco: laxantes osmóticos ayudan.",
m:"El recto recibe poca mesalazina oral (liberación proximal y tránsito); la terapia tópica depende de la retención. La inflamación rectal aislada tiene además sensibilidad y tenesmo que reducen la retención del supositorio.",
r:"ECCO UC Medical 2026 · ACG UC 2025"},

{id:"EC30",md:"E",b:"EC",t:"Diagnóstico diferencial",n:"F",
q:"Hombre de 30 años de zona endémica con ileítis. ¿Qué hallazgo orienta más a tuberculosis intestinal que a EC?",
o:["Úlceras longitudinales y aspecto en empedrado","Úlceras transversales/circunferenciales, válvula ileocecal patulosa, granulomas grandes confluentes o caseificantes y adenopatías necróticas en TC","Enfermedad perianal fistulizante","Lesiones salteadas en colon izquierdo"],
c:1,
e:"TBC intestinal: úlceras <b>transversales</b>, válvula ileocecal <b>patulosa</b>, compromiso de <1 segmento/ciego, granulomas grandes, confluentes, con necrosis caseosa, bacilos ácido-alcohol resistentes o PCR/cultivo positivo, adenopatías con necrosis central, TBC pulmonar. EC: úlceras longitudinales, empedrado, afecciones perianales, lesiones salteadas, estriación de vasos rectos ('signo del peine').",
w:{0:"Típico de EC.",2:"Típico de EC.",3:"Más típico de EC."},
p:"Si la duda persiste en zona endémica: prueba terapéutica antituberculosa (8–12 semanas) con reevaluación antes de inmunosuprimir.",
m:"La TBC se disemina por los linfáticos, que en el íleon corren circunferencialmente → úlceras transversales; la necrosis caseosa refleja la respuesta granulomatosa a micobacterias. En EC, la inflamación sigue el borde mesentérico → úlceras longitudinales.",
r:"Guía Estudio EII 2026 §3 · Makharia GK et al. Am J Gastroenterol 2010"},

{id:"EC31",md:"E",b:"EC",t:"Imagen / IUS",n:"F",
q:"Ecografía intestinal en EC antes y a las 12 semanas de iniciar terapia. ¿Qué define respuesta transmural según el consenso IBUS?",
o:["Reducción del grosor de pared >25%, o >2,0 mm, o >1,0 mm más una disminución de un grado de Doppler color","Cualquier reducción de grosor","Aumento del Doppler","Normalización del calibre luminal"],
c:0,
e:"Consenso IBUS (Ilvemark 2022): <b>respuesta transmural</b> = reducción del grosor de pared >25%, o >2,0 mm, o >1,0 mm + reducción de 1 grado de Doppler color. <b>Curación transmural</b> habitualmente grosor ≤3 mm con Doppler normal (definiciones aún heterogéneas).",
w:{1:"Muy poco específica.",2:"Indica actividad.",3:"No es el criterio."},
p:"La respuesta ecográfica precoz (4–12 semanas) predice respuesta endoscópica posterior.",
m:"El grosor refleja edema e infiltrado inflamatorio que regresan antes que la fibrosis; el Doppler mide neovascularización activa. Combinar ambos distingue mejoría inflamatoria real de pared fibrótica residual.",
r:"Ilvemark JFKF et al. J Crohns Colitis 2022 · Chavannes M et al. AGA CPU IUS 2024"},

{id:"EC32",md:"E",b:"EC",t:"Imagen / IUS",n:"F",
q:"Índice de entero-RM que STRIDE-II usa como referencia de curación transmural por segmento:",
o:["MaRIA <7 (Clermont <8,4; London <4,1)","MaRIA <20","Lémann <4","Van Assche <10"],
c:0,
e:"MaRIA (Magnetic Resonance Index of Activity): por segmento, grosor de pared, realce relativo, edema y úlceras. <b>MaRIA <7</b> = inactivo; ≥11 = actividad grave. sMaRIA simplificado (≥1 por segmento = actividad) sin cuantificar el realce. Van Assche/MAGNIFI-CD son para fístula perianal.",
w:{1:"Umbral de actividad grave.",2:"Lémann mide daño acumulado.",3:"Índice perianal."},
p:"RM sin gadolinio si se requiere en embarazo.",
m:"El realce tras gadolinio refleja hiperemia y permeabilidad capilar inflamatoria; el edema (T2) actividad aguda; el grosor puede persistir por fibrosis, por eso el índice combina varios componentes.",
r:"Rimola J et al. Gut 2009 · STRIDE-II 2021"},

{id:"EC33",md:"E",b:"EC",t:"Crohn perianal",n:"R",
q:"Según la AGA, ¿cuál es una fístula perianal SIMPLE?",
o:["Superficial, interesfinteriana o transesfinteriana baja, con orificio externo único, sin absceso, sin fístula rectovaginal, sin estenosis anorrectal ni proctitis","Transesfinteriana alta","Supraesfinteriana","Con múltiples orificios externos"],
c:0,
e:"AGA: <b>simple</b> = baja (superficial, interesfinteriana o transesfinteriana baja), orificio único, sin absceso, sin comunicación rectovaginal, sin estenosis ni proctitis. <b>Compleja</b> = alta (transesfinteriana alta, supra- o extraesfinteriana), múltiples orificios, absceso, rectovaginal, estenosis o proctitis activa. Parks: I interesfinteriana, II transesfinteriana, III supraesfinteriana, IV extraesfinteriana (+ superficial).",
w:{1:"Compleja.",2:"Compleja.",3:"Compleja."},
p:"Proctitis activa convierte cualquier fístula en compleja y contraindica reparación.",
m:"El compromiso esfinteriano define riesgo de incontinencia con la cirugía; la proctitis perpetúa el trayecto por inflamación del orificio interno. Por eso la complejidad determina el objetivo (curación vs control).",
r:"Sandborn WJ et al. AGA technical review 2003 · Parks AG 1976"},

{id:"EC34",md:"E",b:"EC",t:"Crohn perianal",n:"F",
q:"¿Qué evalúa el índice MAGNIFI-CD?",
o:["Actividad de fístulas perianales por RM de pelvis, con respuesta al tratamiento validada","Actividad luminal por entero-RM","Daño acumulado global","Actividad por ecografía intestinal"],
c:0,
e:"MAGNIFI-CD (2019–2022): índice de RM validado para fístulas perianales en EC (número de trayectos, hiperintensidad T2 de trayectos y extensión, colecciones, trayecto predominante, inflamación del recto…), con umbrales de respuesta y remisión radiológica. Reemplaza progresivamente al Van Assche modificado en ensayos.",
w:{1:"Eso es MaRIA.",2:"Eso es Lémann.",3:"No es por IUS."},
p:"La curación radiológica va por detrás del cierre clínico del orificio externo (meses).",
m:"El cierre del orificio externo puede ocurrir con trayecto aún inflamado (hiperintensidad T2); la RM ve el trayecto completo, explicando la recurrencia de abscesos tras un 'cierre' clínico.",
r:"Hindryckx P et al. Gut 2019 (MAGNIFI-CD) · van Rijn KL et al. 2022"},

{id:"EC35",md:"E",b:"EC",t:"Anti-TNF",n:"R",
q:"Esquema de adalimumab en EC y su ensayo pivotal de mantención:",
o:["160 mg sem 0 → 80 mg sem 2 → 40 mg c/2 sem (intensificable a 40 mg semanal u 80 mg c/2 sem); CHARM","5 mg/kg IV sem 0-2-6; ACCENT I","400 mg sem 0-2-4; PRECISE","300 mg IV; GEMINI 2"],
c:0,
e:"Adalimumab EC: 160/80 → 40 mg c/2 semanas. CLASSIC I (inducción), <b>CHARM</b> (mantención; subgrupo con fístulas), EXTEND (curación mucosa). Intensificación: 40 mg semanal u 80 mg c/2 sem. En estenosis inflamatoria sintomática: CREOLE.",
w:{1:"Es infliximab.",2:"Es certolizumab.",3:"Es vedolizumab."},
p:"Adalimumab también está aprobado en hidradenitis supurativa: útil si coexiste.",
m:"Anticuerpo totalmente humano: menos inmunogénico que infliximab, pero la dosis fija SC hace que el peso y el aclaramiento determinen niveles más bajos en obesos o con alta carga inflamatoria.",
r:"Colombel JF et al. Gastroenterology 2007 (CHARM)"},

{id:"EC36",md:"E",b:"EC",t:"Anti-TNF",n:"F",
q:"¿Por qué etanercept no es eficaz en EC, a diferencia de infliximab?",
o:["No se une a TNF","Es una proteína de fusión receptor-Fc que no induce apoptosis de linfocitos T activados de la lámina propia ni une con igual avidez el TNF de membrana","Porque es SC","Porque produce más anticuerpos"],
c:1,
e:"La eficacia de los anticuerpos anti-TNF en EC se relaciona con la unión al <b>TNF transmembrana</b>, la señalización reversa y la <b>apoptosis de linfocitos T</b> de la mucosa, además de inducción de macrófagos reguladores vía Fc. Etanercept (receptor soluble p75-Fc) neutraliza TNF soluble pero no reproduce esos efectos: fracasó en EC.",
w:{0:"Sí une TNF soluble.",2:"Adalimumab también es SC y es eficaz.",3:"No es la explicación."},
p:"Certolizumab (Fab pegilado, sin Fc) es eficaz pese a no inducir apoptosis: el mecanismo es multifactorial.",
m:"El TNF de membrana en linfocitos T activados, al ser unido por un anticuerpo bivalente, transmite señal reversa proapoptótica; la eliminación de células T patogénicas explica el efecto transmural y la curación de fístulas.",
r:"Van den Brande JM et al. Gastroenterology 2003 · Sandborn WJ et al. Gastroenterology 2001"},

{id:"EC37",md:"E",b:"EC",t:"Anti-TNF",n:"R",
q:"Característica diferencial de certolizumab pegol:",
o:["Fragmento Fab' pegilado sin porción Fc: transferencia placentaria mínima","Es el único anti-TNF IV","Tiene indicación en CU en Chile","Es un receptor soluble"],
c:0,
e:"Certolizumab: Fab' humanizado unido a polietilenglicol, <b>sin Fc</b> → no usa FcRn → transferencia placentaria mínima y niveles casi indetectables en el recién nacido. Esquema EC: 400 mg SC sem 0-2-4 → c/4 sem (PRECISE). No aprobado en CU; no cubierto por LRS.",
w:{1:"Es SC.",2:"Sin indicación en CU.",3:"Es un anticuerpo (fragmento)."},
p:"Lactante expuesto a certolizumab: no requiere diferir vacunas vivas.",
m:"El FcRn placentario transporta IgG activamente desde el segundo trimestre; sin Fc, el fármaco cruza solo por difusión pasiva mínima. La pegilación prolonga la vida media sin Fc.",
r:"Sandborn WJ et al. NEJM 2007 (PRECISE) · Mahadevan U et al. Global Consensus 2019"},

{id:"EC38",md:"E",b:"EC",t:"Anti-IL-12/23 e IL-23",n:"F",
q:"Esquema de mirikizumab en EC (VIVID-1):",
o:["900 mg IV sem 0-4-8 → 300 mg SC c/4 semanas","300 mg IV → 200 mg SC c/4 semanas","600 mg IV → 360 mg SC c/8 semanas","200 mg IV → 100 mg SC c/8 semanas"],
c:0,
e:"Mirikizumab EC (VIVID-1; aprobación FDA enero 2025): <b>900 mg IV × 3 → 300 mg SC c/4 semanas</b> (inyecciones de 200 + 100 mg). En CU: 300 mg IV → 200 mg SC c/4 sem. VIVID-1 incluyó ustekinumab como comparador activo.",
w:{1:"Es CU.",2:"Es risankizumab EC.",3:"Es guselkumab."},
p:"Mirikizumab es IgG4 humanizado con Fc mutado.",
m:"La EC requiere exposición mayor que la CU para controlar inflamación transmural; de ahí dosis de inducción triples respecto de CU.",
r:"Ferrante M et al. Lancet 2024 (VIVID-1)"},

{id:"EC39",md:"E",b:"EC",t:"Nutrición",n:"F",
q:"Respecto de la dieta de exclusión de Crohn (CDED) con nutrición enteral parcial, ¿qué afirmación es correcta?",
o:["En niños con EC leve-moderada fue mejor tolerada que la nutrición enteral exclusiva con eficacia similar de inducción de remisión","Reemplaza a la terapia avanzada en EC moderada-grave con factores de mal pronóstico","No tiene ninguna evidencia","Es una dieta alta en ultraprocesados"],
c:0,
e:"CDED + nutrición enteral parcial: ECA pediátrico (Levine 2019) mostró remisión similar a NEE a la semana 6 con mejor tolerancia y remisión sostenida mayor a la semana 12. En adultos, datos menores (CDED ± NEP). Excluye emulsificantes, carnes procesadas, lácteos, gluten en fase inicial.",
w:{1:"No sustituye terapia avanzada en alto riesgo.",2:"Tiene ECA pediátrico.",3:"Justamente los excluye."},
p:"Los ultraprocesados (NOVA 4) se asocian a mayor riesgo de EC (HR ~1,7) en cohortes.",
m:"Emulsificantes (carboximetilcelulosa, polisorbato-80) adelgazan la capa de moco y favorecen invasión bacteriana; excluir estos componentes reduce el estímulo antigénico mucoso.",
r:"Levine A et al. Gastroenterology 2019 · ECCO dietary consensus 2025"},

{id:"EC40",md:"E",b:"EC",t:"Complicaciones",n:"R",
q:"Diarrea tras resección ileal de ~40 cm en EC con colon en continuidad y calprotectina normal. Mecanismo más probable y tratamiento:",
o:["Diarrea por ácidos biliares: colestiramina","Esteatorrea por déficit de ácidos biliares: dieta alta en grasas","Recurrencia de EC: biológico","Sobrecrecimiento bacteriano: siempre rifaximina"],
c:0,
e:"Resección ileal <b><100 cm</b> → malabsorción de ácidos biliares que llegan al colon → diarrea secretora: <b>secuestrantes</b> (colestiramina, colesevelam). Resección <b>>100 cm</b> → el pool de ácidos biliares se agota → esteatorrea: dieta baja en grasa, triglicéridos de cadena media; los secuestrantes empeoran.",
w:{1:"Es >100 cm y el manejo es dieta baja en grasa.",2:"Calprotectina normal: no hay inflamación objetiva.",3:"Posible, pero no es lo más probable ni se trata sin evaluar."},
p:"Déficit de B12 con resección >60 cm de íleon: controlar y suplementar.",
m:"Los ácidos biliares no absorbidos en el íleon activan secreción de cloro y agua en el colonocito (vía TGR5/cAMP) y aceleran el tránsito. Con pérdida masiva, la síntesis hepática no compensa y falla la formación de micelas.",
r:"Guía Estudio EII 2026 §3 · ACG CD 2025"},

{id:"EC41",md:"E",b:"EC",t:"Complicaciones",n:"R",
q:"¿Por qué los pacientes con EC ileal y colon en continuidad tienen más litiasis renal?",
o:["Hiperoxaluria entérica: los ácidos grasos no absorbidos quelan calcio, y el oxalato libre se absorbe en colon","Hipercalciuria por corticoides exclusivamente","Uricosuria por tiopurinas","Deshidratación sin otro mecanismo"],
c:0,
e:"Malabsorción de grasas → los ácidos grasos se unen al calcio luminal → el oxalato queda libre y se absorbe en el colon (cuya permeabilidad aumentan los ácidos biliares) → <b>hiperoxaluria entérica</b> y cálculos de oxalato de calcio. Si hay ileostomía, predominan cálculos de ácido úrico (deshidratación, orina ácida). Manejo: dieta baja en oxalato y grasa, calcio con las comidas, hidratación, citrato.",
w:{1:"Contribuye, pero no es el mecanismo principal.",2:"No es el mecanismo.",3:"Contribuye, pero no explica la especificidad."},
p:"Cálculos de ácido úrico en ileostomizados.",
m:"Normalmente el calcio precipita el oxalato en el lumen; la saponificación de calcio por ácidos grasos libera oxalato soluble que se absorbe en colon.",
r:"Guía Estudio EII 2026 · revisión nutricional ECCO 2025"},

{id:"EC42",md:"E",b:"EC",t:"Clasificación",n:"R",
q:"¿Qué clasificación se usa en EII pediátrica y en la transición, y qué agrega a Montreal?",
o:["París: subdivide edad (A1a <10, A1b 10–17), localización alta (L4a proximal / L4b distal al Treitz), comportamiento B2B3 y crecimiento (G0/G1)","Montreal modificada solo por edad","Truelove-Witts pediátrico","Mayo pediátrico"],
c:0,
e:"<b>París</b> (2011): A1a 0–<10 años, A1b 10–<17; L4a (proximal al ángulo de Treitz) y L4b (distal a Treitz, proximal al íleon distal); B2B3 simultáneo; G1 retraso de crecimiento. En CU: E4 pancolitis y S1 (enfermedad grave por PUCAI ≥65). Actividad pediátrica: PUCAI (CU), PCDAI (EC).",
w:{1:"París agrega más que la edad.",2:"No existe.",3:"No es la clasificación."},
p:"En transición conviene mantener París en la historia y agregar Montreal.",
m:"La EII pediátrica es más extensa y progresiva; distinguir subgrupos de edad (monogénica en muy temprana <6 años) y crecimiento cambia pronóstico y tratamiento.",
r:"Levine A et al. Inflamm Bowel Dis 2011 (París)"},

{id:"EC43",md:"E",b:"EC",t:"Recurrencia posquirúrgica",n:"R",
q:"¿Cuál de estos NO es factor de alto riesgo de recurrencia posquirúrgica en EC?",
o:["Tabaquismo activo","Resección intestinal previa","Enfermedad penetrante o perianal","Primera resección corta de estenosis fibrótica en no fumador sin exposición biológica previa"],
c:3,
e:"Alto riesgo: tabaquismo, ≥1 resección previa, fenotipo penetrante, enfermedad perianal, resección extensa, debut joven, falla biológica previa, plexitis mientérica o granulomas en la pieza. Bajo riesgo: primera resección corta, ileal, fibroestenótica, no fumador → puede optarse por vigilancia sin profilaxis con endoscopía a los 6–12 meses.",
w:{0:"Factor mayor (el más modificable).",1:"Factor mayor.",2:"Factor mayor."},
p:"Cesación tabáquica tiene un efecto comparable a un fármaco en prevención de recurrencia.",
m:"La recurrencia suele iniciarse en el neoíleon por reexposición al contenido fecal y microbiota; el tabaco altera la microcirculación y la inmunidad mucosa, y el fenotipo penetrante refleja una biología más agresiva.",
r:"ACG CD 2025 · AGA post-op CD guideline 2017 · Guía Simposio PANCCO–ACTECCU 2026 §16"},

{id:"EC44",md:"E",b:"EC",t:"Genética y fisiopatología",n:"F",

e:"<b>NOD2</b> (receptor intracelular de muramil-dipéptido, expresado en células de Paneth): las variantes (R702W, G908R, 1007fs) se asocian a EC ileal, fenotipo estenosante y cirugía precoz. Mucho menos frecuentes en poblaciones asiáticas y latinoamericanas mestizas. IL-10/IL-10R: EII monogénica de inicio muy temprano.",
w:{1:"Inmunogenicidad a anti-TNF.",2:"Metabolismo de tiopurinas.",3:"EII monogénica infantil, no fenotipo ileal adulto."},
p:"Genes de autofagia (ATG16L1, IRGM) también se asocian a EC ileal.",

{id:"EC45",md:"E",b:"EC",t:"Terapia convencional",n:"R",
q:"¿Qué debe medirse antes de iniciar azatioprina y por qué?",
o:["Actividad/genotipo de TPMT y genotipo NUDT15 para predecir mielotoxicidad; además hemograma, perfil hepático, serología VEB en varón joven","Solo creatinina","Anticuerpos anti-TNF","Vitamina D"],
c:0,
e:"TPMT: deficiente (<10 U) → evitar o <10% de dosis; intermedio → 30–70% (p. ej. 60%) de dosis; normal → dosis plena (2–2,5 mg/kg AZA; 1–1,5 mg/kg 6-MP). <b>NUDT15</b>: variantes frecuentes en población asiática y amerindia/latinoamericana, mielotoxicidad grave con TPMT normal. Monitorización: hemograma y perfil hepático c/1–2 sem por 2 meses, luego c/2–3 meses.",
w:{1:"Insuficiente.",2:"No corresponde.",3:"No es requisito."},
p:"Una TPMT normal no elimina el riesgo: la mielotoxicidad puede ser tardía; el control es indefinido.",
m:"TPMT desvía 6-MP hacia 6-MMP; con baja actividad se acumulan 6-TGN. NUDT15 desfosforila los nucleótidos de tioguanina activos; su pérdida aumenta la incorporación de tioguanina al ADN.",
r:"CPIC guideline TPMT/NUDT15 · Guía Simposio PANCCO–ACTECCU 2026 §4"},

{id:"EC46",md:"E",b:"EC",t:"Complicaciones",n:"F",
q:"Síndrome de intestino corto tras múltiples resecciones en EC. ¿Qué fármaco es un análogo de GLP-2 que reduce la dependencia de nutrición parenteral?",

e:"<b>Teduglutida</b> (análogo de GLP-2): aumenta la altura de vellosidades y la absorción, reduciendo el volumen de NP (STEPS). En EC exige vigilancia de pólipos (colonoscopía basal y periódica) y de estenosis/obstrucción. Octreótido y loperamida son sintomáticos.",
w:{1:"Análogo de GLP-1.",2:"Reduce secreciones; no es trófico.",3:"Antidiarreico sintomático."},

{id:"TR37",md:"E",b:"TR",t:"Tamizaje e infecciones",n:"R",

r:"ECCO Infections 2026. JCC 2026;20(7):jjag071"},

{id:"TR38",md:"E",b:"TR",t:"Tamizaje e infecciones",n:"F",
q:"Paciente con prednisona 30 mg/día + infliximab + azatioprina. ¿Qué profilaxis considerar?",
o:["Profilaxis de <i>Pneumocystis jirovecii</i> con cotrimoxazol (triple inmunosupresión)","Aciclovir universal","Isoniazida sin tamizaje","Fluconazol"],
c:0,
e:"La <b>triple inmunosupresión</b> (corticoide + dos inmunosupresores, o corticoide ≥20 mg >4 semanas con otro inmunosupresor) es el principal factor de riesgo de neumonía por <i>P. jirovecii</i> en EII: se sugiere <b>cotrimoxazol</b> (p. ej. 800/160 mg 3×/semana). También es un argumento para reducir la exposición a corticoides.",
w:{1:"Solo en contextos específicos.",2:"La isoniazida es para infección latente demostrada.",3:"Sin indicación rutinaria."},
p:"Riesgo infeccioso grave: corticoides > anti-TNF > tiopurinas; la combinación multiplica.",
m:"Los corticoides reducen la inmunidad celular CD4 y la función de macrófagos alveolares; sumados a anti-TNF (función macrofágica y granulomatosa) y tiopurinas (linfopenia), se pierde el control de <i>Pneumocystis</i>.",
r:"ECCO Infections 2026 · Guía Simposio PANCCO–ACTECCU 2026 §17"},

{id:"TR39",md:"E",b:"TR",t:"Vacunas",n:"R",
q:"Paciente que iniciará infliximab y necesita vacuna contra varicela (seronegativo). ¿Cuál es el intervalo seguro?",
o:["Vacuna viva ≥4 semanas antes de iniciar la inmunosupresión; si ya está inmunosuprimido, esperar ≥3 meses tras suspender","Puede darse el mismo día de la primera infusión","Nunca puede vacunarse","Una semana después de la inducción"],
c:0,
e:"Vacunas vivas atenuadas (varicela, triple viral, fiebre amarilla, BCG, zóster vivo): <b>≥4 semanas antes</b> de iniciar inmunosupresión o <b>≥3 meses tras suspenderla</b> (algunas guías: 1 mes tras corticoides en dosis altas). Nunca retrasar un tratamiento necesario por completar el calendario.",
w:{1:"Contraindicado.",2:"Se puede con el intervalo adecuado.",3:"Contraindicado."},
p:"Para zóster, usar la recombinante (inactivada), que se puede aplicar bajo inmunosupresión.",
m:"Las vacunas vivas replican; sin inmunidad celular íntegra la cepa vacunal puede diseminarse. Cuatro semanas permiten generar respuesta y controlar la replicación antes de inmunosuprimir.",

{id:"TR40",md:"E",b:"TR",t:"Cuidado preventivo",n:"R",
q:"Mujer de 32 años con EC en azatioprina. ¿Cuál es la recomendación de tamizaje de cáncer cervicouterino?",
o:["Citología (o test VPH según programa) más frecuente: anual en inmunosuprimidas, y vacunación VPH","Igual que población general sin cambios","No requiere tamizaje","Solo colposcopía cada 5 años"],
c:0,
e:"La inmunosupresión (sobre todo tiopurinas y combinación) se asocia a mayor persistencia del VPH y lesiones cervicales de alto grado: tamizaje <b>intensificado (anual)</b> y vacunación VPH (hasta los 45 años en inmunosuprimidos según guías).",
w:{1:"Subestima el riesgo.",2:"Incorrecto.",3:"No es el estándar."},
p:"Cuidado preventivo anual: piel, cérvix, densitometría si corticoides, salud mental, vacunas.",
m:"La inmunidad celular controla la infección por VPH; su supresión permite persistencia viral e integración oncogénica (E6/E7).",
r:"Farraye FA et al. ACG Preventive Care 2025 · Caldera F et al. AGA CPU 2025"},

{id:"TR41",md:"E",b:"TR",t:"Cuidado preventivo",n:"R",
q:"Anemia en EII activa: Hb 9,4 g/dL, ferritina 70 ng/mL, saturación de transferrina 12%, PCR 25 mg/L. Interpretación y manejo:",
o:["Déficit de hierro (con inflamación, ferritina <100 es compatible): hierro endovenoso","Anemia de enfermedad crónica pura: eritropoyetina","Ferritina normal descarta ferropenia","Hierro oral en dosis altas c/8 h"],
c:0,
e:"Sin inflamación, ferropenia = ferritina <30; <b>con inflamación, ferritina <100</b> (o 100–300 con saturación <20%) sugiere ferropenia (o mixta). Con Hb <10, inflamación activa o intolerancia oral → <b>hierro EV</b> (p. ej. carboximaltosa férrica; vigilar hipofosfatemia). Hierro oral: dosis bajas (100 mg/día o días alternos) si enfermedad inactiva y anemia leve.",
w:{1:"Hay ferropenia asociada; la EPO es excepcional.",2:"La ferritina es reactante de fase aguda.",3:"La absorción está bloqueada por hepcidina y empeora la tolerancia."},
p:"Controlar hemograma y depósitos cada 3 meses en actividad, 6–12 en remisión.",
m:"La IL-6 aumenta la hepcidina, que degrada ferroportina en enterocito y macrófago: bloquea la absorción oral y secuestra el hierro. La vía EV evita ese bloqueo intestinal.",
r:"ECCO anemia guideline · Guía Estudio EII 2026 §13.4"},

{id:"TR42",md:"E",b:"TR",t:"Cuidado preventivo",n:"R",
q:"¿A qué pacientes con EII se sugiere densitometría ósea?",
o:["Uso de corticoides >3 meses (acumulado), hipogonadismo, bajo peso/desnutrición, fractura por fragilidad, mujeres posmenopáusicas y otros factores de riesgo","A todos anualmente","Solo en CU","Nunca"],
c:0,
e:"Densitometría (DXA) en: corticoides ≥3 meses, fractura previa por fragilidad, posmenopausia, hipogonadismo, IMC bajo, EC con malabsorción. Calcio y vitamina D durante corticoides; bifosfonato si osteoporosis u osteopenia con alto riesgo.",
w:{1:"No es necesario en todos.",2:"El riesgo es mayor en EC.",3:"Incorrecto."},
p:"Vitamina D baja se asocia a mayor actividad y peor respuesta; suplementar si hay déficit.",
m:"Los corticoides inhiben osteoblastos y aumentan la resorción; la inflamación (TNF, IL-6) activa RANKL/osteoclastos; la malabsorción de calcio y vitamina D en EC suma déficit.",
r:"ACG Preventive Care 2025"},

{id:"TR43",md:"E",b:"TR",t:"Monitorización (TDM)",n:"F",
q:"Diferencia entre ensayos 'drug-sensitive' y 'drug-tolerant' para anticuerpos anti-fármaco:",
o:["El drug-sensitive no detecta anticuerpos si hay fármaco circulante (resultado 'inconcluso'); el drug-tolerant los detecta aun con fármaco presente, y puede mostrar anticuerpos de poca relevancia clínica","Son equivalentes","El drug-tolerant no detecta anticuerpos neutralizantes","Solo el drug-sensitive sirve para vedolizumab"],
c:0,
e:"ELISA de puente (drug-sensitive): el fármaco libre enmascara los anticuerpos. Ensayos <b>drug-tolerant</b> (disociación ácida, homogéneo de movilidad) detectan anticuerpos con fármaco presente, incluidos títulos bajos no neutralizantes. Por eso los umbrales de título (bajo/alto) son específicos de cada ensayo y conviene usar siempre el mismo laboratorio.",
w:{1:"Difieren en sensibilidad.",2:"Detectan ambos.",3:"No es la distinción."},
p:"Nivel adecuado + anticuerpos altos = revisar el método antes de actuar.",
m:"El fármaco se une al anticuerpo formando complejos que el ensayo de puente no reconoce; al disociar los complejos se revela la fracción de anticuerpos unida.",
r:"Guía Simposio PANCCO–ACTECCU 2026 §9 · AGA TDM 2017"},

{id:"TR44",md:"E",b:"TR",t:"Monitorización (TDM)",n:"R",
q:"¿Por qué la dosificación episódica (a demanda) de infliximab es desaconsejada?",
o:["Aumenta la formación de anticuerpos anti-infliximab, reacciones infusionales y pérdida de respuesta","Aumenta el riesgo de linfoma","Porque el fármaco es muy caro","Porque es menos cómoda"],
c:0,
e:"La exposición intermitente con períodos de nivel indetectable favorece la inmunogenicidad (más anticuerpos, reacciones infusionales, pérdida de respuesta), sobre todo sin inmunomodulador. La mantención programada es el estándar. Al reintroducir tras una pausa larga: premedicar con inmunomodulador, medir anticuerpos si es posible.",
w:{1:"No es el problema principal.",2:"Irrelevante al mecanismo.",3:"Irrelevante."},
p:"Reintroducción tras vacaciones de fármaco: tasas de reacción aceptables con inmunomodulador concomitante y sin anticuerpos previos.",
m:"Niveles valle bajos permiten la presentación del anticuerpo quimérico como antígeno sin tolerancia inducida por exposición continua alta ('tolerancia de zona alta').",
r:"Hanauer SB et al. Clin Gastroenterol Hepatol 2004 · ACCENT I"},

{id:"TR45",md:"E",b:"TR",t:"Farmacocinética",n:"F",
q:"¿Qué factores aumentan el aclaramiento de los anticuerpos monoclonales en EII?",

c:0,
e:"Aclaramiento aumentado: <b>albúmina baja</b>, PCR alta/actividad grave, IMC y peso altos, hombres, colopatía perdedora de proteínas, anticuerpos anti-fármaco. Por eso en inducción de alto riesgo se intensifica o se mide nivel precozmente.",
w:{1:"No es el principal.",2:"Los monoclonales no se eliminan por riñón.",3:"No influye."},
p:"Albúmina y nivel valle suelen correlacionarse: la albúmina es un marcador indirecto de la exposición.",
m:"Albúmina e IgG comparten el receptor FcRn que las rescata de la degradación lisosomal; cuando hay pérdida proteica o catabolismo alto, ambos caen. El TNF abundante actúa además como 'sumidero' del fármaco.",

{id:"TR46",md:"E",b:"TR",t:"Embarazo",n:"R",
q:"Hombre de 30 años con CU en sulfasalazina, con estudio de infertilidad y oligospermia. ¿Conducta?",
o:["Cambiar a mesalazina: la oligospermia por sulfasalazina es reversible en ~2–3 meses","Suspender todo tratamiento","Agregar metotrexato","No tiene relación"],
c:0,
e:"La <b>sulfasalazina</b> (fracción sulfapiridina) produce oligospermia, alteración de la motilidad y morfología, reversible tras 2–3 meses de cambio a mesalazina. Metotrexato en hombres: ECCO sugiere suspenderlo antes de buscar paternidad por precaución (datos tranquilizadores recientes). Tiopurinas y anti-TNF no afectan relevantemente la fertilidad masculina.",
w:{1:"Innecesario.",2:"Contraindicado en el contexto.",3:"Sí tiene relación."},
p:"En mujeres, la sulfasalazina requiere suplemento de ácido fólico 2 mg/día en embarazo.",
m:"La sulfapiridina interfiere con la espermatogénesis y el metabolismo del folato; la mesalazina carece de esa fracción.",
r:"ECCO Pregnancy 2023"},

{id:"TR47",md:"E",b:"TR",t:"Embarazo",n:"F",
q:"Respecto de la lactancia en EII, ¿qué afirmación es correcta?",
o:["Es compatible con 5-ASA, corticoides, tiopurinas, anti-TNF, vedolizumab y ustekinumab; se evitan metotrexato, JAK y S1P","Todos los biológicos contraindican lactancia","Solo mesalazina es compatible","Debe suspenderse cualquier fármaco"],
c:0,
e:"Los anticuerpos monoclonales pasan en cantidades mínimas a la leche y se degradan en el tracto digestivo del lactante; no aumentan infecciones del lactante en los primeros 12 meses (PIANO). Tiopurinas: niveles muy bajos; puede esperarse 4 h tras la dosis. Evitar metotrexato, JAK y S1P (moléculas pequeñas que pasan a la leche sin datos de seguridad).",

p:"Corticoides: con prednisona >20 mg, esperar ~4 h tras la dosis para amamantar.",
m:"Las IgG pasan poco a la leche (la leche contiene sobre todo IgA secretora); las pequeñas moléculas lipofílicas de bajo peso difunden libremente.",

{id:"TR48",md:"E",b:"TR",t:"Manifestaciones extraintestinales",n:"R",
q:"¿Cuál de estas manifestaciones extraintestinales suele seguir la actividad intestinal?",
o:["Eritema nodoso, artritis periférica tipo 1 y epiescleritis","Espondilitis anquilosante","Colangitis esclerosante primaria","Uveítis anterior"],
c:0,
e:"<b>Paralelas a la actividad</b>: artritis periférica tipo 1 (pauciarticular, grandes articulaciones), eritema nodoso, epiescleritis, estomatitis aftosa. <b>Independientes</b>: espondilitis/sacroileítis, uveítis anterior, CEP; el pioderma gangrenoso es parcialmente independiente. Artritis tipo 2 (poliarticular, pequeñas articulaciones) es independiente.",
w:{1:"Independiente.",2:"Independiente.",3:"Independiente; requiere manejo oftalmológico urgente."},
p:"Epiescleritis (sin dolor intenso ni fotofobia, visión normal) vs uveítis (dolor, fotofobia, visión borrosa → urgencia oftalmológica).",
m:"Las manifestaciones paralelas reflejan circulación de linfocitos intestinales activados y complejos inmunes durante el brote; las independientes tienen predisposición genética propia (HLA-B27 en axial) y siguen su curso.",
r:"ECCO EIM guideline · Guía Estudio EII 2026 §3"},

{id:"TR49",md:"E",b:"TR",t:"Manifestaciones extraintestinales",n:"F",
q:"Paciente con CU y CEP. ¿Cuál afirmación es correcta?",
o:["La terapia de la EII (incluido vedolizumab) no ha demostrado modificar el curso de la CEP; la CEP exige vigilancia colónica anual y seguimiento hepatobiliar (colangiocarcinoma, vesícula)","El ácido ursodeoxicólico en dosis altas (28–30 mg/kg) mejora la sobrevida","La colectomía cura la CEP","La CEP protege del CCR"],
c:0,
e:"Ningún tratamiento médico modifica la historia natural de la CEP; vedolizumab no mejora parámetros hepáticos. <b>UDCA en dosis altas</b> se asoció a más eventos adversos graves (evitar). Vigilancia: colonoscopía anual, ecografía/RM anual para vesícula (pólipos ≥8 mm → colecistectomía) y vía biliar. La CEP en EII suele asociar pancolitis leve con 'rectal sparing' e ileítis por reflujo.",
w:{1:"Dosis altas se asociaron a daño.",2:"No modifica la CEP.",3:"La aumenta."},
p:"La CEP aumenta el riesgo de reservoritis crónica tras IPAA.",
m:"La CEP y la EII comparten predisposición genética y tráfico linfocitario (expresión aberrante de MAdCAM-1 en hígado permite homing de linfocitos intestinales al árbol biliar), pero la fibrosis biliar progresa de forma independiente.",
r:"Guía Estudio EII 2026 §3 · CEP y CU (carpeta EII)"},

{id:"TR50",md:"E",b:"TR",t:"Anti-TNF: seguridad",n:"R",
q:"Contraindicaciones o precauciones mayores de los anti-TNF:",
o:["Insuficiencia cardíaca NYHA III–IV, enfermedad desmielinizante, TBC activa/infección grave no controlada, melanoma previo (relativa), linfoma previo (relativa)","Hipertensión arterial","Diabetes mellitus tipo 2","Hipotiroidismo"],
c:0,
e:"Anti-TNF: evitar en IC III–IV (ATTACH), enfermedad desmielinizante (EM, neuritis óptica), infección activa grave, TBC activa, melanoma previo; cautela en linfoma previo. Eventos adversos: infecciones oportunistas, reactivación de TBC/VHB, psoriasis paradójica, lupus inducido, reacciones infusionales.",
w:{1:"No contraindica.",2:"No contraindica.",3:"No contraindica."},
p:"Lupus inducido por anti-TNF: anti-histona y anti-dsDNA positivos, artralgias, serositis; suspender y cambiar de clase.",
m:"El TNF participa en la mielinización/remielinización y la función cardíaca; su bloqueo puede desenmascarar desmielinización y empeorar la función ventricular en IC avanzada.",
r:"ACG CD 2025 · Guía Simposio PANCCO–ACTECCU 2026 §5"},

{id:"TR51",md:"E",b:"TR",t:"Guías: discrepancias",n:"S",
q:"¿Cuál es la discrepancia entre ACG 2025 y STRIDE-II respecto de la meta endoscópica en CU?",
o:["ACG 2025 adopta como objetivo la mejoría endoscópica (MES ≤1); STRIDE-II define curación endoscópica como MES 0 (o UCEIS ≤1)","No hay diferencias","ACG exige remisión histológica","STRIDE-II acepta MES 2"],
c:0,
e:"<b>ACG 2025</b>: objetivo terapéutico = <b>mejoría endoscópica (MES 0–1)</b>. <b>STRIDE-II</b>: curación endoscópica = <b>MES 0</b>. ECCO usa el marco STRIDE-II. En la práctica: MES 0 es más exigente y se asocia a menor recaída (≈14% vs 29% a 12 meses); MES 1 es aceptable si el costo/riesgo de escalar es alto. Ninguno exige histología.",
w:{1:"Sí hay diferencia de umbral.",2:"ACG no la exige.",3:"Incorrecto."},
p:"En un oral: mencionar ambas posturas, luego decidir según riesgo-beneficio individual.",
m:"La friabilidad y el eritema residual del MES 1 reflejan inflamación mucosa persistente; la diferencia de umbral equilibra beneficio pronóstico vs sobretratamiento.",
r:"Rubin DT et al. ACG UC 2025 · STRIDE-II 2021"},

{id:"TR52",md:"E",b:"TR",t:"Actualizaciones 2026",n:"F",
q:"Mecanismo de los anti-TL1A (tulisokibart, duvakitug, afimkibart) y su estado a 2026:",
o:["Bloquean TL1A (ligando de DR3), con potencial antiinflamatorio y antifibrótico; fase 3 en curso (tulisokibart positivo en inducción ATLAS-UC); no aprobados","Son anti-TNF de segunda generación aprobados","Son inhibidores JAK orales","Son moduladores S1P"],
c:0,
e:"TL1A (TNFSF15) se une a DR3 en linfocitos T, ILC y fibroblastos. Los anti-TL1A tienen datos fase 2 positivos (ARTEMIS-UC con tulisokibart, TUSCANY-2 con duvakitug) y fase 3 en curso; tulisokibart comunicó inducción fase 3 positiva en CU (ATLAS-UC). No aprobados: <b>pipeline, no estándar</b>. Interés en EC fibroestenosante y biomarcador genético de respuesta.",
w:{1:"No son anti-TNF ni están aprobados.",2:"Son anticuerpos monoclonales.",3:"Otro mecanismo."},
p:"Obefazimod (oral, miR-124) completó fase 3 ABTECT en CU; solicitud FDA proyectada.",
m:"TL1A amplifica respuestas Th1/Th17 y activa fibroblastos (producción de colágeno y migración); variantes de TNFSF15 se asocian a EC. Bloquear el eje podría frenar inflamación y fibrosis a la vez.",
r:"Sands BE et al. NEJM 2024 (ARTEMIS-UC, fase 2) · Guía Simposio PANCCO–ACTECCU 2026 §22"},

{id:"TR53",md:"E",b:"TR",t:"Seguridad y cáncer",n:"F",
q:"Paciente con EII y cáncer de mama tratado hace 18 meses, en seguimiento oncológico. Necesita terapia de mantención. Según ACTECCU 2026, ¿qué evitar?",
o:["Inmunomoduladores (tiopurinas, metotrexato) en cáncer <2 años o activo; preferir vedolizumab o anti-IL-23/ustekinumab con decisión conjunta","Todo tratamiento de la EII","Mesalazina","Vedolizumab"],
c:0,
e:"ACTECCU 2026: con cáncer diagnosticado hace <2 años o activo, evitar inmunomoduladores. Si ya estaba en biológico, puede continuarse bajo evaluación multidisciplinaria (sin aumento consistente de recurrencia en datos disponibles). Registros SAPPHIRE e I-CARE en curso.",
w:{1:"La EII no controlada también es riesgo.",2:"Segura.",3:"Opción preferente."},
p:"Antecedente de melanoma → evitar anti-TNF; cáncer de piel no melanoma → evitar tiopurinas.",
m:"Las tiopurinas son mutagénicas y reducen vigilancia inmune; mecanismos más selectivos (α4β7, IL-23) no tienen señal oncológica demostrada.",
r:"Núñez P et al. ACTECCU. Rev Med Chile 2026;154:105-31"},

{id:"TR54",md:"E",b:"TR",t:"Salud mental",n:"R",
q:"Respecto de salud mental en EII, ¿qué recomendación es correcta?",
o:["Tamizar activamente ansiedad y depresión (p. ej. PHQ-9, GAD-7), porque son prevalentes y empeoran desenlaces; derivar y tratar","Solo si el paciente lo pide","Los síntomas psicológicos siempre se deben a la actividad","Evitar antidepresivos en EII"],
c:0,
e:"Ansiedad y depresión afectan a ~1 de cada 3–4 pacientes (más en actividad) y se asocian a más recaídas, hospitalización y peor adherencia. Tamizaje sistemático; neuromoduladores (tricíclicos, IRSN) útiles también en dolor crónico e intestino irritable superpuesto. Evitar opioides.",
w:{1:"Subdiagnóstico frecuente.",2:"Hay bidireccionalidad, no causalidad única.",3:"Son seguros y útiles."},
p:"Síntomas persistentes con remisión objetiva → considerar intestino irritable superpuesto (hasta un tercio).",
m:"El eje intestino-cerebro es bidireccional: citoquinas inflamatorias alteran neurotransmisión y el estrés modifica permeabilidad y actividad inmune mucosa.",
r:"ACG Preventive Care 2025 · Guía Estudio EII 2026 §17"},

{id:"TR55",md:"E",b:"TR",t:"Colitis microscópica",n:"R",
q:"Mujer de 67 años con diarrea acuosa crónica, colonoscopía macroscópicamente normal y biopsias con banda de colágeno subepitelial engrosada. Tratamiento de primera línea:",
o:["Budesonida 9 mg/día × 6–8 semanas","Mesalazina 4 g/día","Infliximab","Metronidazol"],
c:0,
e:"<b>Colitis colágena</b> (colitis microscópica): diagnóstico exclusivamente histológico. Suspender fármacos asociados (AINE, IBP, ISRS, estatinas). Primera línea: <b>budesonida 9 mg/día</b> 6–8 semanas; recaída frecuente → budesonida en dosis baja de mantención. Refractaria: tiopurinas, anti-TNF, vedolizumab.",
w:{1:"Inferior a budesonida.",2:"Solo en refractaria.",3:"Sin rol."},
p:"Tomar biopsias de colon derecho e izquierdo en toda diarrea crónica acuosa con colonoscopía normal.",
m:"La inflamación mucosa linfocitaria y la banda de colágeno alteran la absorción de agua; la budesonida con alto primer paso actúa localmente con poca toxicidad sistémica.",
r:"Miehlke S et al. UEG/EMCG guideline 2021"},

{id:"TR56",md:"E",b:"TR",t:"Monitorización",n:"R",
q:"Según STRIDE-II, ¿cuándo corresponde la endoscopía de control tras iniciar una terapia?",
o:["CU: 3–6 meses; EC: 6–9 meses","Solo cuando hay síntomas","A las 2 semanas","Anual siempre"],
c:0,
e:"STRIDE-II: clínica y PCR c/3 meses con actividad; calprotectina c/3 meses con actividad y c/6–12 meses en remisión; endoscopía de reevaluación a los <b>3–6 meses en CU</b> y <b>6–9 meses en EC</b> tras iniciar terapia. En la práctica la IUS puede anticipar la respuesta.",
w:{1:"Contrario al treat-to-target.",2:"Demasiado precoz.",3:"No es el calendario."},
p:"Normalización de PCR esperable en 5–15 semanas; de calprotectina en 12–19 semanas.",
m:"La curación mucosa requiere semanas a meses según el mecanismo; evaluar antes subestima la respuesta, evaluar después prolonga inflamación no controlada.",
r:"STRIDE-II 2021 · STRIDE I-II-III consulta rápida"},

{id:"CU53",md:"E",b:"CU",t:"CU aguda grave",n:"F",
q:"Hidrocortisona vs metilprednisolona en CUAG: equivalencia de dosis correcta:",
o:["Hidrocortisona 100 mg c/6–8 h (300–400 mg/día) ≈ metilprednisolona 60 mg/día","Hidrocortisona 100 mg/día ≈ metilprednisolona 60 mg","Metilprednisolona 1 g/día es superior","Prednisona oral 20 mg es equivalente"],
c:0,
e:"Hidrocortisona 400 mg/día ≈ metilprednisolona 60–80 mg/día ≈ prednisolona 80–100 mg. Metilprednisolona ≤60 mg/día (dosis mayores no aportan beneficio). La hidrocortisona tiene más efecto mineralocorticoide (hipopotasemia, retención hídrica).",
w:{1:"Dosis insuficiente.",2:"Pulsos sin beneficio.",3:"Muy inferior."},
p:"Controlar potasio: la hipopotasemia es precipitante de megacolon tóxico.",
m:"Equivalencias por potencia glucocorticoide: hidrocortisona 1, prednisolona 4, metilprednisolona 5. La hidrocortisona conserva actividad mineralocorticoide significativa.",
r:"ECCO UC Medical 2026 rec. 43 · Guía Simposio PANCCO–ACTECCU 2026 §12"},

{id:"CU54",md:"E",b:"CU",t:"Posicionamiento terapéutico",n:"F",
q:"CU bio-naïve, moderada, sin manifestaciones extraintestinales, preferencia por vía oral y enfermedad no grave. Según el posicionamiento del simposio PANCCO–ACTECCU 2026, ¿qué opciones son preferentes?",
o:["Moduladores S1P (ozanimod/etrasimod) o JAK, considerando perfil de riesgo; vedolizumab si acepta vía parenteral","Solo infliximab","Metotrexato oral","Tacrolimus"],
c:0,
e:"En CU bio-naïve sin MEI: vedolizumab, S1P, ustekinumab/anti-IL-23 o infliximab. Con preferencia oral y enfermedad no grave: S1P (mejor perfil de seguridad oral) o JAK (más potente y rápido, con restricciones por edad/riesgo CV). Luego ajustar por acceso (LRS cubre solo anti-TNF).",
w:{1:"No es la única opción.",2:"Sin eficacia en CU.",3:"No es opción estándar."},
p:"S1P: eficacia menor en bioexpuestos y en CU grave.",
m:"S1P no bloquea citoquinas; secuestra linfocitos. Es eficaz en inflamación moderada, pero su inicio es más lento que el JAK.",
r:"Guía Simposio PANCCO–ACTECCU 2026 §7 · ECCO UC Medical 2026 rec. 39–42"},

{id:"EC47",md:"E",b:"EC",t:"Anti-integrina",n:"R",
q:"Vedolizumab en EC: ¿qué característica condiciona su evaluación de respuesta?",
o:["Inicio lento: la respuesta puede tardar hasta la semana 10–14; en respondedores parciales una dosis extra a la semana 10 puede recapturar","Respuesta en 48 horas","Se evalúa a la semana 2","Solo es útil en EC perianal"],
c:0,
e:"GEMINI 2/3: mayor efecto entre las semanas 6 y 10, con ganancias hasta la 14 (sobre todo en bioexpuestos). Evaluar a la semana 14 antes de declarar falla; intensificación a c/4 semanas en pérdida de respuesta. Eficacia débil en perianal.",
w:{1:"Es de acción lenta.",2:"Demasiado precoz.",3:"Débil en perianal."},
p:"Vedolizumab previene recurrencia posquirúrgica (REPREVIO).",
m:"Al bloquear el reclutamiento de nuevos linfocitos, el efecto depende de la salida natural del infiltrado ya presente en la mucosa, que toma semanas.",
r:"Sands BE et al. Gastroenterology 2014 (GEMINI 3) · Sandborn WJ et al. NEJM 2013 (GEMINI 2)"},

{id:"EC48",md:"E",b:"EC",t:"Objetivos (STRIDE-II)",n:"R",
q:"Definición STRIDE-II de remisión clínica en EC con PRO2:",
o:["Dolor abdominal ≤1 y frecuencia de deposiciones líquidas/muy blandas ≤3 (o HBI <5)","CDAI <220","Ausencia de fístulas","SES-CD <7"],
c:0,
e:"STRIDE-II EC: respuesta clínica = reducción ≥50% del PRO2 (corto plazo); remisión clínica = PRO2 con dolor ≤1 y frecuencia ≤3 (o HBI <5) + PCR normal (corto-intermedio); calprotectina 100–250 (intermedio); SES-CD <3 o sin ulceraciones (largo plazo).",
w:{1:"Umbral de actividad leve-moderada del CDAI.",2:"No es la definición.",3:"Umbral endoscópico incorrecto."},
p:"PRO2 = dolor abdominal + frecuencia de deposiciones (EC) / sangrado + frecuencia (CU).",
m:"Los PRO capturan lo que el paciente siente sin la carga de variables no inflamatorias del CDAI; por eso se usan como metas de corto plazo, siempre confirmadas con biomarcadores.",
r:"STRIDE-II 2021"},

{id:"EC49",md:"E",b:"EC",t:"Complicaciones",n:"F",
q:"EC con fístula enterovesical (neumaturia, infecciones urinarias recurrentes). ¿Estudio y manejo?",
o:["Entero-RM/TC (± cistoscopía); manejo médico-quirúrgico: control infeccioso, terapia avanzada (anti-TNF) y resección del segmento con reparación vesical según evolución","Solo antibióticos profilácticos indefinidos","Nefrostomía","Observación"],
c:0,
e:"Las fístulas internas (enterovesicales, enterocutáneas, entero-entéricas sintomáticas) requieren abordaje conjunto: anti-TNF como base médica, pero muchas enterovesicales terminan en resección del segmento intestinal y cierre vesical, especialmente con infecciones recurrentes. Entero-entéricas asintomáticas pueden manejarse médicamente.",
w:{1:"No trata la causa.",2:"No indicado.",3:"Riesgo de urosepsis."},
p:"Fecaluria es casi patognomónica.",
m:"La inflamación transmural con microperforación penetra órganos adyacentes; el trayecto epitelizado rara vez cierra solo si persiste la enfermedad del segmento origen.",
r:"ACG CD 2025 · ECCO CD Surgical"}
];
