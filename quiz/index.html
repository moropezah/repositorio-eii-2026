<style>
:root{
  --bg:#F4F2EF; --surface:#FFFFFF; --surface2:#F9F7F5; --ink:#1E1A1D; --muted:#675F66; --line:#E3DDD8;
  --accent:#8C2F45; --accent-ink:#FFFFFF; --accent-soft:#F4E4E8;
  --cu:#8C2F45; --ec:#2D5C8A; --tr:#56662F;
  --ok:#1D7A4E; --ok-soft:#E3F2EA; --bad:#B0281E; --bad-soft:#FBE7E4; --warn:#9A5B00; --warn-soft:#FBF0DC;
  --shadow:0 1px 2px rgba(40,20,30,.06),0 4px 16px rgba(40,20,30,.05);
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#151214; --surface:#1F1B1E; --surface2:#262126; --ink:#EEE8EB; --muted:#A79CA4; --line:#372F35;
    --accent:#E58AA0; --accent-ink:#22121A; --accent-soft:#3A2129;
    --cu:#E58AA0; --ec:#86B0DC; --tr:#B2C282;
    --ok:#62C792; --ok-soft:#173226; --bad:#F2887D; --bad-soft:#3A1C1A; --warn:#E6B45F; --warn-soft:#352812;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#151214; --surface:#1F1B1E; --surface2:#262126; --ink:#EEE8EB; --muted:#A79CA4; --line:#372F35;
  --accent:#E58AA0; --accent-ink:#22121A; --accent-soft:#3A2129;
  --cu:#E58AA0; --ec:#86B0DC; --tr:#B2C282;
  --ok:#62C792; --ok-soft:#173226; --bad:#F2887D; --bad-soft:#3A1C1A; --warn:#E6B45F; --warn-soft:#352812;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .row{max-width:980px;margin:0 auto;padding:12px 16px 0;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:700;font-size:21px;letter-spacing:-.01em}
.brand small{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400;margin-left:8px;letter-spacing:.04em}
.tabs{max-width:980px;margin:0 auto;padding:8px 16px 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;color:var(--muted);font:600 14px var(--sans);padding:8px 12px 10px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.badge{font-family:var(--mono);font-size:11px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:4px;color:var(--muted)}

.filters{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:18px 0 14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;font:500 13px var(--sans);color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.flabel{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:6px}
select{font:500 13px var(--sans);padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.qcard{padding:22px 22px 18px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.chip{font:600 11px var(--mono);letter-spacing:.04em;padding:2px 8px;border-radius:5px;border:1px solid var(--line);color:var(--muted);background:var(--surface2)}
.chip.b-CU{color:var(--cu);border-color:currentColor;background:transparent}
.chip.b-EC{color:var(--ec);border-color:currentColor;background:transparent}
.chip.b-TR{color:var(--tr);border-color:currentColor;background:transparent}
.chip.lv-S{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.fix{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.chip.new{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.counter{margin-left:auto;font:500 12px var(--mono);color:var(--muted)}
.stem{font-family:var(--serif);font-size:18.5px;line-height:1.5;margin:0 0 16px;max-width:68ch;text-wrap:pretty}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font:15px/1.45 var(--sans);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .L{flex:0 0 26px;height:26px;border-radius:6px;display:grid;place-items:center;font:600 13px var(--mono);background:var(--surface2);border:1px solid var(--line)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .L{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
.btn{font:600 14px var(--sans);padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:none}
.spacer{flex:1}

.explain{margin-top:18px;border-top:1px solid var(--line);padding-top:16px;display:grid;gap:14px}
.verdict{font:700 15px var(--sans)}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.blk h4{margin:0 0 6px;font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.blk p,.blk li{margin:0;max-width:72ch}
.blk ul{margin:0;padding-left:0;list-style:none;display:grid;gap:6px}
.blk li b.L{font-family:var(--mono);margin-right:6px}
.mech{background:var(--surface2);border-left:3px solid var(--ec);padding:12px 14px;border-radius:0 8px 8px 0}
.pearl{background:var(--accent-soft);padding:12px 14px;border-radius:8px}
.fixbox{background:var(--warn-soft);padding:10px 14px;border-radius:8px;color:var(--ink)}
.newbox{background:var(--ok-soft);padding:10px 14px;border-radius:8px}
.refs{font-size:13px;color:var(--muted)}

.palette{display:flex;flex-wrap:wrap;gap:4px;margin-top:16px}
.palette button{width:30px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font:500 11px var(--mono);color:var(--muted);cursor:pointer}
.palette button.cur{border-color:var(--accent);color:var(--ink);font-weight:700}
.palette button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.palette button.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.palette button.ans{background:var(--accent-soft)}

.setup{padding:22px;display:grid;gap:16px}
.setup h2,.panel h2{font-family:var(--serif);font-size:22px;margin:0;text-wrap:balance}
.setup p{margin:0;color:var(--muted);max-width:68ch}
.timer{font:600 14px var(--mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.progressbar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:0 0 14px}
.progressbar i{display:block;height:100%;background:var(--accent);transition:width .3s}

.score{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end;padding:22px}
.score .big{font:700 52px/1 var(--serif);font-variant-numeric:tabular-nums}
.score .sub{color:var(--muted)}
.bars{display:grid;gap:8px;padding:0 22px 22px}
.bar{display:grid;grid-template-columns:minmax(120px,190px) 1fr 56px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:8px;background:var(--surface2);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.bar .track i{display:block;height:100%}
.bar .v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.review{display:grid;gap:10px;margin-top:16px}
details.rv{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
details.rv summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;list-style:none}
details.rv summary::-webkit-details-marker{display:none}
.mark{font:700 13px var(--mono);flex:0 0 auto}
.mark.ok{color:var(--ok)} .mark.bad{color:var(--bad)} .mark.na{color:var(--muted)}
.rvq{font-size:14px}

.flash{perspective:1400px;margin-top:6px}
.fc{position:relative;min-height:300px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;padding:24px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.fc .back{transform:rotateY(180deg)}
.fc .face .hint{margin-top:auto;font-size:12px;color:var(--muted)}
.fc .ans{font-family:var(--serif);font-size:19px;font-weight:600}
@media (prefers-reduced-motion:reduce){.fc{transition:none}.progressbar i{transition:none}}

.panel{padding:22px;display:grid;gap:14px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
td.id{font-family:var(--mono);white-space:nowrap}
.gloss{columns:2 260px;column-gap:28px;font-size:14px}
.gloss div{break-inside:avoid;padding:3px 0}
.gloss b{font-family:var(--mono);font-size:13px}
.muted{color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}

#printArea{display:none}
textarea.dump{width:100%;min-height:180px;font:12px var(--mono);background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
.expgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.expgrid .card{padding:16px;display:grid;gap:8px;align-content:start}
.expgrid h3{margin:0;font:600 15px var(--sans)}
.expgrid p{margin:0;font-size:13px;color:var(--muted)}
@media print{
  body.printing header.top, body.printing main{display:none!important}
  body.printing #printArea{display:block!important;color:#000;background:#fff;font:11pt/1.4 Georgia,serif}
  #printArea .pq{break-inside:avoid;border-bottom:1px solid #999;padding:8pt 0}
  #printArea .pq h4{font:600 9pt Arial,sans-serif;margin:0 0 4pt;color:#444}
  #printArea .pq p{margin:3pt 0}
  #printArea .pb{break-before:page}
}
@media (max-width:560px){.brand small{display:none}.top .row{padding-top:8px}#themeBtn{padding:6px 10px;font-size:13px}.qcard{padding:16px}.stem{font-size:17px}.bar{grid-template-columns:110px 1fr 48px}.score .big{font-size:42px}}
</style>

<script>
// ═══ BLOQUE COLITIS ULCEROSA (CU) ═══
const Q_CU = [
{id:"CU01",b:"CU",t:"CU aguda grave",n:"R",
q:"Mujer de 34 años con colitis ulcerosa (CU) extensa ingresa con 9 deposiciones con sangre/día, FC 104 lpm, T° 37,9 °C, Hb 9,8 g/dL y PCR 88 mg/L. Toxina de <i>C. difficile</i> pendiente. ¿Cuál de las siguientes indicaciones de ingreso es INCORRECTA?",
o:["Metilprednisolona 60 mg/día IV (o hidrocortisona 100 mg c/6–8 h)","Heparina de bajo peso molecular profiláctica pese a la rectorragia","Loperamida y un antiespasmódico para controlar la urgencia","Rectosigmoidoscopía sin preparación en las primeras 24–48 h con biopsias para citomegalovirus"],
c:2,
e:"Cumple criterios de Truelove-Witts (≥6 deposiciones con sangre + ≥1 signo sistémico): <b>colitis ulcerosa aguda grave (CUAG)</b>. Antidiarreicos, opioides y anticolinérgicos están <b>contraindicados</b>: precipitan megacolon tóxico. El resto es el paquete estándar del día 0: corticoide IV, tromboprofilaxis universal, rectosigmoidoscopía precoz con biopsias (CMV por hematoxilina-eosina + inmunohistoquímica), estudio de <i>C. difficile</i> e interconsulta quirúrgica desde el ingreso.",
w:{0:"Correcta. Es la primera línea (ECCO 2026, rec. 43). Dosis >60 mg/día de metilprednisolona no aportan beneficio.",1:"Correcta. El riesgo de tromboembolismo venoso se duplica en la EII hospitalizada; la rectorragia no contraindica la profilaxis (NNT 35 vs NNH 114).",3:"Correcta. La endoscopía precoz confirma la gravedad (UCEIS) y permite descartar CMV. AGA 2026: sigmoidoscopía <48 h reduce estadía y costos."},
p:"En CUAG también se <b>suspende el 5-ASA oral</b>: ECCO 2026 (rec. 44) sugiere no añadirlo a los corticoides IV.",
nuevo:"ECCO 2026 rec. 44: no añadir 5-ASA oral al corticoide IV (antes se mantenía por inercia).",
r:"ECCO UC Medical 2026 (JCC 20(7):jjag066) rec. 43–44 · AGA CPU Inpatient IBD 2026 (Gastroenterology 170:408) · ACG UC 2025"},

{id:"CU02",b:"CU",t:"CU aguda grave",n:"R",
q:"Paciente con CUAG en su día 3 de metilprednisolona IV. Hoy presenta 5 deposiciones con sangre y PCR 52 mg/L. ¿Cómo interpretas los criterios de Oxford (Travis)?",
o:["Negativos: se requieren >8 deposiciones/día para que sean positivos","Positivos: 3–8 deposiciones/día con PCR >45 mg/L predice ~85% de colectomía → preparar/iniciar rescate","Positivos solo si además la albúmina es <30 g/L","No aplicables: se evalúan recién al día 7"],
c:1,
e:"Criterios de Oxford (Travis, Gut 1996) al <b>día 3</b> de corticoide IV: <b>>8 deposiciones/día</b>, <b>o</b> <b>3–8 deposiciones/día + PCR >45 mg/L</b>. Cualquiera de los dos predice ~85% de colectomía en esa hospitalización → rescate médico (infliximab o ciclosporina) o cirugía.",
w:{0:"Error clásico: el criterio tiene dos ramas. Con 3–8 deposiciones basta que la PCR sea >45 mg/L.",2:"La albúmina forma parte del índice ACE (al ingreso) y del índice de Ho, no de los criterios de Oxford.",3:"La decisión es al día 3 (AGA 2026: evaluar respuesta dentro de 72 h). Prolongar corticoide IV >7 días en no respondedores aumenta morbimortalidad."},
p:"No confundir con el <b>índice de Lindgren</b> (Seo): deposiciones/día + 0,14 × PCR (mg/L); >8 predice falla corticoidea. Son herramientas distintas.",
fix:"v5 describía Oxford como 'PCR >45 Y >8 deposiciones' y lo mezclaba con Lindgren.",
r:"Travis SP et al. Gut 1996;38:905-10 · ECCO UC Medical 2026 · AGA CPU Inpatient IBD 2026"},

{id:"CU03",b:"CU",t:"CU aguda grave",n:"F",
q:"Al ingreso por CUAG: albúmina 27 g/L, PCR 78 mg/L y rectosigmoidoscopía con úlceras profundas y sangrado espontáneo (UCEIS 7). ¿Qué implica este perfil?",
o:["Índice ACE 3: alto valor predictivo de falla a corticoides IV → preparar el rescate desde el día 1","Índice ACE 1: bajo riesgo, completar 7 días de corticoide antes de reevaluar","Indicación de colectomía inmediata sin prueba de corticoide","Solo tiene valor pronóstico si se repite al día 3"],
c:0,
e:"El <b>índice ACE</b> (Albúmina ≤30 g/L, PCR ≥50 mg/L, Endoscopía grave) se calcula <b>al ingreso</b>. ACE 3 → VPP ~78% de no respuesta a corticoides IV; ACE 0 → VPN ~87%. No reemplaza la prueba de corticoide, pero permite anticipar: perfil lipídico, Mg, tamizaje TBC/VHB, gestión del fármaco de rescate y conversación quirúrgica.",
w:{1:"Cumple los tres componentes: ACE 3.",2:"Sin perforación, megacolon ni hemorragia masiva, la colectomía inmediata no está indicada; primero corticoide IV.",3:"Es un índice de ingreso; su utilidad es precisamente la anticipación."},
p:"La hipoalbuminemia además marca <b>colopatía perdedora de proteínas</b> → aclaramiento acelerado de infliximab (pérdida fecal del anticuerpo).",
r:"Adams A et al. Inflamm Bowel Dis 2020 (ACE) · Guía Estudio EII 2026 §6.4"},

{id:"CU04",b:"CU",t:"CU aguda grave",n:"F",
q:"CUAG corticorrefractaria al día 3, albúmina 26 g/L. Decides rescate con infliximab. Respecto de la inducción intensificada (10 mg/kg o esquema acelerado), ¿qué afirmación es la más precisa en 2026?",
o:["Es el estándar para todo paciente con CUAG según ECCO 2026","PREDICT-UC demostró superioridad de 10 mg/kg sobre 5 mg/kg en colectomía a 3 meses","ECCO 2026 considera la evidencia insuficiente para su uso rutinario; puede individualizarse (hipoalbuminemia, niveles bajos al día 3)","Está contraindicada por mayor riesgo de infección grave"],
c:2,
e:"<b>PREDICT-UC</b> (5 vs 10 mg/kg) no mostró superioridad en su desenlace primario. Sí demostró el fundamento farmacocinético: nivel de infliximab al día 3 ≤57,9 µg/mL predice falla (VPN 97%) y hay pérdida fecal del fármaco. Por eso <b>ECCO 2026 rec. 46</b>: evidencia insuficiente para dosis mayores o intervalos más cortos de rutina; se puede considerar dosificación individualizada. La AGA mantiene la intensificación en el subgrupo con colopatía perdedora de proteínas.",
w:{0:"No es estándar universal; es una decisión individualizada.",1:"El desenlace primario fue negativo.",3:"No hay señal de exceso de infecciones graves que la contraindique."},
p:"Intensificar <b>guiado por albúmina y nivel sérico</b>, no de forma sistemática.",
nuevo:"PREDICT-UC (2024–2026) + ECCO 2026 rec. 46 reemplazan la práctica de 'doble dosis para todos'.",
r:"Choy MC et al. Lancet Gastroenterol Hepatol 2024;9:981-96 · ECCO UC Medical 2026 rec. 46 · AGA CPU Inpatient 2026"},

{id:"CU05",b:"CU",t:"CU aguda grave",n:"R",
q:"Antes de iniciar ciclosporina IV como rescate en CUAG, ¿qué parámetros debes verificar específicamente por el riesgo de convulsiones?",
o:["Ferritina y saturación de transferrina","Magnesio y colesterol séricos","TSH y cortisol basal","Amilasa y lipasa"],
c:1,
e:"La <b>hipomagnesemia</b> y la <b>hipocolesterolemia</b> (<120 mg/dL) aumentan la neurotoxicidad de los inhibidores de calcineurina (convulsiones). Dosis: <b>2 mg/kg/día IV</b> en infusión continua, niveles 150–250 ng/mL. Es un <b>puente</b>: exige estrategia de mantención (tiopurina, vedolizumab u otro). Eficacia equivalente a infliximab (CySIF, CONSTRUCT); ECCO 2026 rec. 45: ciclosporina o infliximab (fuerte, certeza alta).",
w:{0:"Relevante para anemia, no para toxicidad de ciclosporina.",2:"No son requisitos del rescate.",3:"No son requisitos de seguridad para ciclosporina."},
p:"Paciente que ya falló tiopurina: la ciclosporina pierde su puente natural → preferir infliximab (o JAK).",
r:"ECCO UC Medical 2026 rec. 45 · Laharie D et al. Lancet 2012 (CySIF) · Williams JG et al. Lancet Gastroenterol Hepatol 2016 (CONSTRUCT)"},

{id:"CU06",b:"CU",t:"CU aguda grave",n:"S",
q:"Rescate con infliximab 5 mg/kg al día 4 en CUAG. Al día 10 persiste con 8 deposiciones con sangre y PCR 60 mg/L. ¿Conducta?",
o:["Iniciar ciclosporina IV como segundo rescate en sala general","Agregar upadacitinib 45 mg/día y reevaluar en 2 semanas","Colectomía (subtotal con ileostomía terminal); un tercer rescate solo en pacientes muy seleccionados en centro experto tras discutir cirugía","Aumentar metilprednisolona a 1 g/día por 3 días"],
c:2,
e:"Falla al rescate a los 5–7 días → <b>colectomía</b>. La cirugía de urgencia en agudo es la colectomía subtotal con ileostomía terminal, dejando la reconstrucción para después. <b>ECCO 2026 rec. 47</b>: un rescate secuencial de tercera línea (infliximab, inhibidor de calcineurina o JAK) solo puede considerarse en pacientes altamente seleccionados, en centros multidisciplinarios con experiencia y tras discutir las opciones quirúrgicas.",
w:{0:"Encadenar rescates fuera de centro experto aumenta complicaciones y mortalidad sin evidencia de beneficio.",1:"Sería un tercer rescate de facto, sin justificación fuera de un centro experto.",3:"Pulsos de corticoide no tienen rol en CUAG."},
p:"Retrasar la colectomía —no indicarla— es lo que empeora los desenlaces.",
r:"ECCO UC Medical 2026 rec. 47 · ECCO UC Surgical 2026 · AGA CPU Inpatient 2026"},

{id:"CU07",b:"CU",t:"CU aguda grave",n:"S",
q:"Respecto de los inhibidores JAK en la CUAG corticorrefractaria, ¿qué afirmación es correcta?",
o:["Tienen aprobación regulatoria específica para CUAG","El único ECA (TACOS) evaluó tofacitinib como complemento al corticoide IV y mostró mayor respuesta y menos necesidad de rescate","ATTRACT demostró que upadacitinib es superior a tofacitinib en colectomía a 6 meses","Están contraindicados en CUAG por el riesgo trombótico"],
c:1,
e:"ECCO 2026 (<b>punto de práctica 2</b>) los describe como la alternativa más prometedora: absorción rápida y sin dependencia de la albúmina. <b>TACOS</b>: tofacitinib + corticoide IV vs corticoide IV → respuesta 83,0% vs 58,8%; necesidad de rescate a 90 días 13% vs 38%. <b>ATTRACT</b> (retrospectivo, n=111): upadacitinib responde más rápido (días 3–7: 84% vs 54%), pero converge al día 98 y la sobrevida libre de colectomía es similar. Uso fuera de ficha técnica.",
w:{0:"Sin indicación aprobada en CUAG (fuera de ficha).",2:"La ventaja fue de velocidad; la colectomía fue similar. Además es retrospectivo con probable sesgo de indicación.",3:"El riesgo trombótico obliga a mantener tromboprofilaxis y a seleccionar, no los contraindica."},
p:"Algunos esquemas usan tofacitinib 10 mg c/8 h; es off-label y requiere tromboprofilaxis.",
nuevo:"ECCO 2026 incorpora a los JAK como alternativa en CUAG (punto de práctica 2).",
r:"ECCO UC Medical 2026 PP2 · TACOS (ECA tofacitinib + corticoide IV, resumido en ECCO 2026 PP2) · Honap S et al. Clin Gastroenterol Hepatol 2026;24:784 (ATTRACT)"},

{id:"CU08",b:"CU",t:"CU aguda grave",n:"R",
q:"Paciente con CUAG que respondió a metilprednisolona IV al día 4 (<4 deposiciones sin sangre por 2 días). Es naïve a terapia avanzada. ¿Qué estrategia de mantención es la MENOS adecuada según ECCO 2026?",
o:["Prednisona oral con descenso + mantención solo con mesalazina","Prednisona oral con descenso + infliximab ± tiopurina","Prednisona oral con descenso + vedolizumab","Prednisona oral con descenso + upadacitinib o tofacitinib"],
c:0,
e:"<b>ECCO 2026, punto de práctica 1</b>: en el respondedor a corticoide IV se sugiere <b>no</b> mantener solo con tiopurinas o 5-ASA. Un episodio de CUAG identifica un fenotipo de alto riesgo (recaída y colectomía): corresponde terapia avanzada. El ensayo ACTIVE exploró infliximab + azatioprina top-down tras respuesta a corticoides.",
w:{1:"Opción válida y con mayor experiencia.",2:"Opción válida en perfil de riesgo infeccioso o comorbilidad; el inicio más lento se cubre con el descenso del corticoide.",3:"Opción válida; control rápido de síntomas."},
p:"La hospitalización por CUAG es por sí sola un factor de mal pronóstico que justifica escalar.",
nuevo:"ECCO 2026 PP1: no mantener solo con 5-ASA o tiopurinas tras CUAG.",
r:"ECCO UC Medical 2026 PP1 · Vasudevan A et al. Gut 2025;74:197 (ACTIVE)"},

{id:"CU09",b:"CU",t:"Infecciones en CU",n:"F",
q:"CU con brote que no responde a corticoides IV. Las biopsias muestran inclusiones de citomegalovirus (CMV) por inmunohistoquímica, abundantes (≥5 por fragmento). ¿Conducta?",
o:["Suspender corticoides e inmunosupresores y observar","Ganciclovir IV manteniendo el tratamiento de la CU, y reevaluar la necesidad de rescate","Ignorar: el CMV en mucosa es siempre un espectador","Colectomía urgente por colitis por CMV"],
c:1,
e:"El diagnóstico es <b>histológico</b> (hematoxilina-eosina + inmunohistoquímica); la PCR sérica apoya pero no descarta. Tratar con <b>ganciclovir</b> cuando hay colitis activa, carga histológica alta y refractariedad a corticoides. No se suspende el tratamiento de la EII: la infección se trata en paralelo.",
w:{0:"Suspender la inmunosupresión deja la CU sin tratar y no mejora el pronóstico.",2:"Con carga alta y corticorrefractariedad, el CMV sí es patogénico.",3:"La colectomía queda para complicaciones o falla de tratamiento médico, no por el hallazgo aislado."},
p:"Sin carga alta ni refractariedad, la detección aislada de CMV (sobre todo por PCR tisular) muchas veces no requiere tratamiento.",
r:"ECCO Infecciones 2026 (JCC 20(7):jjag071) · Guía Estudio EII 2026 §13.2"},

{id:"CU10",b:"CU",t:"Infecciones en CU",n:"R",
q:"Paciente con CU en ustekinumab consulta por aumento de deposiciones. Toxina de <i>C. difficile</i> positiva (ensayo multipaso). Sin criterios de CUAG. Según la AGA 2026, ¿cuál es la conducta?",
o:["Metronidazol oral por 10 días y suspender ustekinumab","Fidaxomicina (o vancomicina oral si no está disponible) y continuar ustekinumab","Vancomicina oral y cambiar ustekinumab por vedolizumab por menor riesgo de <i>C. difficile</i>","Probióticos y observar"],
c:1,
e:"<b>AGA Clinical Practice Update 2026</b> sobre <i>C. difficile</i> en EII: <b>fidaxomicina de preferencia</b> (vancomicina oral si no hay disponibilidad o costo prohibitivo); <b>metronidazol no</b>. <b>No suspender</b> inmunomoduladores, biológicos ni moléculas pequeñas. Ningún mecanismo tiene riesgo diferencial → no se cambia de clase por la infección. Terapias basadas en microbiota tras ≥1 recurrencia.",
w:{0:"Metronidazol ya no debe usarse; y suspender el biológico no está indicado.",2:"Ninguna clase tiene riesgo diferencial de <i>C. difficile</i>.",3:"Los probióticos no se recomiendan para prevención primaria ni secundaria."},
p:"Si no mejora en 48–72 h: endoscopía para evaluar actividad de la EII y descartar CMV.",
nuevo:"AGA 2026: fidaxomicina preferida; metronidazol proscrito.",
r:"Khanna S et al. AGA CPU C. difficile in IBD. Gastroenterology 2026;171:184-92"},

{id:"CU11",b:"CU",t:"CU leve–moderada",n:"R",
q:"Mujer de 25 años con proctitis ulcerosa (E1) leve-moderada. ¿Cuál es el tratamiento de inducción de primera línea?",
o:["Mesalazina oral 4 g/día en monoterapia","Mesalazina supositorio 1 g/día","Budesonida MMX 9 mg/día","Corticoide rectal combinado de rutina con 5-ASA rectal"],
c:1,
e:"En proctitis la terapia <b>tópica</b> es la base: <b>mesalazina supositorio ≥1 g/día</b>. ECCO 2026 rec. 3 (5-ASA rectal ≥1 g/día, fuerte) y rec. 6 (5-ASA rectal preferido sobre corticoide rectal). Si falla en 2–4 semanas: agregar 5-ASA oral o corticoide tópico.",
w:{0:"La vía oral sola es inferior a la tópica en enfermedad distal.",2:"Budesonida MMX es opción para colitis leve-moderada, no primera línea en proctitis.",3:"ECCO 2026 rec. 7: no combinar de rutina corticoide rectal con 5-ASA rectal."},
p:"Proctitis aislada no requiere vigilancia de displasia específica por EII, pero sí confirmar extensión con colonoscopía completa.",
r:"ECCO UC Medical 2026 rec. 3, 6, 7 · ACG UC 2025"},

{id:"CU12",b:"CU",t:"CU leve–moderada",n:"R",
q:"CU izquierda (E2) con brote moderado sin criterios sistémicos. Mejor esquema inicial de inducción:",
o:["Mesalazina oral ≥2 g/día (hasta 4,8) + mesalazina rectal ≥1 g/día","Mesalazina oral 1,2 g/día","Azatioprina 2,5 mg/kg/día","Prednisona 60 mg/día como primera opción en todo brote moderado"],
c:0,
e:"La combinación oral + tópica supera a la oral sola (ECCO 2026 rec. 4, débil; Marteau Gut 2005: 64% vs 43% de remisión a semana 8). Dosis oral ≥2 g/día (rec. 2). Si no hay respuesta en 2–4 semanas → corticoide oral o budesonida MMX si el brote es leve.",
w:{1:"Dosis subterapéutica: se recomienda ≥2 g/día y existe gradiente dosis-respuesta.",2:"Las tiopurinas no inducen remisión (latencia 8–12 semanas).",3:"Los corticoides sistémicos se reservan para falla a 5-ASA o brote moderado-grave; no son la primera opción obligada."},
p:"Mantención: 5-ASA oral ≥2 g/día (ECCO 2026 rec. 11). Nunca corticoides.",
r:"ECCO UC Medical 2026 rec. 2, 4, 11 · Marteau P et al. Gut 2005;54:960"},

{id:"CU13",b:"CU",t:"CU leve–moderada",n:"F",
q:"Paciente con CU extensa en mesalazina 4 g/día que inicia vedolizumab por corticodependencia. ¿Qué recomienda ECCO 2026 respecto del 5-ASA oral?",
o:["Mantenerlo indefinidamente por su efecto quimiopreventivo","Suspenderlo al iniciar la terapia avanzada","Aumentarlo a 4,8 g/día durante la inducción","Cambiarlo a sulfasalazina"],
c:1,
e:"<b>ECCO 2026 rec. 13</b> (débil, certeza baja): sugiere <b>suspender el 5-ASA oral</b> al iniciar terapia avanzada, y también en quien alcanzó remisión con terapia avanzada o inmunomoduladores. En cohortes, mantenerlo no se asoció a beneficio (Singh 2021: más hospitalización y corticoides, probablemente por confusión por indicación). Reduce carga de comprimidos y costo.",
w:{0:"El control de la inflamación con la terapia avanzada es la principal quimioprevención.",2:"No hay beneficio aditivo demostrado.",3:"Sin fundamento; la sulfasalazina conserva nicho solo en artropatía periférica."},
p:"Es un cambio de práctica: muchos pacientes siguen con 5-ASA 'por si acaso'.",
nuevo:"ECCO 2026 rec. 13 — suspensión del 5-ASA al escalar.",
r:"ECCO UC Medical 2026 rec. 13 · Singh S et al. 2021"},

{id:"CU14",b:"CU",t:"CU leve–moderada",n:"R",
q:"¿Cuál de las siguientes situaciones define <b>corticodependencia</b> en CU?",
o:["Recaída dentro de los 3 meses de suspender el corticoide o imposibilidad de bajar de 10 mg/día de prednisona en 3 meses","Ausencia de respuesta a prednisona 0,75 mg/kg/día a las 4 semanas","Necesidad de un curso de corticoides en 12 meses","Hiperglicemia inducida por corticoides"],
c:0,
e:"<b>Corticodependencia</b>: no poder reducir la prednisona bajo 10 mg/día dentro de 3 meses sin recaída, o recaída dentro de los 3 meses de suspenderla. La opción B define <b>corticorrefractariedad</b>. Ambas indican escalar (terapia avanzada; las tiopurinas son opción de mantención en <65 años, ECCO 2026 rec. 14).",
w:{1:"Es la definición de corticorrefractariedad.",2:"Un curso aislado no define dependencia (aunque ≥2 cursos en 12 meses es indicación de escalar).",3:"Es un efecto adverso, no una definición de respuesta."},
p:"Un segundo curso de corticoides en 12 meses ya justifica terapia avanzada.",
r:"ECCO UC Medical 2026 rec. 14 · Guía Estudio EII 2026 §9"},

{id:"CU15",b:"CU",t:"Objetivos (STRIDE-II)",n:"F",
q:"Paciente con CU en remisión clínica (sin sangre, frecuencia normal). Colonoscopía: Mayo endoscópico 0. Calprotectina 180 µg/g. Biopsias: plasmocitosis basal leve, sin neutrófilos. Según STRIDE-II, ¿alcanzó el objetivo?",
o:["No: la plasmocitosis basal indica que no alcanzó la meta histológica obligatoria","Sí: alcanzó la curación endoscópica (MES 0), meta formal a largo plazo; la histología no es meta formal y la calprotectina está en el rango 100–250 µg/g","No: la calprotectina debe ser <50 µg/g","Sí, pero solo porque la remisión clínica es la meta final"],
c:1,
e:"STRIDE-II: metas formales en CU = respuesta y remisión clínica (PRO2), normalización de PCR, calprotectina en rango <b>100–250 µg/g</b>, y a largo plazo <b>curación endoscópica = MES 0</b> (UCEIS ≤1), más calidad de vida y ausencia de discapacidad. La <b>curación histológica NO es meta formal</b>: se evalúa como profundidad de la remisión (adyuvante). Por sí sola no obliga a cambiar de tratamiento.",
w:{0:"Es precisamente el error de interpretación: la histología es adyuvante, no obligatoria.",2:"El umbral <50 µg/g no es de STRIDE-II.",3:"La remisión clínica es meta de corto-intermedio plazo, no la final."},
p:"Remisión histológica (Nancy 0 / Geboes <2B.1) sí se asocia a menos recaída (RR ~0,37 adicional sobre MES 0), pero es evidencia observacional; STRIDE-III la clasificaría como 'adyuvante'.",
fix:"v5 marcaba la plasmocitosis basal como 'target no alcanzado' y la histología como meta formal de STRIDE-II.",
r:"Turner D et al. Gastroenterology 2021;160:1570-83 (STRIDE-II) · STRIDE I-II-III consulta rápida (ago 2026)"},

{id:"CU16",b:"CU",t:"Objetivos (STRIDE-II)",n:"R",
q:"¿Cuál es la definición STRIDE-II de curación endoscópica en CU?",
o:["Subscore endoscópico de Mayo (MES) ≤1","MES = 0 (o UCEIS ≤1)","Ausencia de úlceras >5 mm","Nancy ≤1"],
c:1,
e:"STRIDE-II define la curación endoscópica en CU como <b>MES = 0</b> (UCEIS ≤1 como alternativa). <b>MES ≤1</b> es la definición de 'mejoría endoscópica' usada como endpoint en ensayos clínicos (desde ACT-1/2) y el objetivo que adoptó ACG 2025, no la meta de STRIDE-II.",
w:{0:"Es 'mejoría endoscópica' de ensayos; ACG 2025 lo usa como objetivo, STRIDE-II exige MES 0.",2:"No es un criterio de CU.",3:"Es un índice histológico, no endoscópico."},
p:"Riesgo de recaída a 12 meses: MES 1 ~29% vs MES 0 ~14%.",
r:"STRIDE-II 2021 · ACG UC 2025"},

{id:"CU17",b:"CU",t:"Scores",n:"R",
q:"El UCEIS (Ulcerative Colitis Endoscopic Index of Severity) se compone de:",
o:["Eritema, friabilidad y patrón vascular (0–9)","Patrón vascular (0–2), sangrado (0–3) y erosiones/úlceras (0–3); rango 0–8","Úlceras, superficie ulcerada, superficie afectada y estenosis por segmento","Frecuencia deposicional, sangrado, endoscopía y valoración médica global"],
c:1,
e:"UCEIS = <b>V</b>ascular (0–2) + <b>S</b>angrado (0–3) + <b>U</b>lceración (0–3) = 0–8 (mnemotecnia V-S-U). Se puntúa el área más grave. Validado, con buena concordancia; a diferencia del MES no incluye friabilidad. Remisión ≤1; UCEIS ≥7 en CUAG predice necesidad de rescate/colectomía.",
w:{0:"No existe esa combinación; la friabilidad es parte del MES, no del UCEIS.",2:"Describe el SES-CD (Crohn).",3:"Es el Mayo total."},
p:"En un oral: 'uso UCEIS porque está validado y el MES no' suma puntos.",
r:"Travis SP et al. Gut 2012 · AGA CPU Endoscopic Scoring 2024 (CGH 22:2188)"},

{id:"CU18",b:"CU",t:"Posicionamiento terapéutico",n:"R",
q:"Hombre de 71 años con CU izquierda moderada corticodependiente, hipertenso, ex fumador de 40 paquetes-año. Naïve a terapia avanzada. ¿Qué clase queda relegada de entrada?",
o:["Vedolizumab","Ustekinumab o anti-IL-23","Inhibidores JAK","Infliximab"],
c:2,
e:"Reúne tres criterios de restricción regulatoria de los JAK (edad ≥65, tabaquismo actual o pasado, factor de riesgo cardiovascular): usar solo si no hay alternativa adecuada. Las opciones naturales: <b>vedolizumab</b> (selectividad intestinal) o <b>anti-IL-23 / ustekinumab</b>.",
w:{0:"Primera elección por seguridad en adulto mayor.",1:"Excelente perfil de seguridad; opción preferente.",3:"Posible, con tamizaje y ponderando riesgo infeccioso; no está 'relegado' de entrada."},
p:"La advertencia deriva de ORAL Surveillance (artritis reumatoide). Una cohorte 2026 en EII (JAK vs anti-TNF) no mostró exceso de TEV ni MACE, pero la restricción regulatoria sigue vigente.",
r:"FDA/EMA JAK safety 2021–2023 · Ahuja D et al. CGH 2026;24:794 · GETECCU fragilidad 2025"},

{id:"CU19",b:"CU",t:"Posicionamiento terapéutico",n:"R",
q:"¿Qué ensayo cabeza a cabeza sustenta la sugerencia de ECCO 2026 de preferir vedolizumab sobre adalimumab en CU moderada-grave?",
o:["SEAVUE","VARSITY","SEQUENCE","SONIC"],
c:1,
e:"<b>VARSITY</b>: vedolizumab superior a adalimumab en remisión clínica y mejoría endoscópica a semana 52 en CU moderada-grave. ECCO 2026 rec. 24 (débil, certeza baja): vedolizumab sobre adalimumab para inducción y mantención.",
w:{0:"SEAVUE: ustekinumab vs adalimumab en Crohn (sin diferencia).",2:"SEQUENCE: risankizumab vs ustekinumab en Crohn post anti-TNF.",3:"SONIC: infliximab ± azatioprina en Crohn."},
p:"VARSITY fue mayoritariamente en naïve; en bioexpuestos la ventaja no es extrapolable.",
r:"Sands BE et al. NEJM 2019 (VARSITY) · ECCO UC Medical 2026 rec. 24"},

{id:"CU20",b:"CU",t:"Posicionamiento terapéutico",n:"F",
q:"CU moderada-grave con falla farmacodinámica a infliximab (nivel valle 9 µg/mL, sin anticuerpos) y artritis periférica activa. ¿Cuál es la opción más razonable?",
o:["Adalimumab","Upadacitinib (si no hay factores de riesgo CV/trombótico)","Vedolizumab","Mesalazina 4,8 g/día + sulfasalazina"],
c:1,
e:"Falla farmacodinámica a anti-TNF → <b>cambio de mecanismo</b>. En CU bioexpuesta los JAK tienen el mejor rendimiento relativo en metaanálisis en red, y además cubren la artropatía. Upadacitinib: 45 mg/día × 8 semanas → 15 o 30 mg/día.",
w:{0:"Segundo anti-TNF tras falla farmacodinámica: baja probabilidad de respuesta.",2:"Eficacia menor en bioexpuestos y no controla manifestaciones articulares.",3:"No es tratamiento de una CU moderada-grave con falla a anti-TNF."},
p:"FDA (oct 2025) amplió la indicación de upadacitinib: tras ≥1 terapia sistémica aprobada si el anti-TNF es clínicamente desaconsejable.",
nuevo:"FDA oct 2025: upadacitinib ya no exige falla previa a anti-TNF si este está desaconsejado.",
r:"ECCO UC Medical 2026 rec. 37–38 · Danese S et al. Lancet 2022 (U-ACHIEVE/ACCOMPLISH) · FDA label update 13-10-2025"},

{id:"CU21",b:"CU",t:"Moduladores S1P",n:"F",
q:"Mujer de 29 años con CU moderada, prefiere terapia oral, planea embarazo en ~1 año y trabaja como enfermera. Entre los moduladores S1P, ¿qué diferencia práctica favorece a etrasimod sobre ozanimod en su caso?",
o:["Etrasimod está aprobado en Crohn","Recuperación linfocitaria en 7–14 días tras suspender (vs ~3 meses con ozanimod)","Etrasimod es seguro en el embarazo","Etrasimod no produce bradicardia"],
c:1,
e:"Ozanimod tiene metabolitos activos de vida media prolongada: recuperación del recuento linfocitario ~3 meses. <b>Etrasimod</b> (2 mg/día, sin titulación): recuperación en 7–14 días. Relevante ante infección grave, cirugía urgente o embarazo no planificado. Ambos requieren anticoncepción eficaz y están contraindicados en el embarazo.",
w:{0:"Ningún S1P tiene indicación en Crohn.",2:"Ambos deben evitarse en el embarazo.",3:"Ambos pueden producir bradicardia de primera dosis; requieren ECG basal."},
p:"La linfopenia es el efecto mecanístico buscado; no obliga a suspender salvo que sea profunda o haya infección.",
r:"Sandborn WJ et al. Lancet 2023 (ELEVATE) · Guía Simposio PANCCO–ACTECCU 2026 §6"},

{id:"CU22",b:"CU",t:"Anti-IL-23",n:"F",
q:"¿Cuál de los siguientes esquemas es correcto para mirikizumab en CU?",
o:["300 mg IV semanas 0, 4 y 8 → 200 mg SC cada 4 semanas","600 mg IV semanas 0, 4 y 8 → 180 o 360 mg SC cada 8 semanas","260/390/520 mg IV por peso → 90 mg SC cada 8 semanas","200 mg IV semanas 0, 4 y 8 → 100 mg SC cada 8 semanas"],
c:0,
e:"Mirikizumab (anti-IL-23 p19) en CU: <b>300 mg IV c/4 semanas × 3 → 200 mg SC c/4 semanas</b>. LUCENT-1/2; fue el primer programa con la <b>urgencia defecatoria</b> como desenlace formal. En Crohn (2025): 900 mg IV × 3 → 300 mg SC c/4 semanas.",
w:{1:"Es risankizumab en Crohn.",2:"Es ustekinumab.",3:"Es guselkumab (inducción IV) con mantención de 100 mg c/8 sem."},
p:"Guselkumab es el único anti-p19 con inducción totalmente subcutánea (400 mg SC sem 0-4-8).",
r:"D'Haens G et al. NEJM 2023 (LUCENT) · ECCO UC Medical 2026 rec. 27–28"},

{id:"CU23",b:"CU",t:"Displasia y CCR",n:"F",
q:"Hombre de 48 años con CU extensa desde los 35 años, en remisión. En la última colonoscopía: pseudopólipos inflamatorios múltiples. Padre con cáncer colorrectal (CCR) a los 57 años. Sin colangitis esclerosante primaria (CEP). ¿Intervalo de vigilancia?",
o:["1 año","2–3 años (riesgo intermedio)","5 años","No requiere vigilancia estando en remisión"],
c:1,
e:"Estratificación ECCO/BSG: <b>riesgo intermedio (2–3 años)</b> = colitis extensa con inflamación leve-moderada, <b>pseudopólipos</b>, antecedente familiar de CCR en familiar de primer grado <b>≥50 años</b>. <b>Anual</b> = CEP, estenosis o displasia en los últimos 5 años, inflamación extensa grave, familiar de primer grado con CCR <b><50 años</b>. 5 años = sin inflamación / colitis limitada.",
w:{0:"El padre tuvo CCR a los 57 (≥50) y los pseudopólipos son criterio intermedio, no alto.",2:"Los pseudopólipos y el antecedente familiar lo sacan del grupo de bajo riesgo.",3:"La vigilancia se basa en duración y extensión, no en la remisión clínica."},
p:"Técnica: cromoendoscopía (virtual o con colorante) con biopsias dirigidas; en alta definición la cromo con colorante ya no es obligatoria. Biopsias aleatorias si hay CEP, displasia previa o mala visualización.",
fix:"v5 marcaba '1 año' como correcto en este mismo escenario.",
r:"ECCO Guidelines (endoscopía/vigilancia) · BSG IBD 2025 · Guía Simposio PANCCO–ACTECCU 2026 §18"},

{id:"CU24",b:"CU",t:"Displasia y CCR",n:"S",
q:"En la vigilancia de una CU extensa se detecta una lesión polipoide de 12 mm con displasia de bajo grado, resecada en bloque con bordes libres; el resto de la mucosa sin displasia en cromoendoscopía. ¿Conducta?",
o:["Proctocolectomía total","Vigilancia endoscópica estrecha (cromoendoscopía de alta definición) en lugar de colectomía","Colectomía subtotal con anastomosis ileorrectal","Aumentar mesalazina como quimioprevención y control a 5 años"],
c:1,
e:"Nomenclatura <b>SCENIC</b> (visible/invisible, polipoide/no polipoide). Lesión <b>visible y resecada completamente</b> → vigilancia endoscópica en lugar de colectomía. La colectomía se plantea en displasia <b>invisible de alto grado</b>, displasia multifocal o lesiones no resecables. La displasia invisible debe confirmarse por patólogo experto y re-evaluarse con cromoendoscopía de alta definición por endoscopista experto.",
w:{0:"Sobretratamiento de una lesión resecada completamente.",2:"No indicado y deja el recto en riesgo.",3:"El intervalo de 5 años no corresponde tras displasia reciente (anual o menor)."},
p:"El término DALM está abandonado.",
fix:"v5 indicaba colectomía para displasia de bajo grado plana 'en la mayoría de las guías'; hoy la conducta depende de visibilidad y resecabilidad.",
r:"Laine L et al. Gastroenterology 2015 (SCENIC) · Murthy SK et al. AGA CPU 2021 · ECCO 2023"},

{id:"CU25",b:"CU",t:"Displasia y CCR",n:"R",
q:"Paciente con CU y colangitis esclerosante primaria (CEP) diagnosticada hace 1 año (CU diagnosticada simultáneamente). ¿Cuándo inicias la vigilancia de displasia colónica?",
o:["A los 8 años del inicio de los síntomas","Desde el diagnóstico de la CEP y luego anual","A los 15 años del diagnóstico","Solo si aparece colestasis"],
c:1,
e:"La CEP es la excepción: vigilancia <b>desde el diagnóstico</b>, <b>anual</b> e indefinida, por el riesgo muy aumentado de CCR (predominio colon derecho). 'La CEP no espera'.",
w:{0:"Regla general para colitis extensa sin CEP.",2:"Sin fundamento.",3:"La vigilancia colónica no depende de la actividad biliar."},
p:"En CEP el reservorio ileoanal es opción segura; la anastomosis ileorrectal conlleva más riesgo de cáncer en el recto remanente (ECCO quirúrgica 2026).",
r:"ECCO 2023 · ECCO UC Surgical 2026 enunciado 20"},

{id:"CU26",b:"CU",t:"Reservorio",n:"R",
q:"Paciente con proctocolectomía y reservorio ileoanal (IPAA) por CU consulta por 12 deposiciones/día, urgencia y dolor pélvico. ¿Cuál es el paso correcto?",
o:["Ciprofloxacino empírico y control en 1 mes sin endoscopía","Pouchoscopía con biopsias antes o junto con el inicio del tratamiento; si confirma reservoritis aguda: ciprofloxacino 500 mg c/12 h × 14 días","Iniciar vedolizumab de inmediato","Loperamida y fibra"],
c:1,
e:"Los síntomas son poco específicos (el subscore clínico del PDAI es el menos específico): la reservoritis se <b>confirma con endoscopía</b> (mPDAI ≥5 o PDAI ≥7) y descarta cuffitis, Crohn del reservorio, isquemia o <i>C. difficile</i>. Primera línea en reservoritis aguda: <b>ciprofloxacino 500 mg c/12 h × 14 días</b> (metronidazol como segunda opción, peor tolerado).",
w:{0:"Tratar solo por síntomas lleva a sobretratamiento y cronicidad no reconocida.",2:"El vedolizumab es para reservoritis crónica antibiótico-refractaria.",3:"No aborda la causa inflamatoria."},
p:"Dos de cada tres reservoritis se cronifican (RESERVO, GETECCU): clasificar por duración, frecuencia y respuesta a antibióticos.",
r:"Barreiro-de Acosta M et al. JCC 2025;19:jjaf103 (RESERVO) · ECCO UC Surgical 2026"},

{id:"CU27",b:"CU",t:"Reservorio",n:"F",
q:"Reservoritis crónica antibiótico-refractaria confirmada endoscópicamente. ¿Qué terapia tiene evidencia de ensayo aleatorizado positivo?",
o:["Adalimumab","Vedolizumab (EARNEST)","Probióticos de alta concentración","Upadacitinib"],
c:1,
e:"<b>EARNEST</b>: vedolizumab vs placebo en reservoritis crónica → remisión a semana 14 31% vs 10%. Es la única terapia con ECA positivo. Infliximab, ustekinumab y tofacitinib tienen datos observacionales; adalimumab tuvo un ECA pequeño negativo.",
w:{0:"ECA pequeño sin beneficio significativo.",2:"Útiles en prevención/antibiótico-dependencia, no en refractaria.",3:"Evidencia anecdótica."},
p:"Cuffitis (inflamación del manguito rectal) se trata como proctitis: 5-ASA o corticoide tópico.",
r:"Travis S et al. NEJM 2023;388:1191-200 (EARNEST)"},

{id:"CU28",b:"CU",t:"Cirugía",n:"F",
q:"Paciente con CU refractaria en tratamiento con vedolizumab y prednisona 30 mg/día, programada para colectomía electiva. Según la guía quirúrgica ECCO 2026, ¿qué recomendación perioperatoria es correcta?",
o:["Suspender vedolizumab ≥12 semanas antes de operar","Reducir los corticoides a <20 mg/día antes de la cirugía; los biológicos probablemente no necesitan suspenderse","Aumentar corticoides a dosis de estrés por 5 días","Nutrición parenteral de rutina 2 semanas antes"],
c:1,
e:"ECCO quirúrgica 2026 (enunciado 10): <b>reducir corticoides <20 mg</b> antes de proctectomía electiva o cirugía restaurativa; biológicos y moléculas pequeñas <b>probablemente no necesitan suspenderse</b> (considerar intervalo de dosificación). Enunciado 9: optimizar nutrición, sin nutrición enteral/parenteral de rutina. Profilaxis tromboembólica, extendida ~4 semanas en alto riesgo.",
w:{0:"No se recomienda suspender biológicos de rutina.",2:"Las dosis de estrés no han mostrado beneficio.",3:"No se apoya de rutina; se optimiza según evaluación nutricional."},
p:"La sarcopenia preoperatoria es un factor de riesgo modificable.",
nuevo:"ECCO quirúrgica CU 2026.",
r:"ECCO Guidelines on Therapeutics in UC: Surgical Treatment 2026"}
];
// ═══ BLOQUE ENFERMEDAD DE CROHN (EC) ═══
const Q_EC = [
{id:"EC01",b:"EC",t:"Estrategia y pronóstico",n:"R",
q:"Hombre de 23 años, fumador, con enfermedad de Crohn (EC) ileocolónica recién diagnosticada: úlceras profundas extensas, fístula perianal y PCR 60 mg/L. ¿Cuál es la estrategia correcta?",
o:["Escalonamiento clásico: mesalazina → corticoides → tiopurina → biológico","Terapia avanzada precoz (top-down), sin exigir falla de la terapia convencional","Budesonida 9 mg/día por 8 semanas y reevaluar","Corticoides orales en ciclos según síntomas"],
c:1,
e:"Múltiples factores de mal pronóstico (edad <30, enfermedad perianal al debut —el predictor más potente de curso discapacitante—, úlceras profundas, tabaquismo). <b>ACG 2025</b>: se sugiere <b>no exigir falla de la terapia convencional</b> antes de iniciar terapia avanzada. <b>PROFILE</b> (2024): top-down con infliximab + inmunomodulador superó al step-up acelerado (remisión sostenida libre de corticoides y cirugía ~79% vs ~15%) independientemente del biomarcador.",
w:{0:"Mesalazina no tiene rol en EC y el escalonamiento expone a daño acumulado.",2:"La budesonida es para EC ileocecal leve-moderada sin factores de mal pronóstico.",3:"Los corticoides no son mantención y no modifican el curso."},
p:"El riesgo es dinámico: un segundo curso de corticoides en 12 meses recategoriza al paciente.",
nuevo:"ACG CD 2025 formaliza no exigir falla convencional; PROFILE da el respaldo aleatorizado al top-down.",
r:"Lichtenstein GR et al. Am J Gastroenterol 2025;120:1225-64 · Noor NM et al. Lancet Gastroenterol Hepatol 2024 (PROFILE)"},

{id:"EC02",b:"EC",t:"Terapia convencional",n:"R",
q:"EC ileocecal leve-moderada, sin factores de mal pronóstico. ¿Tratamiento de inducción recomendado?",
o:["Mesalazina 4 g/día","Budesonida de liberación ileal 9 mg/día × 8 semanas","Ciprofloxacino + metronidazol","Azatioprina 2,5 mg/kg/día como inducción"],
c:1,
e:"<b>Budesonida ileal 9 mg/día</b> (recomendación fuerte ACTECCU 2026; RR 1,93 vs placebo). Salicilatos y antibióticos: recomendación fuerte en contra en EC luminal; tiopurinas no sirven para inducir (latencia 8–12 semanas). Reevaluar a las 8–12 semanas con clínica + calprotectina.",
w:{0:"5-ASA no tiene eficacia en EC (fuerte en contra, inducción y mantención).",2:"Solo para sepsis perianal/abscesos, no para EC luminal.",3:"No induce remisión; es fármaco de mantención."},
p:"La budesonida no sirve para mantención en EC (RR 0,98).",
r:"Núñez P et al. Rev Med Chile 2026;154:105-31 (ACTECCU) · ACG CD 2025"},

{id:"EC03",b:"EC",t:"Terapia convencional",n:"R",
q:"Respecto del metotrexato en EII, ¿qué afirmación es correcta?",
o:["La vía oral es tan eficaz como la parenteral en mantención de EC","Inducción 25 mg/semana SC/IM y mantención 15 mg/semana SC/IM en EC, con ácido fólico; sin evidencia de eficacia en CU","Es el inmunomodulador de elección para combinar con infliximab por superioridad demostrada en COMMIT","Puede mantenerse en el embarazo con ácido fólico en dosis altas"],
c:1,
e:"Metotrexato en EC: <b>25 mg/semana SC/IM</b> (inducción) → <b>15 mg/semana</b> (mantención), ácido fólico 5 mg/semana. Vía oral no eficaz en mantención. <b>Sin rol en CU</b>. COMMIT: añadir metotrexato a infliximab no mejoró la remisión. Teratógeno y abortivo.",
w:{0:"La evidencia es para vía parenteral.",2:"COMMIT fue negativo (~60% vs ~58%).",3:"Contraindicado; suspender ≥3 meses antes de concebir."},
p:"Elastografía hepática basal y según dosis acumulada (>1,5 g) reemplaza a la biopsia.",
r:"Feagan BG et al. Gastroenterology 2014 (COMMIT) · ACTECCU 2026 · ACG CD 2025"},

{id:"EC04",b:"EC",t:"Terapia combinada",n:"R",
q:"¿Qué ensayo demostró superioridad de infliximab + azatioprina sobre cada monoterapia en EC naïve?",
o:["DIAMOND","COMMIT","SONIC","REACT"],
c:2,
e:"<b>SONIC</b>: remisión libre de corticoides a semana 26: 56,8% (combinación) vs 44,4% (infliximab) vs 30,0% (azatioprina). Mecanismo principal: menor inmunogenicidad y mayores niveles de infliximab. DIAMOND (adalimumab + azatioprina) no mejoró la remisión clínica (sí la mejoría endoscópica); COMMIT (metotrexato) negativo.",
w:{0:"DIAMOND: adalimumab ± azatioprina; desenlace principal negativo.",1:"COMMIT: metotrexato + infliximab, sin beneficio.",3:"REACT: estrategia de combinación precoz por clusters (beneficio en complicaciones, no en la diana primaria)."},
p:"Si se logra exposición adecuada al anti-TNF por otras vías (monitorización, dosis), el argumento para la tiopurina se debilita —y con él su riesgo de linfoma y cáncer de piel.",
r:"Colombel JF et al. NEJM 2010;362:1383-95 (SONIC)"},

{id:"EC05",b:"EC",t:"Crohn perianal",n:"R",
q:"EC con dolor perianal y secreción purulenta. RM de pelvis: dos trayectos transesfinterianos y colección de 2,5 cm. Naïve a biológicos. ¿Secuencia correcta?",
o:["Infliximab de inmediato para cerrar los trayectos","Examen bajo anestesia con drenaje y setón laxo + antibióticos → luego infliximab (idealmente con tiopurina y niveles altos)","Antibióticos por 6 semanas sin cirugía","Proctectomía"],
c:1,
e:"Secuencia inamovible: <b>drena → mapea → trata</b>. Control de la sepsis (examen bajo anestesia, drenaje, setón laxo), ciprofloxacino/metronidazol como puente, y <b>infliximab</b> (única recomendación fuerte en perianal compleja; con tiopurina aumenta el cierre de la primera fístula, HR 2,58). Objetivo de nivel valle en perianal mayor que en luminal (≥10 µg/mL).",
w:{0:"Inmunosuprimir sobre un absceso no drenado convierte sepsis local en sepsis inmunosuprimida.",2:"Los antibióticos alivian pero no curan ni reemplazan el drenaje.",3:"Proctectomía queda para periné destruido/refractario (Geldof clase 3)."},
p:"Clasificación de Geldof (2022): declarar el objetivo (reparación vs control de síntomas) antes de elegir el tratamiento.",
r:"ACTECCU 2026 · ACG CD 2025 · Geldof J et al. Lancet Gastroenterol Hepatol 2022;7:576-84"},

{id:"EC06",b:"EC",t:"Crohn perianal",n:"F",
q:"EC perianal compleja con falla a infliximab optimizado. ¿Cuál afirmación sobre las alternativas es correcta en 2026?",
o:["Darvadstrocel (células madre alogénicas) es la opción aprobada vigente en la Unión Europea","Upadacitinib mostró resolución del drenaje (44,7% vs 5,6% a 12 semanas) en un análisis post hoc de sus ensayos fase 3","Vedolizumab es la segunda línea de elección en perianal","Risankizumab tiene ECA dedicado positivo en fístula perianal"],
c:1,
e:"Post hoc de U-EXCEL/U-EXCEED/U-ENDURE (Colombel CGH 2025): upadacitinib 45 mg → resolución del drenaje 44,7% vs 5,6%, cierre de orificios 22,1% vs 4,8%. ACTECCU lo posiciona como segunda línea tras anti-TNF. <b>Darvadstrocel (Alofisel)</b>: tras el fracaso de ADMIRE-CD II, Takeda <b>retiró la autorización en la UE (diciembre 2024)</b> por beneficio clínico no demostrado.",
w:{0:"Retirado del mercado europeo en diciembre de 2024.",2:"ACTECCU lo sitúa en 3.ª–4.ª línea en perianal.",3:"Sin evidencia suficiente para recomendación en perianal (ACTECCU 2026)."},
p:"Terapia local: colgajo de avance (recto sin inflamación), LIFT, fistulotomía en trayectos superficiales.",
fix:"Varias herramientas previas (incluida IBDScore) aún listan Alofisel como opción disponible.",
r:"Colombel JF et al. Clin Gastroenterol Hepatol 2025;23:1019-29 · EMA: Alofisel withdrawal 2024 · ACTECCU 2026"},

{id:"EC07",b:"EC",t:"Complicaciones",n:"R",
q:"EC en adalimumab con fiebre y dolor en fosa ilíaca derecha. TC: absceso de 4,5 cm con gas en la región ileocecal. ¿Conducta inicial?",
o:["Continuar adalimumab y agregar piperacilina-tazobactam","Antibióticos + drenaje percutáneo, suspender transitoriamente el biológico hasta controlar la fuente; luego reanudar terapia avanzada y discutir cirugía","Iniciar infliximab IV como rescate del brote","Aumentar adalimumab a semanal"],
c:1,
e:"Absceso >2–3 cm → <b>drenaje percutáneo + antibióticos</b> (cobertura de flora intestinal). La inmunosupresión se reanuda <b>una vez logrado el control de la fuente</b>. Discusión multidisciplinaria sobre resección diferida (la fístula subyacente suele persistir). Peritonitis o sepsis no controlada → cirugía urgente. La nutrición enteral exclusiva ayuda en abscesos no drenables.",
w:{0:"No se mantiene inmunosupresión con sepsis no controlada.",2:"Intensificar la inmunosupresión con absceso activo está contraindicado.",3:"Idem."},
p:"No hay un plazo fijo universal: el criterio es clínico-radiológico de resolución.",
r:"ACG CD 2025 · ECCO CD Surgical · Guía Estudio EII 2026 §13.3"},

{id:"EC08",b:"EC",t:"Complicaciones",n:"F",
q:"EC ileal con estenosis sintomática única de 3 cm, sin fístula ni absceso, con escasa inflamación en entero-RM. ¿Mejor opción?",
o:["Dilatación endoscópica con balón","Intensificar el biológico al máximo antes de cualquier intervención","Resección extensa preventiva","Corticoides IV prolongados"],
c:0,
e:"Estenosis <b>corta (<5 cm), recta, predominantemente fibrótica, sin fístula ni absceso</b> → <b>dilatación endoscópica con balón</b> (alta tasa de reintervención). Si hay componente inflamatorio relevante, optimizar primero la terapia médica (CREOLE/STRIDENT con adalimumab). Estenosis largas o complicadas → estenoplastia o resección preservando longitud.",
w:{1:"En estenosis fibrótica pura, más biológico no revierte la fibrosis.",2:"Preservar intestino es prioridad (riesgo de intestino corto).",3:"No tratan fibrosis y aumentan complicaciones."},
p:"Ningún fármaco tiene indicación antifibrótica; los anti-TL1A son la promesa en investigación.",
r:"ACG CD 2025 · Bouhnik Y et al. Gut 2018 (CREOLE)"},

{id:"EC09",b:"EC",t:"Recurrencia posquirúrgica",n:"R",
q:"Hombre de 30 años, fumador, con segunda resección ileocólica por EC penetrante. ¿Manejo postoperatorio?",
o:["Sin tratamiento y colonoscopía a los 5 años","Profilaxis precoz (idealmente 2–8 semanas post cirugía) con anti-TNF, cesación tabáquica e ileocolonoscopía a los 6–12 meses","Mesalazina 4 g/día como profilaxis","Budesonida 6 mg/día indefinida"],
c:1,
e:"Alto riesgo de recurrencia (tabaquismo, resección previa, fenotipo penetrante). <b>Profilaxis con anti-TNF</b> (ACG 2025: dentro de 4–8 semanas; algoritmos 2026: ventana ideal 2–4 semanas) + <b>cesación tabáquica</b> + <b>ileocolonoscopía a los 6–12 meses</b> con Rutgeerts modificado. Vedolizumab tiene evidencia aleatorizada preventiva (REPREVIO).",
w:{0:"La recurrencia endoscópica ocurre en 65–90% al año sin profilaxis.",2:"5-ASA tiene beneficio marginal y no en alto riesgo.",3:"Sin eficacia en prevención de recurrencia."},
p:"Recurrencia: endoscópica → clínica → quirúrgica. La ventana de intervención es la primera.",
r:"ACG CD 2025 · AGA post-op CD guideline · D'Haens G et al. Lancet Gastroenterol Hepatol 2023 (REPREVIO)"},

{id:"EC10",b:"EC",t:"Recurrencia posquirúrgica",n:"F",
q:"Ileocolonoscopía a los 9 meses de resección ileocólica: úlceras confinadas a la línea anastomótica, neoíleon sin lesiones. Calprotectina 90 µg/g. ¿Clasificación y conducta?",
o:["i2b: escalar a biológico","i2a: zona gris; puede corresponder a lesión isquémica/cicatricial → no necesariamente escalar; vigilar","i3: cambiar de mecanismo","i1: suspender todo tratamiento"],
c:1,
e:"Rutgeerts modificado: <b>i2a</b> = lesiones confinadas a la anastomosis; <b>i2b</b> = >5 aftas con mucosa normal interpuesta o lesiones mayores salteadas <b>en el neoíleon</b>. El i2a tiene pronóstico cercano a i0–i1 (lesiones isquémicas o por técnica, sobre todo en anastomosis latero-laterales) → vigilar. i2b–i4 → iniciar, optimizar o cambiar tratamiento.",
w:{0:"Las lesiones están solo en la anastomosis: i2a, no i2b.",2:"i3 = ileítis aftosa difusa con mucosa difusamente inflamada.",3:"i1 = ≤5 aftas en neoíleon; y no se suspende el tratamiento por un control favorable sin evaluar riesgo."},
p:"Evaluar ≥5 cm de neoíleon. La ecografía intestinal entre endoscopías entró a los algoritmos 2026.",
fix:"IBDScore invierte las definiciones de i2a e i2b.",
r:"Rutgeerts P et al. Gastroenterology 1990 · Guía Simposio PANCCO–ACTECCU 2026 §16"},

{id:"EC11",b:"EC",t:"Anti-IL-12/23 e IL-23",n:"R",
q:"Paciente de 85 kg con EC moderada-grave inicia ustekinumab. ¿Dosis de inducción IV?",
o:["260 mg","390 mg","520 mg","90 mg SC"],
c:1,
e:"Inducción IV por peso: <b>≤55 kg: 260 mg · >55–85 kg: 390 mg · >85 kg: 520 mg</b>. Mantención 90 mg SC a la semana 8 y luego c/8 semanas (c/12 en algunos; intensificable a c/4).",
w:{0:"Corresponde a ≤55 kg.",2:"Corresponde a >85 kg; 85 kg exactos está en la banda de 390 mg.",3:"La inducción es IV."},
p:"Nivel valle post-inducción (semana 8) >3–4,5 µg/mL se asocia a mejor respuesta.",
fix:"v5 indicaba 520 mg para 85 kg.",
r:"Ficha técnica ustekinumab · Feagan BG et al. NEJM 2016 (UNITI)"},

{id:"EC12",b:"EC",t:"Anti-IL-12/23 e IL-23",n:"F",
q:"EC con falla a anti-TNF. ¿Qué mostró el ensayo SEQUENCE?",
o:["Ustekinumab superior a risankizumab en remisión endoscópica","Risankizumab no inferior en remisión clínica (sem 24) y superior en remisión endoscópica (sem 48) vs ustekinumab","Vedolizumab superior a adalimumab","Guselkumab superior a risankizumab"],
c:1,
e:"<b>SEQUENCE</b>: risankizumab vs ustekinumab en EC con falla a anti-TNF → no inferior en remisión clínica y <b>superior en remisión endoscópica</b>. Justifica que p19 no es 'p40 mejorado cosmético': cambiar de ustekinumab a un anti-p19 es una maniobra defendible. GALAXI: guselkumab mostró ventaja endoscópica sobre ustekinumab.",
w:{0:"Resultado inverso.",2:"Es VARSITY en CU.",3:"No hay comparación directa entre anti-p19."},
p:"Risankizumab EC: 600 mg IV sem 0-4-8 → 180 o 360 mg SC c/8 semanas (inyector corporal).",
r:"Peyrin-Biroulet L et al. NEJM 2024 (SEQUENCE) · Danese S et al. Lancet 2025 (GALAXI-2/3)"},

{id:"EC13",b:"EC",t:"Anti-IL-12/23 e IL-23",n:"F",
q:"¿Cuál anti-IL-23 p19 dispone de un esquema de inducción totalmente subcutáneo en EII?",
o:["Risankizumab","Mirikizumab","Guselkumab","Ustekinumab"],
c:2,
e:"<b>Guselkumab</b>: inducción 200 mg IV sem 0-4-8 <b>o 400 mg SC sem 0-4-8</b> (GRAVITI en EC; también en CU), mantención 100 mg SC c/8 semanas o 200 mg SC c/4 semanas. Es un anticuerpo totalmente humano con Fc nativo (se une a CD64), a diferencia de risankizumab y mirikizumab (Fc mutado).",
w:{0:"Inducción IV (600 mg EC; 1.200 mg CU).",1:"Inducción IV (300 mg CU; 900 mg EC).",3:"Es anti-p40 y su inducción es IV."},
p:"La diferencia de Fc es biológicamente plausible, no una superioridad clínica demostrada.",
r:"GRAVITI (fase 3, inducción SC de guselkumab en EC) · Guía Simposio PANCCO–ACTECCU 2026 §6"},

{id:"EC14",b:"EC",t:"Inhibidores JAK",n:"R",
q:"Esquema correcto de upadacitinib en EC:",
o:["45 mg/día × 8 semanas → 15 mg/día","45 mg/día × 12 semanas → 15 o 30 mg/día","15 mg/día desde el inicio","10 mg c/12 h × 8 semanas → 5 mg c/12 h"],
c:1,
e:"EC: <b>45 mg/día × 12 semanas → 15 o 30 mg/día</b> (U-EXCEL/U-EXCEED/U-ENDURE). CU: 45 mg × 8 semanas (extensible a 16) → 15 o 30 mg. Tofacitinib no tiene indicación en EC.",
w:{0:"Es el esquema de CU.",2:"No hay inducción con dosis baja.",3:"Es tofacitinib en CU."},
p:"Reinducción con 45 mg recaptura respuesta en ~80% de quienes pierden respuesta tras bajar dosis (datos de vida real, retrospectivos).",
r:"Loftus EV et al. NEJM 2023 (U-EXCEL/U-EXCEED/U-ENDURE)"},

{id:"EC15",b:"EC",t:"Objetivos (STRIDE-II)",n:"R",
q:"Según STRIDE-II, ¿cuál es la meta endoscópica en EC y qué lugar ocupa la histología?",
o:["SES-CD <3 o ausencia de ulceraciones; la remisión histológica NO es meta en EC","CDEIS 0 y remisión histológica obligatoria","SES-CD <7; histología como meta intermedia","Curación transmural obligatoria como meta formal"],
c:0,
e:"STRIDE-II en EC: curación endoscópica = <b>SES-CD <3 o ausencia de ulceraciones</b> (ileocolonoscopía; si no es factible, cápsula/enteroscopía). La <b>histología se descarta explícitamente</b> como meta en EC. La curación transmural (IUS/entero-RM) es adjunto, no meta formal.",
w:{1:"CDEIS se usa en ensayos; la histología no es meta en EC.",2:"SES-CD 7–15 es actividad moderada.",3:"Es adjunto; su beneficio incremental aún no está demostrado."},
p:"Remisión transmural por IUS: grosor de pared ≤3 mm + Doppler normal (definiciones aún no estandarizadas).",
r:"STRIDE-II 2021 · St-Pierre J et al. Inflamm Bowel Dis 2026 (definiciones IUS)"},

{id:"EC16",b:"EC",t:"Imagen / IUS",n:"R",
q:"En la ecografía intestinal (IUS) de un paciente con EC, ¿qué hallazgo define más consistentemente actividad inflamatoria?",
o:["Grosor de pared >3 mm (más hiperemia Doppler, pérdida de estratificación, grasa mesentérica inflamatoria)","Peristalsis aumentada","Presencia de gas intraluminal","Grosor de pared <1 mm"],
c:0,
e:"Grosor de pared intestinal <b>>3 mm</b> es el parámetro central (>4 mm en recto en algunos criterios), sumando señal Doppler (Limberg), estratificación y grasa inflamatoria. Scores: IBUS-SAS (EC), Milan Ultrasound Criteria (CU). Ventajas: sin radiación, repetible, útil en embarazo, cambios detectables a las 48 h de corticoide.",
w:{1:"No es criterio de actividad.",2:"Normal.",3:"No es un hallazgo de actividad."},
p:"IUS es la herramienta con mejor relación costo-beneficio para monitoreo longitudinal en contextos con acceso limitado a RM.",
r:"Chavannes M et al. AGA CPU IUS. Clin Gastroenterol Hepatol 2024;22:1790-5"},

{id:"EC17",b:"EC",t:"Clasificación",n:"R",
q:"EC diagnosticada a los 35 años con compromiso de íleon terminal y colon, lesiones duodenales, comportamiento inflamatorio y fístula perianal. Clasificación de Montreal:",
o:["A2 L3 L4 B1p","A3 L3 B3","A2 L4 B3p","A2 L3 B1"],
c:0,
e:"Montreal: <b>A</b> (edad: A1 ≤16, A2 17–40, A3 >40) · <b>L</b> (L1 íleon, L2 colon, L3 ileocolon; <b>L4</b> es modificador que se suma) · <b>B</b> (B1 inflamatorio, B2 estenosante, B3 penetrante; la enfermedad perianal <b>no</b> define B3: se agrega el modificador <b>p</b>). Resultado: A2 L3 L4 B1p.",
w:{1:"35 años es A2; la fístula perianal aislada no es B3.",2:"Omite la localización ileocolónica y clasifica mal el comportamiento.",3:"Omite L4 y el modificador p."},
p:"EC alta (consenso SUMM-CD 2026): compromiso de esófago, estómago y/o duodeno proximal al ligamento de Treitz; endoscopía alta solo ante sospecha.",
r:"Silverberg MS et al. Can J Gastroenterol 2005 (Montreal) · Cohen NA et al. Lancet Gastroenterol Hepatol 2026;11:243 (SUMM-CD)"},

{id:"EC18",b:"EC",t:"Tiopurinas",n:"F",
q:"EC en azatioprina 2,5 mg/kg/día sin respuesta, con transaminasas 3× LSN. Metabolitos: 6-TGN 150 pmol/8×10⁸ GR, 6-MMP 9.800. ¿Interpretación y conducta?",
o:["Mala adherencia: reforzar toma","Hipermetabolizador (shunter): alopurinol 100 mg/día + reducir tiopurina al 25–33% de la dosis, con hemograma estrecho","Deficiencia de TPMT: suspender","Nivel terapéutico: falla farmacodinámica"],
c:1,
e:"6-TGN bajo (<230) + 6-MMP alto (>5.700) + hepatotoxicidad = <b>shunter</b> (razón 6-MMP/6-TGN >11). <b>Alopurinol 100 mg/día + reducir la tiopurina a 25–33%</b>: redirige el metabolismo hacia 6-TGN. Añadir alopurinol sin reducir la dosis produce pancitopenia grave.",
w:{0:"Mala adherencia = ambos metabolitos bajos.",2:"Deficiencia de TPMT daría 6-TGN muy alto y mielotoxicidad.",3:"El 6-TGN es subterapéutico."},
p:"'TGN trabaja, MMP molesta.'",
r:"Guía Estudio EII 2026 §11.2 · Guía Simposio PANCCO–ACTECCU 2026 §4"},

{id:"EC19",b:"EC",t:"Tiopurinas",n:"F",
q:"Hombre de 22 años con EC, candidato a combinar infliximab con azatioprina. Serología de virus de Epstein-Barr (VEB) negativa. ¿Qué haces?",
o:["Iniciar azatioprina sin cambios","Preferir otra estrategia sin tiopurina (infliximab con TDM proactivo o metotrexato), por riesgo de linfoma posprimoinfección por VEB y linfoma hepatoesplénico de células T","Vacunar contra VEB antes","Usar 6-mercaptopurina en vez de azatioprina"],
c:1,
e:"En varón joven VEB-seronegativo, la primoinfección bajo tiopurina se asocia a trastornos linfoproliferativos graves (incluido síndrome hemofagocítico) y el riesgo de <b>linfoma hepatoesplénico de células T</b> es mayor en varones jóvenes con terapia combinada. Preferir alternativas: optimizar exposición al anti-TNF por monitorización o, si se desea inmunomodulador, metotrexato.",
w:{0:"Ignora un riesgo evitable.",2:"No existe vacuna contra VEB.",3:"Mismo riesgo de clase."},
p:"Pedir serología VEB antes de tiopurina en varón <35 años.",
r:"ECCO Infecciones 2026 · Guía Simposio PANCCO–ACTECCU 2026 §4"},

{id:"EC20",b:"EC",t:"Manifestaciones extraintestinales",n:"R",
q:"EC ileocolónica activa con espondiloartritis axial (sacroileítis en RM) activa. ¿Mejor elección?",
o:["Vedolizumab","Anti-TNF (infliximab o adalimumab); upadacitinib como alternativa","Ustekinumab o anti-IL-23","Mesalazina + AINE"],
c:1,
e:"La enfermedad axial es <b>independiente de la actividad intestinal</b> y responde a <b>anti-TNF</b> (clase con evidencia 'debe considerarse' en artritis, espondiloartropatía, uveítis y pioderma) o <b>JAK</b>. Anti-IL-23/IL-12/23 son eficaces en psoriasis y artritis psoriásica, pero <b>no en enfermedad axial</b>. Vedolizumab no controla manifestaciones extraintestinales.",
w:{0:"Mecanismo intestino-selectivo; no trata la espondiloartritis.",2:"Sin eficacia en espondiloartritis axial.",3:"Mesalazina no tiene rol en EC y los AINE pueden reactivar la EII."},
p:"Artritis periférica tipo 1 (pauciarticular) sigue la actividad luminal: mejora al controlar el intestino.",
r:"ECCO EIM guideline · Guía Simposio PANCCO–ACTECCU 2026 §5, §7"},

{id:"EC21",b:"EC",t:"Complicaciones",n:"R",
q:"Paciente con EC y cuadro de obstrucción intestinal. ¿Cuál es el estudio inicial de imagen preferido?",
o:["Cápsula endoscópica","TC de abdomen y pelvis con contraste IV (sin contraste oral)","Tránsito intestinal con bario","Colonoscopía urgente"],
c:1,
e:"<b>TC con contraste IV</b>: diferencia estenosis inflamatoria de fibrótica, detecta adherencias, absceso o perforación. Manejo: reposo, SNG, hidratación; corticoides IV si predomina inflamación; cirugía si es fibrótica, perforada o con absceso.",
w:{0:"Contraindicada ante sospecha de estenosis (retención).",2:"Obsoleto y riesgoso en obstrucción.",3:"No es el estudio inicial en obstrucción."},
p:"Entero-RM para caracterización electiva y seguimiento (sin radiación).",
r:"ACG CD 2025 · Guía Estudio EII 2026 §13.3"},

{id:"EC22",b:"EC",t:"Nutrición",n:"R",
q:"Respecto de la nutrición enteral exclusiva (NEE) en EC, ¿qué afirmación es correcta?",
o:["Es primera línea de inducción en EC pediátrica leve-moderada; en adultos es eficaz pero limitada por adherencia","No tiene eficacia demostrada en ninguna población","Es tratamiento de mantención de primera línea en adultos","Solo sirve en CU"],
c:0,
e:"ECCO dieta 2025 (enunciado 3.1): NEE eficaz para inducir remisión clínica y endoscópica en niños (nivel 1) y adultos (nivel 2) con EC leve-moderada. ESPEN: primera línea pediátrica. En adultos, la adherencia (6–8 semanas exclusivas) es el factor limitante. También útil en abscesos no drenables y preoperatorio.",
w:{1:"Tiene evidencia sólida en pediatría.",2:"Es de inducción; no reemplaza la mantención.",3:"Evidencia es en EC."},
p:"Sarcopenia y obesidad sarcopénica empeoran el pronóstico: medir fuerza de prensión y masa muscular (L3 en TC).",
r:"Svolos V et al. ECCO dietary consensus. JCC 2025;jjaf122 · ESPEN IBD 2023"}
];
