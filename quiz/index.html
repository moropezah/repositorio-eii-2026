{id:"TR01",b:"TR",t:"Embarazo",n:"R",
q:"Mujer de 29 años con CU en remisión profunda con infliximab, embarazada de 18 semanas. ¿Recomendación?",
o:["Suspender infliximab de inmediato por riesgo fetal","Continuar infliximab durante todo el embarazo; no se programa suspensión a las 22–24 semanas. Coordinar la última dosis y el plan del lactante","Cambiar a mesalazina en monoterapia","Suspender a las 22–24 semanas si está en remisión"],
c:1,
e:"La <b>enfermedad activa —no el fármaco— es el principal predictor de desenlaces obstétricos adversos</b>. Consenso Global (PIANO/AGA) y la práctica actual: <b>continuar el anti-TNF durante todo el embarazo</b>. Suspender en el tercer trimestre se asoció a más recaídas maternas sin mejora de desenlaces fetales. La transferencia placentaria (vía FcRn, desde el 2.º trimestre) se maneja con el plan de vacunas del lactante, no suspendiendo.",
w:{0:"Arriesga recaída; no hay señal de teratogenicidad.",2:"Cambiar un fármaco eficaz en remisión arriesga recaída.",3:"Práctica desactualizada (ECCO 2015 y previas): aumenta recaídas y no mejora desenlaces del recién nacido."},
p:"Si se desea minimizar exposición, se puede <b>ajustar el momento de la última dosis</b> cerca del parto y reanudar en el posparto inmediato, sin interrumpir la terapia.",
fix:"v5 recomendaba 'considerar suspender en semana 22–24'.",
r:"Mahadevan U et al. Global Consensus IBD & Pregnancy. Gastroenterology 2019;156:1508 (publicado en paralelo en varias revistas) · ECCO Pregnancy 2023 · PIANO"},

{id:"TR02",b:"TR",t:"Embarazo",n:"F",
q:"Recién nacido de madre con EC tratada con adalimumab hasta la semana 36. En Chile se administra BCG al nacer y rotavirus oral a los 2 y 4 meses. ¿Conducta con las vacunas vivas del lactante?",
o:["Administrar todas según calendario habitual","Diferir las vacunas vivas (BCG, rotavirus) durante los primeros 6 meses (o hasta confirmar niveles indetectables); las inactivadas siguen el calendario habitual","Contraindicar de por vida todas las vacunas","Diferir también las vacunas inactivadas hasta el año"],
c:1,
e:"Los anticuerpos monoclonales IgG1 atraviesan activamente la placenta y persisten en el lactante varios meses. Regla: <b>no administrar vacunas vivas atenuadas en los primeros 6 meses</b> al lactante expuesto a biológicos en el tercer trimestre (certolizumab, sin Fc, es la excepción por transferencia mínima). En Chile impacta sobre todo <b>BCG neonatal</b> y <b>rotavirus</b>: coordinar con pediatría. Inactivadas: calendario normal.",
w:{0:"Riesgo de infección diseminada por la cepa vacunal (casos fatales de BCG diseminada descritos).",2:"Desproporcionado.",3:"Las inactivadas son seguras y con respuesta adecuada."},
p:"Lactancia: compatible con anti-TNF, vedolizumab y ustekinumab; no aumenta infecciones del lactante.",
r:"Global Consensus IBD & Pregnancy 2019 · ECCO Pregnancy 2023 · Guía Simposio PANCCO–ACTECCU 2026 §20"},

{id:"TR03",b:"TR",t:"Embarazo",n:"R",
q:"¿Cuál de estos fármacos está contraindicado en una mujer con EII que busca embarazo?",
o:["Azatioprina en curso","Ustekinumab","Metotrexato","Mesalazina"],
c:2,
e:"<b>Metotrexato</b>: teratógeno y abortivo. Suspender <b>≥3 meses (3–6)</b> antes de la concepción, con folato. También deben evitarse <b>JAK y moduladores S1P</b> (anticoncepción eficaz y lavado según vida media). Se continúan: 5-ASA, tiopurinas ya iniciadas (no iniciarlas de novo), anti-TNF, vedolizumab, ustekinumab.",
w:{0:"Compatible si ya se usaba; no iniciar de novo en el embarazo.",1:"Datos tranquilizadores; puede continuarse.",3:"Segura (evitar formulaciones con dibutilftalato)."},
p:"Parto: la EII no impone cesárea; indicaciones principales = enfermedad perianal activa y reservorio ileoanal.",
r:"ECCO Pregnancy 2023 · ACTECCU 2026 · Global Consensus 2019"},

{id:"TR04",b:"TR",t:"Embarazo",n:"F",
q:"Embarazada de 24 semanas con CU en mesalazina presenta brote moderado (7 deposiciones con sangre, PCR 42 mg/L). ¿Cuál es la mejor herramienta para monitorizar objetivamente y el tratamiento inicial adecuado?",
o:["Colonoscopía completa con sedación profunda; iniciar metotrexato","Calprotectina fecal ± ecografía intestinal (± sigmoidoscopía sin sedación profunda si cambia la conducta); prednisona oral (p. ej. 40 mg/día) o escalar a anti-TNF según gravedad","TC de abdomen; tofacitinib","No tratar hasta el parto"],
c:1,
e:"Monitorización en embarazo: <b>calprotectina e ecografía intestinal</b> (sin radiación); sigmoidoscopía flexible es segura si cambia la conducta; RM sin gadolinio si se necesita. El brote debe tratarse: <b>corticoides</b> (menor riesgo; vigilar diabetes gestacional e hipertensión) o terapia avanzada compatible (anti-TNF, vedolizumab, ustekinumab) según gravedad.",
w:{0:"La colonoscopía completa rara vez es necesaria y el metotrexato está contraindicado.",2:"Radiación innecesaria; JAK contraindicados.",3:"La actividad es el mayor riesgo para el feto."},
p:"Concebir idealmente con ≥3–6 meses de remisión objetivada.",
r:"Global Consensus 2019 · ECCO Pregnancy 2023 · Guía Estudio EII 2026 §16.1"},

{id:"TR05",b:"TR",t:"Tamizaje e infecciones",n:"R",
q:"Antes de iniciar infliximab: IGRA (QuantiFERON) positivo, radiografía de tórax normal, asintomático. ¿Conducta?",
o:["Contraindicación absoluta de anti-TNF","Tratar la infección tuberculosa latente e iniciar el anti-TNF tras 3–4 semanas de tratamiento, completándolo","Iniciar infliximab y repetir IGRA en 6 meses","Tratamiento completo de TBC activa (HRZE) antes del biológico"],
c:1,
e:"Infección tuberculosa latente → tratamiento (p. ej. isoniazida 6–9 meses, rifampicina 4 meses o esquemas cortos según normativa local) y <b>esperar 3–4 semanas antes de anti-TNF o JAK</b> (ECCO Infecciones 2026). Con fármacos de bajo riesgo (vedolizumab, anti-IL-23, S1P) es aceptable el inicio concomitante.",
w:{0:"No es contraindicación absoluta.",2:"Riesgo de reactivación 2–4,5× con anti-TNF (13× con combinación).",3:"Sin evidencia de enfermedad activa no se trata como TBC activa."},
p:"PPD tiene reactividad cruzada con BCG (Chile vacuna al nacer); IGRA preferido. Si ya está inmunosuprimido, combinar ambas pruebas. Ante discordancia en candidato a anti-TNF: tratar.",
r:"ECCO Infections 2026. J Crohns Colitis 2026;20(7):jjag071 · Normativa MINSAL TBC"},

{id:"TR06",b:"TR",t:"Tamizaje e infecciones",n:"F",
q:"Paciente con HBsAg positivo, ADN-VHB bajo, transaminasas normales, candidato a infliximab. ¿Conducta?",
o:["Iniciar infliximab y controlar transaminasas trimestrales","Profilaxis antiviral (entecavir o tenofovir) antes de iniciar y mantenerla durante y después de la inmunosupresión","Contraindicar todo biológico","Vacunar contra VHB y luego iniciar"],
c:1,
e:"HBsAg positivo = alto riesgo de reactivación (incluida hepatitis fulminante) con inmunosupresión → <b>profilaxis con análogo de alta barrera</b> (entecavir o tenofovir) iniciada antes y mantenida ≥6–12 meses tras suspender. Anti-HBc aislado: monitorización de ADN-VHB o profilaxis según riesgo del fármaco.",
w:{0:"Esperar la elevación de transaminasas es tardío.",2:"No es necesario si se hace profilaxis.",3:"La vacuna no sirve en infección crónica."},
p:"Anti-HBs <10 mUI/mL en no infectado → vacunar (refuerzo o serie completa).",
r:"ECCO Infections 2026 · AASLD/EASL HBV"},

{id:"TR07",b:"TR",t:"Vacunas",n:"R",
q:"Paciente de 38 años con CU que iniciará upadacitinib. ¿Qué vacuna es prioritaria y puede administrarse aun bajo inmunosupresión?",
o:["Zóster de virus vivo (formulación antigua)","Zóster recombinante adyuvada (2 dosis)","Fiebre amarilla","Triple viral"],
c:1,
e:"El herpes zóster es el evento adverso característico de los JAK. <b>Vacuna recombinante (inactivada)</b>: indicada desde los 19 años en EII inmunosuprimida, 2 dosis (intervalo 1–2 meses), idealmente antes de iniciar, <b>sin retrasar</b> el tratamiento. Vivas atenuadas (zóster vivo, fiebre amarilla, triple viral, varicela, BCG): contraindicadas bajo inmunosupresión; si se necesitan, ≥4 semanas antes de iniciar o ≥3 meses tras suspender.",
w:{0:"Vacuna viva: contraindicada bajo inmunosupresión.",2:"Viva atenuada.",3:"Viva atenuada."},
p:"No chequear títulos de sarampión/varicela de rutina si hay historia vacunal documentada: retrasa sin aportar.",
r:"ACG Preventive Care in IBD 2025 · Caldera F et al. AGA CPU 2025 (CGH 23:695) · ECCO Infections 2026"},

{id:"TR08",b:"TR",t:"Monitorización (TDM)",n:"R",
q:"EC en infliximab 5 mg/kg c/8 sem con pérdida de respuesta confirmada (calprotectina 950 µg/g, úlceras). Nivel valle 1,8 µg/mL, anticuerpos anti-infliximab negativos. ¿Conducta?",
o:["Cambiar a vedolizumab por falla secundaria","Intensificar infliximab (10 mg/kg y/o intervalo c/4–6 sem) ± agregar inmunomodulador, y reevaluar","Cambiar a adalimumab","Suspender e iniciar corticoides"],
c:1,
e:"Nivel <b>bajo + anticuerpos negativos</b> = falla <b>farmacocinética no inmune</b> (subexposición): <b>intensificar</b> (recuperación 50–70%) y/o agregar inmunomodulador. Cambiar de clase aquí desperdicia un fármaco útil.",
w:{0:"Solo si el nivel fuera adecuado (falla farmacodinámica).",2:"Cambio intraclase se reserva para anticuerpos altos persistentes.",3:"Los corticoides no son estrategia."},
p:"Primero confirmar inflamación objetiva: sin inflamación demostrada no hay falla terapéutica.",
r:"AGA TDM guideline 2017 · Consenso GETECCU/SEFH/SEiT 2024 · Guía Simposio PANCCO–ACTECCU 2026 §9"},

{id:"TR09",b:"TR",t:"Monitorización (TDM)",n:"F",
q:"CU en adalimumab con pérdida de respuesta objetivada. Nivel valle indetectable, anticuerpos anti-adalimumab en título alto persistente (confirmado en 2 mediciones). ¿Conducta?",
o:["Intensificar adalimumab a 80 mg semanal","Cambio a otra clase obligatoriamente: está prohibido otro anti-TNF","Cambiar dentro de clase (p. ej. infliximab) asociando inmunomodulador, o cambiar de mecanismo según el escenario","Agregar azatioprina y mantener la misma dosis"],
c:2,
e:"Nivel bajo con <b>anticuerpos altos persistentes</b> = falla <b>farmacocinética inmune</b>. Intensificar rara vez supera títulos altos. El mecanismo (TNF) puede seguir siendo válido → <b>cambio intraclase con inmunomodulador</b> para prevenir nueva inmunogenicidad; alternativa razonable: cambiar de mecanismo. Con título bajo o transitorio: intensificar ± inmunomodulador.",
w:{0:"Poco probable que supere anticuerpos en título alto.",1:"Error de v5: el cambio intraclase es legítimo en falla inmunogénica.",3:"Puede servir con títulos bajos; con títulos altos persistentes es insuficiente."},
p:"Nivel adecuado + anticuerpos positivos = combinación inconsistente → verificar el ensayo antes de decidir.",
fix:"v5 planteaba que tras falla con anticuerpos 'siempre' se debe cambiar de clase.",
r:"Guía Simposio PANCCO–ACTECCU 2026 §9 · STRIDE-II (lógica de decisión) · AGA TDM 2017"},

{id:"TR10",b:"TR",t:"Monitorización (TDM)",n:"F",
q:"EC en adalimumab 40 mg semanal: recaída endoscópica con nivel valle 14 µg/mL y anticuerpos negativos. ¿Interpretación?",
o:["Falla farmacocinética: subir a 80 mg semanal","Falla farmacodinámica: la vía TNF no es la dominante → cambiar de mecanismo (anti-IL-23, ustekinumab, upadacitinib, vedolizumab)","Falla inmunogénica: agregar azatioprina","Cambiar a infliximab"],
c:1,
e:"Nivel <b>terapéutico o alto sin anticuerpos</b> con inflamación activa = <b>falla farmacodinámica</b>. Más fármaco no aporta; otro anti-TNF tampoco. Cambiar de mecanismo. En EC post anti-TNF: anti-IL-23 p19 y upadacitinib son las opciones de mayor eficacia.",
w:{0:"La exposición ya es adecuada.",2:"No hay anticuerpos.",3:"Mismo mecanismo; baja probabilidad de respuesta."},
p:"Descartar antes estenosis fibrótica, infección o síntomas funcionales (falla 'aparente').",
r:"Guía Simposio PANCCO–ACTECCU 2026 §8–9, §11"},

{id:"TR11",b:"TR",t:"Monitorización (TDM)",n:"S",
q:"Respecto de la monitorización terapéutica (TDM) proactiva de anti-TNF, ¿qué afirmación refleja mejor la evidencia?",
o:["CALM demostró la superioridad del TDM proactivo","TAXIT y TAILORIX no alcanzaron su desenlace primario; PAILOT (pediátrico, adalimumab) fue positivo; la certeza global es baja, y el nivel de semana 14 (PANTS) es el mejor predictor de remisión sostenida","El TDM proactivo está recomendado universalmente por AGA y ECCO para todos los pacientes","El TDM reactivo carece de respaldo"],
c:1,
e:"<b>CALM</b> evaluó <b>control estricto con biomarcadores</b> (clínica + PCR + calprotectina) con adalimumab en EC temprana (remisión endoscópica 46% vs 30%), <b>no TDM</b>. TDM proactivo: TAXIT y TAILORIX con desenlace primario negativo; PAILOT positivo en niños; metaanálisis 2022 con certeza baja. El TDM <b>reactivo</b> tiene respaldo sólido. Uso razonable: medir en semana 14 y ante eventos, más que un calendario fijo.",
w:{0:"Error de atribución: CALM es de 'tight control', no de TDM.",2:"No hay recomendación universal del TDM proactivo.",3:"El reactivo es el mejor respaldado."},
p:"Momentos de valor: inducción en alto aclaramiento (CUAG, hipoalbuminemia), semana 14, antes de desescalar o retirar inmunomodulador.",
fix:"v5 atribuía a CALM la superioridad del TDM proactivo.",
r:"Colombel JF et al. Lancet 2017 (CALM) · Vande Casteele N et al. Gastroenterology 2015 (TAXIT) · Assa A et al. Gastroenterology 2019 (PAILOT) · Nguyen NH et al. Gastroenterology 2022 · Kennedy NA et al. Lancet Gastroenterol Hepatol 2019 (PANTS)"},

{id:"TR12",b:"TR",t:"Monitorización (TDM)",n:"R",
q:"¿Cuál es la definición correcta de falla primaria a una terapia avanzada?",
o:["Pérdida de respuesta después de 12 meses","Ausencia de respuesta clínica y objetiva tras completar la inducción (habitualmente sem 8–14, según fármaco), confirmada con biomarcadores o endoscopía","Anticuerpos anti-fármaco detectables","Recaída con niveles terapéuticos"],
c:1,
e:"<b>Falla primaria</b>: sin respuesta tras completar la inducción (8–14 semanas según mecanismo; hasta 12–16 con vedolizumab/anti-IL-23 en EC). Debe confirmarse inflamación objetiva. <b>Pérdida de respuesta (secundaria)</b>: recurrencia de actividad tras respuesta inicial documentada. <b>Intolerancia</b>: suspensión por evento adverso.",
w:{0:"Es pérdida de respuesta secundaria.",2:"Es un hallazgo de laboratorio, no una definición de falla.",3:"Describe falla farmacodinámica secundaria."},
p:"Falla primaria con niveles adecuados sugiere que la vía no es la dominante → cambiar de mecanismo.",
r:"ACG 2025 (evaluación a 8 semanas) · Guía Simposio PANCCO–ACTECCU 2026 §8"},

{id:"TR13",b:"TR",t:"Biosimilares y formulaciones",n:"R",
q:"Por cambio de arsenal, pacientes estables con infliximab originador pasarán a un biosimilar. ¿Conducta?",
o:["Reinducir con 3 dosis del biosimilar","Cambio directo en la siguiente infusión programada, sin reinducción, con información al paciente","Solo cambiar a pacientes naïve","Medir niveles 6 meses antes de decidir"],
c:1,
e:"NOR-SWITCH y la experiencia de vida real: el cambio originador → biosimilar (y entre biosimilares) es no inferior en eficacia y seguridad, <b>sin reinducción</b>.",
w:{0:"Innecesaria.",2:"El cambio en pacientes expuestos está respaldado.",3:"No es necesario para el cambio."},
p:"Infliximab SC (CT-P13 SC, 120 mg c/2 sem) tras inducción IV: LIBERTY-CD/UC mostraron superioridad vs placebo en mantención; es opción para cambio de IV a SC.",
r:"Jørgensen KK et al. Lancet 2017 (NOR-SWITCH) · Hanauer SB et al. Gastroenterology 2024 (LIBERTY)"},

{id:"TR14",b:"TR",t:"Seguridad y cáncer",n:"R",
q:"Hombre de 26 años con EC en infliximab + azatioprina hace 2 años. ¿Qué neoplasias debes vigilar/aconsejar específicamente?",
o:["Cáncer de próstata","Linfoma hepatoesplénico de células T (varón joven, combinación) y cáncer de piel no melanoma (tiopurinas); melanoma asociado a anti-TNF","Leucemia mieloide aguda","Ninguna, el riesgo es igual a la población general"],
c:1,
e:"Tiopurinas: linfoma (incluido hepatoesplénico de células T en varones jóvenes con combinación, casi siempre fatal), cáncer de piel no melanoma, vía urinaria. Anti-TNF: señal de melanoma. Fotoprotección estricta y examen dermatológico anual indefinido.",
w:{0:"Sin asociación.",2:"No es la neoplasia característica.",3:"Hay riesgos específicos de clase."},
p:"Reevaluar periódicamente la necesidad de mantener la tiopurina en la combinación (p. ej. tras 1–2 años con niveles adecuados).",
r:"Beaugerie L, Itzkowitz SH. NEJM 2015;372:1441-52 · ACG Preventive Care 2025"},

{id:"TR15",b:"TR",t:"Seguridad y cáncer",n:"F",
q:"Paciente con CU moderada-grave y antecedente de melanoma tratado hace 3 años. ¿Opción más razonable?",
o:["Infliximab","Vedolizumab o anti-IL-23 / ustekinumab","Azatioprina","Tofacitinib"],
c:1,
e:"Antecedente de melanoma → <b>evitar anti-TNF</b>. Cáncer <2 años o activo: evitar inmunomoduladores (ACTECCU 2026). Preferir clases sin señal oncológica: <b>vedolizumab</b> o <b>anti-IL-23/ustekinumab</b>, con decisión compartida con oncología. JAK: el antecedente de neoplasia es criterio de restricción.",
w:{0:"Señal de melanoma con anti-TNF.",2:"Tiopurinas: riesgo de cáncer de piel.",3:"Neoplasia previa restringe JAK."},
p:"Antecedente de cáncer de piel no melanoma → evitar tiopurinas; cautela con JAK.",
r:"ACTECCU 2026 · Guía Simposio PANCCO–ACTECCU 2026 §18"},

{id:"TR16",b:"TR",t:"Seguridad y cáncer",n:"R",
q:"Paciente con EC en azatioprina 2,2 mg/kg hace 5 meses. Hemograma: leucocitos 2.400/µL, neutrófilos 900/µL, plaquetas 98.000/µL. Afebril. ¿Primer paso?",
o:["Reducir la dosis a la mitad y controlar en 1 mes","Suspender azatioprina; controlar hemograma estrecho; solicitar/revisar TPMT, NUDT15 y metabolitos","Agregar G-CSF y mantener la dosis","Continuar: es esperable"],
c:1,
e:"Mielotoxicidad significativa (neutrófilos <1.000) → <b>suspender</b>. Revisar genotipo/fenotipo de TPMT y <b>NUDT15</b> (relevante en población amerindia y asiática) y 6-TGN (>450 = mielotoxicidad). Reintroducción, si se hace, a dosis reducida tras recuperación y según metabolitos.",
w:{0:"Con neutropenia <1.000 corresponde suspender, no solo reducir.",2:"No se sostiene un fármaco mielotóxico con G-CSF.",3:"Riesgo de sepsis."},
p:"Monitorización: hemograma y perfil hepático cada 1–2 semanas los primeros 2 meses, luego cada 2–3 meses indefinidamente.",
r:"ECCO · Guía Simposio PANCCO–ACTECCU 2026 §4"},

{id:"TR17",b:"TR",t:"Seguridad y cáncer",n:"R",
q:"A los 2 meses de azatioprina, un paciente presenta dolor epigástrico intenso, vómitos y lipasa 5× LSN. Sin litiasis. ¿Conducta?",
o:["Reducir la dosis a 1 mg/kg","Suspender definitivamente la tiopurina (pancreatitis idiosincrásica; no reexponer) y elegir otra estrategia","Cambiar a 6-mercaptopurina","Agregar alopurinol"],
c:1,
e:"La pancreatitis por tiopurinas es <b>idiosincrásica, no dosis-dependiente</b>, y ocurre en las primeras semanas-meses (~3–5%). Suspensión definitiva; la reexposición (incluida 6-MP) suele recurrir.",
w:{0:"No es dosis-dependiente.",2:"Reacción de clase: alta probabilidad de recurrencia.",3:"No aplica."},
p:"El tabaquismo es factor de riesgo de pancreatitis por tiopurinas.",
r:"ECCO · Guía Estudio EII 2026 §8.1"},

{id:"TR18",b:"TR",t:"Inhibidores JAK",n:"F",
q:"¿Cuál es el estado regulatorio más preciso de upadacitinib en EII tras la actualización FDA de octubre de 2025?",
o:["Solo puede usarse tras falla a dos biológicos","Puede usarse tras ≥1 terapia sistémica aprobada cuando el anti-TNF es clínicamente desaconsejable (antes exigía falla/intolerancia a anti-TNF)","Es primera línea en todo paciente naïve sin restricciones","Fue retirado por riesgo cardiovascular"],
c:1,
e:"FDA (13 oct 2025) amplió la indicación de upadacitinib en CU y EC: pacientes con respuesta inadecuada a ≥1 terapia sistémica aprobada cuando los bloqueadores de TNF son clínicamente desaconsejables. Aprobaciones originales: CU marzo 2022; EC mayo 2023. La advertencia de caja negra (infecciones graves, mortalidad, malignidad, MACE, trombosis) se mantiene.",
w:{0:"No existe ese requisito.",2:"Mantiene restricciones y advertencias.",3:"No ha sido retirado."},
p:"Restricción práctica (EMA/FDA): ≥65 años, tabaquismo, riesgo CV o neoplasia → solo si no hay alternativa adecuada; documentarlo en la ficha.",
fix:"v5 databa la aprobación de upadacitinib en CU en 2023 (fue marzo 2022).",
r:"FDA label update 13-10-2025 · AbbVie 16-03-2022 (CU)"},

{id:"TR19",b:"TR",t:"Colitis por inmunoterapia",n:"S",
q:"Paciente con melanoma en ipilimumab + nivolumab desarrolla colitis grado 3 (8 deposiciones/día con sangre, pancolitis ulcerada). ¿Manejo?",
o:["Continuar inmunoterapia + budesonida","Suspender el inhibidor de checkpoint, corticoide sistémico 1–2 mg/kg/día; si no hay respuesta en 48–72 h, infliximab o vedolizumab (considerar biológico precoz ante úlceras extensas)","Mesalazina y ciprofloxacino","Esperar 7 días de corticoides antes de cualquier biológico"],
c:1,
e:"Colitis por inhibidores de puntos de control (ICI) grado 3–4: suspender ICI, <b>corticoides 1–2 mg/kg/día</b> (IV si hospitalizado) y, sin respuesta en <b>48–72 h</b>, <b>infliximab o vedolizumab</b>. El uso precoz de biológico (úlceras endoscópicas extensas) acorta exposición a corticoides. Vedolizumab es atractivo por su selectividad intestinal; datos aleatorizados comparativos en desarrollo.",
w:{0:"No es suficiente para grado 3.",2:"Sin rol.",3:"Esperar 5–7 días está desactualizado: la ventana es 48–72 h."},
p:"Es una entidad distinta de la EII; manejo conjunto con oncología (la reintroducción del ICI es decisión oncológica).",
fix:"v5 esperaba 5–7 días de corticoide antes del biológico.",
r:"ASCO/ESMO irAE guidelines · Dougan M et al. AGA CPU ICI colitis 2021 · ASCO 2024–2025 (IFX vs VDZ)"},

{id:"TR20",b:"TR",t:"Poblaciones especiales",n:"R",
q:"Mujer de 78 años, frágil, con EC colónica moderada-grave activa, diabetes y antecedente de neumonía grave. ¿Opción de mejor perfil?",
o:["Upadacitinib","Azatioprina + infliximab","Vedolizumab o ustekinumab/anti-IL-23","Corticoides en ciclos"],
c:2,
e:"En el adulto mayor la <b>fragilidad</b> (edad biológica) predice mejor que la edad cronológica. Preferir <b>vedolizumab o ustekinumab/anti-IL-23</b> (seguridad sistémica). Evitar JAK (MACE, TEV, zóster) y tiopurinas (linfoma, cáncer de piel no melanoma, infecciones). Corticoides especialmente deletéreos (sarcopenia, delirium, fracturas).",
w:{0:"Restricción por edad y riesgo.",1:"Combinación con alto riesgo infeccioso y oncológico en frágiles.",3:"Deletéreos y no son mantención."},
p:"GETECCU 2025: valoración geriátrica integral sistemática (función, cognición, comorbilidad, polifarmacia, nutrición, soporte social).",
r:"Mañosa M et al. Gastroenterol Hepatol 2025 (GETECCU fragilidad) · ACTECCU 2026"},

{id:"TR21",b:"TR",t:"Poblaciones especiales",n:"R",
q:"Paciente hospitalizado por brote de EII con rectorragia moderada, sin sangrado que comprometa hemodinamia. ¿Tromboprofilaxis?",
o:["Contraindicada por la rectorragia","Indicada: HBPM o fondaparinux en todos sin contraindicación absoluta","Solo compresión neumática","Solo si tiene trombosis previa"],
c:1,
e:"El riesgo de TEV se duplica en la EII hospitalizada. <b>Profilaxis farmacológica universal</b> salvo contraindicación absoluta; la rectorragia no lo es (NNT 35 vs NNH 114). AGA 2026 lo refuerza.",
w:{0:"Error más frecuente en sala.",2:"Inferior; solo si hay contraindicación a anticoagulación.",3:"Aplica a todos."},
p:"Profilaxis extendida al alta: considerar en muy alto riesgo (cirugía reciente, neoplasia, inmovilización); evidencia insuficiente para generalizar.",
r:"AGA CPU Inpatient IBD 2026 · ECCO UC Surgical 2026 enunciado 11"},

{id:"TR22",b:"TR",t:"Acceso en Chile",n:"R",
q:"¿Qué terapias financia la Ley Ricarte Soto (LRS) en EII en Chile?",
o:["CU: infliximab, adalimumab y golimumab · EC: infliximab y adalimumab","CU y EC: vedolizumab y ustekinumab","Todas las terapias avanzadas aprobadas por ISP","Solo infliximab en ambas"],
c:0,
e:"LRS: <b>CU → infliximab, adalimumab, golimumab</b>; <b>EC → infliximab y adalimumab</b>. Financia el fármaco, no los costos de administración. Quedan fuera vedolizumab, ustekinumab, anti-IL-23, JAK y S1P (cobertura privada, seguros o programas). Consecuencia: la optimización del anti-TNF (TDM, intensificación, inmunomodulador) es herramienta central en el sistema público.",
w:{1:"No están en la canasta LRS.",2:"Solo anti-TNF.",3:"Incluye también adalimumab (y golimumab en CU)."},
p:"En el oral: primero la jerarquía por evidencia, después el ajuste por acceso. Verificar cobertura vigente al indicar.",
r:"FONASA LRS · ACTECCU 2026 · Guía Estudio EII 2026 §8.3"},

{id:"TR23",b:"TR",t:"Actualizaciones 2026",n:"S",
q:"¿Cuál afirmación sobre el estado de STRIDE-III y el pipeline es correcta a septiembre de 2026?",
o:["STRIDE-III está publicado y exige remisión histológica en CU","La IOIBD anunció (ago 2026) que presentará STRIDE-III dentro del año; obefazimod completó fase 3 en CU (ABTECT) y tulisokibart (anti-TL1A) fue positivo en inducción fase 3 (ATLAS-UC): ninguno es estándar de manejo","Los anti-TL1A están aprobados por FDA como antifibróticos","Obefazimod es un anti-TNF oral"],
c:1,
e:"STRIDE-III: <b>anunciado, no publicado</b>; el marco citable sigue siendo STRIDE-II (se anticipa clasificar objetivos en formales, adyuvantes y situacionales). <b>Obefazimod</b> (potenciador de miR-124, oral): fase 3 ABTECT de mantención positiva, solicitud a FDA proyectada. <b>Tulisokibart</b> (anti-TL1A): fase 3 ATLAS-UC positiva en inducción; interés por potencial antifibrótico. Pipeline ≠ estándar.",
w:{0:"No publicado; y la histología se anticipa como adyuvante.",2:"No aprobados; el efecto antifibrótico es hipótesis.",3:"Mecanismo miR-124, no anti-TNF."},
p:"Terapia combinada avanzada (p. ej. VEGA: guselkumab + golimumab, fase 2): opción de centro experto, no estándar.",
r:"IOIBD statement. Ther Adv Gastroenterol 2026 · Guía Simposio PANCCO–ACTECCU 2026 §22"},

{id:"TR24",b:"TR",t:"Retiro de terapia",n:"S",
q:"EC en remisión profunda (clínica, endoscópica y bioquímica) >2 años con infliximab + azatioprina. El paciente pregunta por desescalar. ¿Qué evidencia corresponde informar?",
o:["Suspender infliximab tiene riesgo de recaída <10%","Retirar infliximab se asocia a más recaída que continuar (SPARE: recaída a 2 años ~36% vs ~14% si continúa la combinación); retirar la tiopurina manteniendo infliximab es la estrategia de desescalada de menor riesgo; el retratamiento suele recapturar respuesta","Nunca se puede desescalar","Retirar ambos fármacos es igual de seguro"],
c:1,
e:"<b>SPARE</b> (EC, remisión con combinación ≥6 meses): continuar la combinación vs retirar infliximab vs retirar azatioprina. Recaída a 2 años: ~14% (continuar), ~36% (retirar infliximab), ~10% (retirar azatioprina). La retirada de infliximab es posible pero con más recaída; el retratamiento recaptura respuesta en la mayoría. STORI: ~44% de recaída al año tras retirar infliximab. Decisión compartida.",
w:{0:"Subestima el riesgo.",2:"La desescalada es posible con selección y monitorización.",3:"Retirar ambos no está respaldado."},
p:"Predictores de menor recaída: calprotectina baja, curación endoscópica, PCR normal, niveles bajos al retirar, no fumador.",
fix:"v5 extrapolaba 40–50% de recaída anual a vedolizumab en CU sin datos específicos.",
r:"Louis E et al. Lancet Gastroenterol Hepatol 2023 (SPARE) · Louis E et al. Gastroenterology 2012 (STORI)"},

{id:"TR25",b:"TR",t:"Anti-TNF: seguridad",n:"F",
q:"Paciente con EC en remisión con adalimumab desarrolla psoriasis palmoplantar pustulosa extensa. ¿Conducta más razonable si no responde a tratamiento tópico?",
o:["Agregar metotrexato oral y mantener adalimumab","Cambiar a ustekinumab o anti-IL-23 (cubren EC y psoriasis)","Cambiar a infliximab","Agregar corticoides sistémicos crónicos"],
c:1,
e:"<b>Psoriasis paradójica</b> por anti-TNF (efecto de clase, 2–5%). Leve: tópicos manteniendo el anti-TNF. Extensa o refractaria: <b>cambiar a anti-IL-12/23 o anti-IL-23</b>, que tratan ambas condiciones. Cambiar a otro anti-TNF suele recurrir.",
w:{0:"Metotrexato oral no es eficaz en mantención de EC y no resuelve un efecto de clase grave.",2:"Mismo mecanismo.",3:"No se usan corticoides crónicos."},
p:"Pustulosis palmoplantar inducida por anti-TNF → favorecer anti-IL-23 (firma de citoquina).",
r:"Guía Simposio PANCCO–ACTECCU 2026 §7 · ECCO EIM"}
];

{id:"CU29",b:"CU",t:"Scores",n:"R",

e:"MES: 0 normal; 1 eritema, patrón vascular disminuido, friabilidad leve; 2 eritema marcado, ausencia de patrón vascular, friabilidad, erosiones; 3 sangrado espontáneo, úlceras. En el <b>Mayo modificado</b> (mMS, FDA) la friabilidad se excluye del MES 1: cualquier friabilidad = MES ≥2. Se puntúa el segmento más afectado.",

{id:"CU30",b:"CU",t:"Scores",n:"F",
q:"Sobre el índice histológico de Nancy en CU, ¿qué afirmación es correcta?",
o:["Es aditivo: se suman infiltrado agudo, crónico y ulceración (0–10)","Es jerárquico (0–4): ulceración → 4; infiltrado agudo moderado-grave → 3; agudo leve → 2; crónico moderado-grave sin agudo → 1; ausente/leve → 0","Evalúa granulomas y distorsión arquitectural","Solo se aplica a Crohn"],

{id:"CU31",b:"CU",t:"Clasificación",n:"R",
q:"CU con inflamación continua desde el recto hasta el colon transverso medio (proximal al ángulo esplénico). Clasificación de Montreal de extensión:",
o:["E1","E2","E3","E2 con modificador de ciego"],

w:{0:"Solo recto.",1:"Hasta el ángulo esplénico.",3:"No existe tal modificador."},
p:"La extensión define el intervalo de vigilancia y la elección tópica vs sistémica; se consigna la máxima extensión histórica.",
r:"Silverberg MS et al. 2005 (Montreal)"},

{id:"CU32",b:"CU",t:"Moduladores S1P",n:"R",
q:"Antes de iniciar ozanimod en CU, ¿qué evaluación es obligatoria?",
o:["Ecocardiograma y ergometría","Electrocardiograma basal, hemograma con recuento linfocitario, pruebas hepáticas, serología de varicela; fondo de ojo si diabetes o uveítis","Colonoscopía con biopsias de todos los segmentos","Densitometría"],
c:1,
e:"S1P: bradicardia y bloqueo AV de primera dosis (ECG basal; evitar en bloqueo AV de 2.º grado Mobitz II/3.º grado o cardiopatía reciente), edema macular (fondo de ojo en diabéticos/uveítis), elevación de transaminasas, linfopenia, herpes (vacunar si seronegativo, 4 semanas antes). Ozanimod requiere titulación 7 días; interacción con IMAO.",
w:{0:"No necesarios de rutina.",2:"No es requisito del fármaco.",3:"No es requisito."},
p:"No contraindicados en bloqueo AV de 1.er grado, portadores de marcapasos o cardiopatía estable.",
r:"Sandborn WJ et al. NEJM 2021 (TRUE NORTH) · Guía Simposio PANCCO–ACTECCU 2026 §6"},

{id:"EC23",b:"EC",t:"Scores",n:"R",
q:"El SES-CD (Simple Endoscopic Score for Crohn's Disease) evalúa en 5 segmentos:",
o:["Tamaño de úlceras, superficie ulcerada, superficie afectada y presencia/tipo de estenosis","Patrón vascular, sangrado y úlceras","Profundidad de úlcera, longitud, pseudopólipos y granulomas","Deposiciones, dolor, bienestar y masa"],
c:0,
e:"SES-CD: 4 variables (0–3 cada una) × 5 segmentos (íleon, colon derecho, transverso, izquierdo, recto) = 0–56. Úlceras: aftas 0,1–0,5 cm (1), 0,5–2 cm (2), >2 cm (3). Estenosis: única franqueable (1), múltiples franqueables (2), infranqueable (3). Remisión 0–2; leve 3–6; moderada 7–15; grave ≥16. Meta STRIDE-II: <3 o sin úlceras. Respuesta: caída ≥50%.",
w:{1:"Es el UCEIS.",2:"No corresponde.",3:"Es el HBI/CDAI."},
p:"El CDEIS es más laborioso; correlación SES-CD/CDEIS r ≈0,92.",
r:"Daperno M et al. Gastrointest Endosc 2004"},

{id:"EC24",b:"EC",t:"Scores",n:"R",
q:"Respecto de CDAI y HBI en EC, ¿qué afirmación es correcta?",
o:["El CDAI se correlaciona estrechamente con la actividad endoscópica","CDAI <150 y HBI <5 definen remisión clínica; ambos son dominantemente sintomáticos y se correlacionan pobremente con la inflamación objetiva","HBI requiere un diario de 7 días","CDAI no incluye hematocrito"],
c:1,
e:"CDAI (Best 1976): 8 variables ponderadas de 7 días (incluye hematocrito y peso). <150 remisión, 150–219 leve, 220–450 moderada, >450 grave; respuesta = caída ≥70–100. HBI: 5 ítems de un día; <5 remisión, 5–7 leve, 8–16 moderada, >16 grave. En SONIC solo ~la mitad de los pacientes en remisión clínica tenía curación endoscópica.",
w:{0:"Justamente la correlación es pobre.",2:"El HBI es de un solo día; el CDAI requiere 7.",3:"Sí incluye hematocrito (×6)."},
p:"La decisión terapéutica se toma con calprotectina, endoscopía o imagen, no con el score sintomático.",
r:"Best WR et al. Gastroenterology 1976 · Harvey RF, Bradshaw JM. Lancet 1980"},

{id:"TR26",b:"TR",t:"Mecanismos",n:"R",
q:"¿Qué explica que vedolizumab no se asocie a leucoencefalopatía multifocal progresiva (LMP), a diferencia de natalizumab?",
o:["Vedolizumab es un anticuerpo de menor peso molecular","Vedolizumab bloquea selectivamente α4β7 (ligando MAdCAM-1 intestinal); natalizumab bloquea α4 (incluida α4β1–VCAM-1), impidiendo la vigilancia inmune del SNC","Vedolizumab se administra por vía SC","Natalizumab inhibe JAK1"],
c:1,
e:"α4β7–MAdCAM-1 media el homing de linfocitos T memoria al intestino. Natalizumab bloquea la subunidad α4 y con ello α4β1–VCAM-1, necesaria para el tráfico al SNC → reactivación del virus JC (LMP). La selectividad de vedolizumab explica su seguridad y también su lentitud (depende del recambio del infiltrado).",
w:{0:"No es el determinante.",2:"La vía no cambia la selectividad.",3:"Natalizumab es anti-integrina, no JAK."},
p:"En EC con esclerosis múltiple, natalizumab sigue siendo una opción de nicho (con monitorización de anticuerpos anti-JC).",
r:"Feagan BG et al. NEJM 2013 (GEMINI) · Guía Estudio EII 2026 §2"},

{id:"TR27",b:"TR",t:"Mecanismos",n:"F",
q:"¿Qué variante genética identificó PANTS como asociada a mayor inmunogenicidad frente a anti-TNF, independiente del fármaco?",
o:["NOD2","HLA-DQA1*05","NUDT15","TPMT*3A"],
c:1,
e:"<b>HLA-DQA1*05</b> (~40% de europeos) se asoció a ~2 veces más anticuerpos anti-fármaco con infliximab y adalimumab en PANTS; el inmunomodulador concomitante mitigó el riesgo. Útil para decidir combinación. NUDT15 y TPMT predicen mielotoxicidad por tiopurinas; NOD2 se asocia a EC ileal fibroestenosante.",
w:{0:"Susceptibilidad y fenotipo, no inmunogenicidad.",2:"Mielotoxicidad por tiopurinas.",3:"Metabolismo de tiopurinas."},
p:"Portador de HLA-DQA1*05 → argumento para combinación o monitorización proactiva.",
r:"Sazonovs A et al. Gastroenterology 2020 · Kennedy NA et al. Lancet Gastroenterol Hepatol 2019 (PANTS)"},

{id:"TR28",b:"TR",t:"Monitorización (TDM)",n:"F",
q:"¿Qué umbral de nivel valle de infliximab se asocia a mayor cierre de fístulas en EC perianal?",
o:["≥1 µg/mL","≥3 µg/mL","≥10 µg/mL (varios estudios sugieren >10–20)","No existe relación exposición-respuesta en perianal"],
c:2,
e:"En EC perianal la relación exposición-respuesta exige niveles más altos que en enfermedad luminal (mantención luminal ≥5 µg/mL): niveles valle <b>≥10 µg/mL</b> (series con >20 en inducción) se asocian a mayor cierre y curación radiológica. Justifica optimización proactiva en fístula.",
w:{0:"Subterapéutico.",1:"Umbral de ventana baja de mantención (TAXIT), insuficiente en perianal.",3:"Sí existe relación consistente."},
p:"Adalimumab en perianal: >12 µg/mL en algunas series.",
r:"Yarur AJ et al. Aliment Pharmacol Ther 2017 · Guía Simposio PANCCO–ACTECCU 2026 §9"},

{id:"TR29",b:"TR",t:"Inhibidores JAK",n:"R",
q:"Hallazgo de laboratorio esperado tras iniciar tofacitinib o upadacitinib, que se monitoriza pero habitualmente no obliga a suspender:",
o:["Hipoglicemia","Aumento de colesterol total, LDL y HDL a las 4–8 semanas","Hiperpotasemia","Hipercalcemia"],
c:1,
e:"Los JAK elevan lípidos (LDL, HDL, triglicéridos) de forma dosis-dependiente: perfil lipídico basal y a las 4–8 semanas, tratando según riesgo CV. También: CPK, transaminasas, citopenias (JAK2: eritropoyesis y plaquetas). Herpes zóster es el evento adverso infeccioso característico.",
w:{0:"No es efecto de clase.",2:"No es efecto de clase.",3:"No es efecto de clase."},
p:"Selectividad: upadacitinib y filgotinib JAK1; tofacitinib pan-JAK (1/3>2).",
r:"Sandborn WJ et al. NEJM 2017 (OCTAVE) · Guía Simposio PANCCO–ACTECCU 2026 §6"},

{id:"CU33",b:"CU",t:"CU aguda grave",n:"S",
q:"Embarazada de 22 semanas con CU extensa ingresa con CUAG. Día 3 de metilprednisolona IV: 9 deposiciones, PCR 64 mg/L. ¿Mejor rescate?",
o:["Upadacitinib 45 mg/día","Infliximab 5 mg/kg (considerar dosificación optimizada si hipoalbuminemia), manteniendo tromboprofilaxis y coordinación obstétrico-quirúrgica","Metotrexato SC","Esperar al parto con corticoide IV prolongado"],
c:1,
e:"La CUAG en embarazo tiene alta mortalidad fetal; el tratamiento no se retrasa. Rescate con <b>infliximab</b> (datos de seguridad más amplios; la transferencia placentaria se planifica con las vacunas del lactante). Ciclosporina es alternativa en centros con experiencia. JAK y metotrexato contraindicados. Sigmoidoscopía sin sedación profunda es segura; HBPM indicada. Colectomía si falla el rescate.",
w:{0:"Contraindicado en embarazo.",2:"Teratógeno y abortivo.",3:"Prolongar corticoide sin respuesta aumenta el riesgo materno-fetal."},
p:"En embarazo avanzado la cirugía puede combinarse con cesárea según edad gestacional; decisión multidisciplinaria.",
r:"Global Consensus IBD & Pregnancy 2019 · ECCO Pregnancy 2023 · ECCO UC Medical 2026"},

{id:"CU34",b:"CU",t:"CU aguda grave",n:"F",
q:"Paciente con CUAG en metilprednisolona IV. Toxina de <i>C. difficile</i> positiva al ingreso. ¿Conducta?",
o:["Suspender corticoides y tratar solo la infección","Continuar corticoides IV y tratar la infección en paralelo (fidaxomicina o vancomicina oral); evaluar respuesta de la CU a las 72 h","Metronidazol IV y suspender corticoides","Colectomía inmediata"],
c:1,
e:"No se retrasa ni suspende el corticoide por <i>C. difficile</i> o CMV: se tratan en paralelo (AGA 2026; ACG 2025). Fidaxomicina 200 mg c/12 h × 10 días o vancomicina 125 mg c/6 h × 10–14 días. Si no mejora en 48–72 h, reevaluar endoscópicamente y considerar rescate.",
w:{0:"Deja la CUAG sin tratar.",2:"Metronidazol no se recomienda en EII.",3:"Sin indicación de urgencia quirúrgica."},
p:"La infección por <i>C. difficile</i> aumenta el riesgo de colectomía y mortalidad en CUAG: tratar precozmente.",
r:"Khanna S et al. AGA CPU 2026 · ACG UC 2025"},

{id:"CU35",b:"CU",t:"Posicionamiento terapéutico",n:"S",
q:"Mujer de 41 años, CU extensa, sin factores de riesgo CV, con falla a infliximab (inmunogénica), vedolizumab (primaria) y ustekinumab (farmacodinámica). Mayo endoscópico 3 ambulatoria, corticodependiente. ¿Conducta más adecuada?",
o:["Tofacitinib 5 mg c/12 h","Upadacitinib 45 mg/día × 8 semanas, discutiendo en paralelo la colectomía programada como alternativa válida","Reintentar vedolizumab c/4 semanas","Adalimumab + azatioprina"],
c:1,
e:"En CU multi-expuesta, los JAK tienen el mejor rendimiento relativo (metaanálisis en red); upadacitinib 45 mg de inducción. Tras 3 mecanismos fallidos, la <b>colectomía con reservorio</b> es opción legítima (no un fracaso) y debe discutirse en paralelo, junto con anti-IL-23 p19 o S1P según perfil.",
w:{0:"Dosis de mantención, no de inducción.",2:"Falla primaria documentada: baja probabilidad.",3:"Falla inmunogénica a infliximab + multi-falla: opción débil."},
p:"Documentar las razones de cada falla orienta el siguiente paso y la gestión de acceso.",
r:"ECCO UC Medical 2026 · ECCO UC Surgical 2026 · Guía Simposio PANCCO–ACTECCU 2026 §11"},

{id:"CU36",b:"CU",t:"Displasia y CCR",n:"S",
q:"Hombre de 39 años con CU extensa y CEP. En la vigilancia anual, biopsias aleatorias muestran displasia de alto grado en colon transverso, confirmada por patólogo experto; la cromoendoscopía de alta definición repetida por endoscopista experto no identifica lesión visible. ¿Conducta?",
o:["Repetir en 1 año","Proctocolectomía; el reservorio ileoanal es opción segura en CEP","Colectomía subtotal con anastomosis ileorrectal","Resección endoscópica de la zona"],
c:1,
e:"<b>Displasia invisible de alto grado</b> confirmada → <b>proctocolectomía</b>. En CEP, el reservorio ileoanal es opción segura (ECCO quirúrgica 2026, enunciado 20); la anastomosis ileorrectal deja recto con mayor riesgo de cáncer en CEP.",
w:{0:"Riesgo inaceptable de CCR sincrónico/metacrónico.",2:"Mayor riesgo de cáncer en recto remanente con CEP.",3:"No hay lesión visible que resecar."},
p:"Mayor riesgo de reservoritis crónica e ileítis pre-reservorio en CEP.",
r:"SCENIC 2015 · ECCO UC Surgical 2026"},

{id:"CU37",b:"CU",t:"Anti-integrina",n:"F",
q:"CU moderada en vedolizumab IV 300 mg sem 0-2-6. A la semana 10 hay respuesta parcial (calprotectina 480 µg/g, MES 2). Sin signos de gravedad. ¿Conducta más razonable?",
o:["Declarar falla primaria y cambiar de clase","Dosis adicional a la semana 10 y/o intensificar a c/4 semanas, y reevaluar a la semana 14–16 antes de declarar falla","Agregar prednisona crónica","Pasar a vedolizumab SC 108 mg c/4 semanas"],
c:1,
e:"Vedolizumab tiene inicio lento (respuesta hasta semana 14, sobre todo en EC); en respondedores parciales una dosis adicional a la semana 10 o intensificación c/4 semanas recaptura respuesta en una proporción relevante. Declarar falla antes del tiempo propio del fármaco desperdicia una clase segura.",
w:{0:"Prematuro para vedolizumab.",2:"Los corticoides no son mantención.",3:"La formulación SC es 108 mg c/2 semanas y no es estrategia de rescate de respuesta parcial."},
p:"Niveles de vedolizumab: correlación exposición-respuesta más débil que anti-TNF; umbrales orientativos semana 6 >18–24 µg/mL.",
r:"Guía Simposio PANCCO–ACTECCU 2026 §9 · ACG UC 2025"},

{id:"CU38",b:"CU",t:"Manifestaciones extraintestinales",n:"F",
q:"CU moderada activa con pioderma gangrenoso ulcerado en pierna y epiescleritis. ¿Mejor elección?",
o:["Vedolizumab","Infliximab (± corticoide sistémico inicial)","Ozanimod","Mesalazina en dosis alta"],
c:1,
e:"Pioderma gangrenoso: corticoides sistémicos y <b>anti-TNF (infliximab con mejor evidencia)</b>; es parcialmente independiente de la actividad luminal. La epiescleritis sigue la actividad y mejora al controlar la CU. Vedolizumab y S1P no controlan manifestaciones extraintestinales.",
w:{0:"Mecanismo intestino-selectivo.",2:"Sin evidencia en MEI.",3:"Insuficiente para CU moderada con PG."},
p:"Evitar debridamiento quirúrgico del PG (patergia).",
r:"ECCO EIM guideline 2024 · Guía Simposio PANCCO–ACTECCU 2026 §5"},

{id:"EC25",b:"EC",t:"Poblaciones especiales",n:"S",
q:"Mujer de 34 años con EC ileocolónica moderada-grave y esclerosis múltiple remitente-recurrente en tratamiento neurológico. ¿Qué clase se evita?",
o:["Ustekinumab o anti-IL-23","Anti-TNF","Vedolizumab","Natalizumab (en coordinación con neurología)"],
c:1,
e:"Los anti-TNF pueden precipitar o empeorar enfermedad desmielinizante: <b>contraindicación relativa firme</b>. Alternativas: anti-IL-23/ustekinumab, vedolizumab; <b>natalizumab</b> es una opción que trata ambas (con estratificación de riesgo JC). En CU, se discute S1P (ozanimod/etrasimod) por su uso en EM.",
w:{0:"Opción razonable.",2:"Opción razonable (sin efecto en EM).",3:"Opción de nicho que cubre ambas enfermedades."},
p:"'Firma de citoquina': la enfermedad inmunomediada asociada ayuda a elegir el mecanismo.",
r:"Guía Simposio PANCCO–ACTECCU 2026 §7 · ECCO"},

{id:"EC26",b:"EC",t:"Poblaciones especiales",n:"F",
q:"Hombre de 67 años con EC colónica moderada, insuficiencia cardíaca con FEVI 30% (NYHA III). ¿Qué evitar?",
o:["Vedolizumab","Anti-TNF (especialmente en dosis altas)","Ustekinumab","Risankizumab"],
c:1,
e:"Anti-TNF: contraindicados en insuficiencia cardíaca NYHA III–IV (ATTACH: infliximab 10 mg/kg aumentó mortalidad/hospitalización). Preferir vedolizumab o anti-IL-23/ustekinumab. JAK y S1P también con reparos cardiovasculares en este perfil.",
w:{0:"Opción segura.",2:"Opción segura.",3:"Opción segura."},
p:"Contraindicaciones de anti-TNF: IC III–IV, desmielinización, melanoma previo, TBC activa.",
r:"Chung ES et al. Circulation 2003 (ATTACH) · ACG CD 2025"},

{id:"EC27",b:"EC",t:"Crohn perianal",n:"S",
q:"Mujer de 30 años con EC y fístula rectovaginal sintomática, con proctitis activa (úlceras en recto). ¿Paso siguiente?",
o:["Colgajo de avance rectal inmediato","Control de la inflamación rectal con terapia médica (anti-TNF optimizado) y setón si hay sepsis; la reparación quirúrgica solo con recto sin inflamación","Fistulotomía","Observación"],
c:1,
e:"Las reparaciones (colgajo de avance, interposición) fracasan con proctitis activa. Primero control de sepsis y de la inflamación rectal (anti-TNF con niveles altos; alternativas post-falla: upadacitinib, anti-IL-23/ustekinumab), luego reparación en centro experto. En refractarias: derivación o proctectomía.",
w:{0:"Alta tasa de falla con recto inflamado.",2:"Riesgo de incontinencia; no aplica a rectovaginal.",3:"Sintomática: requiere tratamiento."},
p:"Parto: la enfermedad perianal activa y la fístula rectovaginal favorecen cesárea.",
r:"ECCO CD Surgical · ACG CD 2025 · Geldof 2022"},

{id:"EC28",b:"EC",t:"Recurrencia posquirúrgica",n:"F",
q:"Paciente operado de resección ileocólica hace 8 meses, sin profilaxis (bajo riesgo). Ileocolonoscopía: >5 aftas en el neoíleon con mucosa normal interpuesta; anastomosis sin lesiones. ¿Conducta?",
o:["Observación: sin síntomas no se trata","i2b: iniciar terapia (anti-TNF de preferencia; alternativas vedolizumab/ustekinumab) y reevaluar a los 6–12 meses","Mesalazina","Nueva cirugía"],
c:1,
e:"<b>i2b</b> = recurrencia endoscópica significativa: iniciar o intensificar terapia aunque esté asintomático (la recurrencia endoscópica precede a la clínica). Luego control objetivo (calprotectina, IUS, endoscopía).",
w:{0:"La clínica va por detrás de la endoscopía.",2:"Eficacia marginal.",3:"No hay indicación quirúrgica."},
p:"POCER: estrategia de ileocolonoscopía a los 6 meses con escalada según hallazgos reduce recurrencia.",
r:"De Cruz P et al. Lancet 2015 (POCER) · ACG CD 2025"},

{id:"EC29",b:"EC",t:"Anti-IL-12/23 e IL-23",n:"S",
q:"EC en ustekinumab 90 mg c/4 semanas (intensificado). Recaída con úlceras ileales, nivel valle 9 µg/mL, sin anticuerpos. Antes: falla a adalimumab. ¿Siguiente paso?",
o:["Reinducción IV de ustekinumab","Cambio a anti-IL-23 p19 (risankizumab o guselkumab) o upadacitinib","Volver a adalimumab","Agregar azatioprina"],
c:1,
e:"Nivel alto sin anticuerpos con inflamación = <b>falla farmacodinámica</b>. SEQUENCE respalda risankizumab tras falla a anti-TNF con superioridad endoscópica sobre ustekinumab; el cambio p40 → p19 es defendible. Upadacitinib es alternativa de alta eficacia (especialmente con enfermedad colónica o alto aclaramiento).",
w:{0:"Exposición ya adecuada.",2:"Falla previa a la clase.",3:"No corrige una falla farmacodinámica."},
p:"Descartar antes estenosis fibrótica, que no responde a ningún mecanismo.",
r:"SEQUENCE NEJM 2024 · Guía Simposio PANCCO–ACTECCU 2026 §11"},

{id:"TR30",b:"TR",t:"Monitorización (TDM)",n:"S",
q:"EC grave con albúmina 24 g/L y PCR 110 mg/L que inicia infliximab 5 mg/kg. Nivel en semana 2: 6 µg/mL (esperado >18–22). ¿Conducta?",
o:["Continuar el esquema estándar y medir en semana 14","Optimizar precozmente: adelantar la dosis y/o aumentar a 10 mg/kg (inducción acelerada) por alto aclaramiento","Cambiar de clase de inmediato","Agregar corticoides"],
c:1,
e:"Hipoalbuminemia y alta carga inflamatoria aumentan el aclaramiento (pérdida entérica, consumo por TNF tisular). Un nivel bajo en inducción predice falla primaria y mayor inmunogenicidad: <b>inducción acelerada/optimizada</b> guiada por niveles. Es donde el TDM proactivo tiene más sentido.",
w:{0:"Se pierde la ventana de rescate farmacocinético.",2:"Aún no hay falla; es subexposición.",3:"No resuelve la exposición."},
p:"Semana 14 (PANTS): infliximab ≥7 µg/mL predice remisión.",
r:"PANTS 2019 · Guía Simposio PANCCO–ACTECCU 2026 §9"},

{id:"TR31",b:"TR",t:"Inhibidores JAK",n:"F",
q:"Paciente de 52 años con CU en remisión con tofacitinib 5 mg c/12 h desarrolla trombosis venosa profunda sin gatillante. ¿Conducta?",
o:["Continuar tofacitinib y anticoagular","Suspender el JAK, anticoagular y cambiar a otra clase (vedolizumab, anti-IL-23/ustekinumab, anti-TNF)","Reducir a 5 mg/día","Cambiar a upadacitinib"],
c:1,
e:"Trombosis venosa bajo JAK → <b>suspender</b> (trombosis activa es contraindicación). Cambiar a mecanismo sin señal trombótica. No cambiar a otro JAK (efecto de clase).",
w:{0:"Contraindicado continuar.",2:"No elimina el riesgo.",3:"Mismo efecto de clase."},
p:"La EII activa es por sí misma protrombótica: controlar la inflamación también es prevención.",
r:"FDA/EMA JAK safety · Guía Simposio PANCCO–ACTECCU 2026 §6"},

{id:"TR32",b:"TR",t:"Moduladores S1P",n:"F",
q:"Paciente con CU en etrasimod desarrolla herpes zóster dermatómico; linfocitos 180/µL. ¿Conducta?",
o:["Continuar sin cambios: la linfopenia es esperable","Interrumpir temporalmente el S1P, tratar con antiviral y reevaluar su reinicio según recuperación linfocitaria y evolución","Cambiar a ozanimod","Agregar corticoides"],
c:1,
e:"La linfopenia es mecanística y habitualmente no obliga a suspender; pero con <b>infección</b> y recuento <b><200/µL</b> se recomienda interrumpir. Con etrasimod la recuperación es rápida (7–14 días), lo que facilita reiniciar.",
w:{0:"Con infección y linfopenia profunda corresponde interrumpir.",2:"Mismo mecanismo y recuperación más lenta.",3:"Empeora la inmunosupresión."},
p:"Vacunar contra zóster (recombinante) antes o durante S1P.",
r:"Ficha técnica etrasimod/ozanimod · Guía Simposio PANCCO–ACTECCU 2026 §6"},

{id:"TR33",b:"TR",t:"Embarazo",n:"F",
q:"Mujer con EC y fístula perianal activa compleja, 34 semanas de embarazo, en infliximab. ¿Vía del parto?",
o:["Parto vaginal con episiotomía","Cesárea","Parto vaginal instrumental con fórceps","Indiferente"],
c:1,
e:"La <b>enfermedad perianal activa</b> (y el antecedente de reservorio ileoanal) son las principales indicaciones de cesárea en EII; fuera de ellas la EII no la impone. La episiotomía y el trauma perineal empeoran la enfermedad perianal.",
w:{0:"Empeora el periné.",2:"Riesgo de lesión esfinteriana.",3:"No es indiferente con perianal activa."},
p:"Planificar la última dosis de infliximab y el plan de vacunas del lactante antes del parto.",
r:"Global Consensus 2019 · ECCO Pregnancy 2023"},

{id:"TR34",b:"TR",t:"Tamizaje e infecciones",n:"S",
q:"Candidato a infliximab: HBsAg negativo, anti-HBc positivo, anti-HBs negativo, ADN-VHB indetectable. ¿Conducta?",
o:["Contraindicación de anti-TNF","Monitorizar ADN-VHB y transaminasas (c/1–3 meses) o profilaxis antiviral según riesgo; profilaxis preferida con combinación/alto riesgo","Vacunar y esperar anti-HBs >10 antes de iniciar","Ignorar: no hay infección"],
c:1,
e:"<b>Anti-HBc aislado</b> = infección resuelta/oculta con riesgo moderado de reactivación bajo inmunosupresión. Estrategias: monitorización seriada de ADN-VHB con tratamiento anticipado, o profilaxis (entecavir/tenofovir), preferida en alto riesgo (combinación, corticoides altos, rituximab).",
w:{0:"No es contraindicación.",2:"No sustituye la vigilancia y no debe retrasar la terapia.",3:"Existe riesgo de reactivación."},
p:"HBsAg positivo: profilaxis siempre.",
r:"ECCO Infections 2026 · AASLD 2018"},

{id:"TR35",b:"TR",t:"Monitorización (TDM)",n:"S",
q:"CU en adalimumab 40 mg c/2 sem con síntomas persistentes. Nivel valle 11 µg/mL y anticuerpos positivos en título alto. ¿Interpretación?",
o:["Falla farmacodinámica: cambiar de clase","Combinación biológicamente inconsistente: verificar el ensayo (anticuerpos no neutralizantes, interferencia) y confirmar inflamación objetiva antes de decidir","Falla inmunogénica: cambiar a infliximab","Intensificar a semanal"],
c:1,
e:"Nivel adecuado + anticuerpos altos es incoherente: sugiere anticuerpos no neutralizantes, interferencia del método (ensayos drug-sensitive vs drug-tolerant) o falso positivo. Repetir, idealmente con el mismo laboratorio, y confirmar inflamación (calprotectina, endoscopía) antes de actuar.",
w:{0:"Prematuro sin validar el resultado.",2:"Con nivel adecuado no hay evidencia de falla inmunogénica funcional.",3:"La exposición ya es adecuada."},
p:"Sin inflamación demostrada no hay falla terapéutica.",
r:"Guía Simposio PANCCO–ACTECCU 2026 §9"},

{id:"TR36",b:"TR",t:"Terapia combinada avanzada",n:"S",
q:"EC ileocolónica con enfermedad perianal y luminal refractaria a anti-TNF optimizado, anti-IL-23 y upadacitinib. Se discute terapia combinada avanzada (dos terapias avanzadas). ¿Afirmación correcta?",
o:["Es estándar de manejo recomendado por ECCO y ACG","Es opción de centro experto con comité y consentimiento; la evidencia es mayoritariamente de series y fase 2 (p. ej. VEGA en CU); el riesgo infeccioso acumulado es la principal incógnita","Está contraindicada por FDA","Solo se permite combinar dos anti-TNF"],
c:1,
e:"La terapia combinada avanzada (una sobre la señal —anti-TNF, anti-IL-23, JAK— y otra sobre el tráfico —vedolizumab—) se reserva para respuesta parcial refractaria, perianal compleja, MEI discordante o puente. VEGA (guselkumab + golimumab en CU, fase 2) mostró señal de eficacia. No es estándar.",
w:{0:"No es estándar.",2:"No existe tal contraindicación formal; es uso fuera de ficha.",3:"Combinar dos anti-TNF carece de sentido."},
p:"Alternativa quirúrgica y ensayos clínicos deben discutirse en paralelo.",
r:"Feagan BG et al. Lancet Gastroenterol Hepatol 2023 (VEGA) · Guía Simposio PANCCO–ACTECCU 2026 §10"}
];

const MECH = {
CU02:"El corticoide IV suprime NF-κB y la transcripción de TNF-α, IL-1β e IL-6; su efecto sobre la PCR (vida media ~19 h) se ve en 48–72 h. Si al día 3 persisten >8 deposiciones o la PCR sigue >45 mg/L, la inflamación es corticorresistente (mucosa ulcerada profunda, pérdida proteica, a veces CMV o <i>C. difficile</i>). Por eso el día 3 es el punto de decisión y no el día 7.",
CU04:"En la colitis grave la mucosa ulcerada pierde proteínas y con ellas el anticuerpo: se detecta infliximab en heces y el aclaramiento se acelera. Además el TNF tisular abundante 'consume' fármaco (efecto sumidero). La albúmina baja es un marcador indirecto de ambos fenómenos, por eso predice subexposición.",
CU05:"La ciclosporina inhibe calcineurina → bloquea la desfosforilación de NFAT y la transcripción de IL-2 en linfocitos T. Es lipofílica y viaja en lipoproteínas: con colesterol bajo aumenta la fracción libre que entra al SNC; la hipomagnesemia baja el umbral convulsivo. Su acción es rápida (días) pero no es mantención: de ahí el concepto de puente.",
CU07:"JAK1 transduce señales de IL-6, IFN-γ, IL-12/23 (vía TYK2/JAK2) y cadenas γ-común. Al bloquear la señalización intracelular de múltiples citoquinas a la vez, el efecto aparece en días. Como molécula pequeña no se pierde por la mucosa ni depende de la albúmina, a diferencia de los anticuerpos monoclonales.",
CU11:"El 5-ASA actúa por contacto con la mucosa: activa PPAR-γ en el colonocito, inhibe NF-κB y la vía de ciclooxigenasa/lipooxigenasa. La concentración mucosa lograda por supositorio en el recto es muy superior a la de la vía oral, que se diluye y se absorbe proximalmente. Por eso la vía tópica es la base en proctitis.",
CU12:"Las formulaciones orales liberan 5-ASA según pH o tiempo en íleon terminal y colon, pero el colon distal recibe menos fármaco (tránsito rápido, diarrea). El enema cubre hasta el ángulo esplénico. Sumar ambas vías cubre toda la extensión con concentración mucosa alta.",
CU13:"Cuando la terapia avanzada controla la inflamación, el efecto antiinflamatorio tópico del 5-ASA deja de aportar beneficio medible, y la carga de comprimidos reduce la adherencia al fármaco que sí importa. La señal de 'daño' en cohortes refleja que quien sigue con 5-ASA es quien tiene enfermedad más difícil (confusión por indicación).",
CU14:"El corticoide no induce curación mucosa: suprime la inflamación mientras está presente. Si la actividad reaparece al bajar de 10 mg o al suspender, la biología inflamatoria no ha sido controlada y se acumula toxicidad (ósea, metabólica, infecciosa) sin modificar el curso.",
CU16:"MES 0 significa mucosa con patrón vascular normal y sin friabilidad: ausencia de inflamación activa visible. El MES 1 conserva eritema y friabilidad leve, que se asocia a más recaída a 12 meses (~29% vs ~14%). Por eso STRIDE-II exige MES 0 y los ensayos, más laxos, usan MES ≤1.",
CU17:"El UCEIS se desarrolló con metodología de validación formal (variabilidad inter e intraobservador) y excluyó la friabilidad, que es subjetiva. Puntúa los tres descriptores que mejor predicen la evaluación global de gravedad: patrón vascular, sangrado y ulceración.",
CU19:"Vedolizumab bloquea α4β7 y reduce el reclutamiento de linfocitos al colon; en CU, enfermedad mucosa y continua, esta estrategia de 'cerrar la puerta' funciona bien. Adalimumab SC tiene dosis fija y mayor inmunogenicidad en CU que infliximab, lo que puede explicar su menor rendimiento en VARSITY.",
CU21:"Los moduladores S1P internalizan el receptor S1P1 y secuestran linfocitos en los ganglios. Al suspender, el receptor se reexpresa cuando el fármaco y sus metabolitos se eliminan: ozanimod tiene metabolitos activos de vida media larga (recuperación ~3 meses); etrasimod no (7–14 días).",
CU22:"IL-23 (p19 + p40) mantiene y expande Th17 patogénicos (IL-17, IL-22, GM-CSF). Los anti-p19 bloquean solo IL-23 y respetan IL-12 (Th1 antimicrobiano), lo que explica su perfil de seguridad. La inducción IV da concentraciones altas iniciales; la mantención SC c/4 semanas de mirikizumab refleja su farmacocinética.",
CU25:"En CEP el ambiente biliar alterado (ácidos biliares secundarios en colon derecho) y la inflamación subclínica persistente aumentan el riesgo de displasia desde el inicio, con predominio proximal y lesiones planas difíciles de ver. Por eso no se espera la latencia de 8 años.",
CU27:"La reservoritis crónica refleja disbiosis del reservorio (estasis, metaplasia colónica del epitelio ileal) con respuesta inmune mucosa persistente. Vedolizumab reduce el reclutamiento linfocitario hacia la mucosa del reservorio (MAdCAM-1 expresada), actuando sobre la inflamación sin depender de la microbiota.",
CU28:"Los corticoides alteran la cicatrización (síntesis de colágeno) y la inmunidad, con aumento dosis-dependiente de dehiscencia e infecciones. Los biológicos, en cambio, no han mostrado aumento consistente de complicaciones en cohortes grandes; suspenderlos arriesga brote preoperatorio.",
CU29:"La friabilidad (sangrado al contacto) traduce un epitelio inflamado con capilares expuestos; su valoración es subjetiva. Excluirla del MES 1 en el Mayo modificado hace que 'MES 1' represente inflamación realmente leve y mejora la reproducibilidad entre lectores.",
CU30:"La lógica jerárquica de Nancy prioriza el hallazgo de peor pronóstico: la ulceración y los neutrófilos (actividad aguda) pesan más que el infiltrado crónico. Sumar ítems sobrestima la actividad de una mucosa solo con infiltrado crónico y subestima una con úlcera.",
CU31:"La extensión refleja el territorio inflamado máximo: a mayor extensión, mayor carga inflamatoria acumulada y mayor riesgo de colectomía y de displasia. El ángulo esplénico es además el límite práctico del alcance de la terapia rectal.",
CU32:"S1P1 también se expresa en miocitos auriculares: la primera dosis activa corrientes de potasio (GIRK) y enlentece la frecuencia antes de la internalización del receptor. En retina, la modulación de S1P altera la barrera endotelial y puede producir edema macular. La titulación de ozanimod atenúa el efecto cardíaco.",
EC02:"La budesonida tiene metabolismo de primer paso hepático >85% vía CYP3A4: alta concentración en íleon y ciego con baja exposición sistémica. Sirve para inducir en enfermedad ileocecal, pero la inflamación transmural recurre al suspender y no mantiene remisión.",
EC03:"A dosis bajas el metotrexato actúa sobre todo aumentando adenosina extracelular (inhibición de ATIC) con efecto antiinflamatorio; la inhibición de dihidrofolato reductasa explica la toxicidad (por eso el folato). La biodisponibilidad oral es errática y saturable, de ahí la preferencia por vía parenteral.",
EC04:"La tiopurina reduce la formación de anticuerpos anti-infliximab (inmunogenicidad) y aumenta los niveles valle; el beneficio en SONIC se explica sobre todo por mejor farmacocinética. Adalimumab, totalmente humano y SC, es menos inmunogénico, por eso la combinación aporta menos.",
EC11:"Ustekinumab bloquea p40, subunidad compartida por IL-12 e IL-23. La inducción IV por peso busca exposición homogénea: el volumen de distribución y el aclaramiento dependen del peso. Las bandas son ≤55, >55–85 y >85 kg.",
EC12:"Bloquear p19 inhibe IL-23 sin afectar IL-12; IL-12 puede tener un rol regulador (inducción de IFN-γ con efectos contrarregulatorios sobre Th17). Además los anti-p19 tienen mayor potencia de unión. La consecuencia clínica es mayor curación endoscópica en EC post anti-TNF.",
EC13:"Guselkumab es IgG1 humano con Fc nativo: se une a CD64 en monocitos que producen IL-23 y la neutraliza en su origen. Su biodisponibilidad SC permite alcanzar exposiciones de inducción con 400 mg SC. Risankizumab y mirikizumab tienen Fc mutado (sin unión a receptores Fcγ).",
EC14:"En EC la inflamación transmural tarda más en responder que la mucosa de la CU; por eso la inducción con 45 mg se extiende a 12 semanas. La mantención con 30 mg ofrece más exposición en enfermedad de difícil control, con más eventos adversos dosis-dependientes (zóster, lípidos).",
EC15:"En EC la histología es parcheada y la biopsia muestrea poco de un proceso transmural: su valor pronóstico es inconsistente. La curación endoscópica (ausencia de úlceras) es el desenlace con mejor relación con cirugía y hospitalización; la transmural agrega información pero sin ensayos de estrategia.",
EC16:"El engrosamiento de pared refleja edema, infiltrado inflamatorio y, más tarde, fibrosis e hipertrofia muscular. La hiperemia Doppler marca neovascularización inflamatoria activa, y la pérdida de estratificación sugiere compromiso transmural profundo. La grasa mesentérica hiperecogénica ('creeping fat') es característica de EC.",
EC17:"Montreal separa localización (que tiende a ser estable) de comportamiento (que progresa: inflamatorio → estenosante/penetrante por inflamación transmural no controlada). La enfermedad perianal es un eje propio con mecanismo distinto (criptoglandular + inflamación), por eso es modificador y no define B3.",
EC18:"La azatioprina pasa a 6-MP; TPMT la metila hacia 6-MMP (hepatotóxico) y la vía HPRT la lleva a 6-TGN (activo, se incorpora al ADN y bloquea Rac1 en linfocitos T). El alopurinol inhibe xantina oxidasa y, por un mecanismo que aumenta la disponibilidad hacia HPRT, desvía el flujo a 6-TGN; por eso la dosis de tiopurina debe bajar a un cuarto.",
EC21:"La TC con contraste IV muestra realce mucoso, edema, dilatación preestenótica, colecciones y aire libre. El contraste oral no es necesario y puede retrasar o empeorar la obstrucción. Permite separar el componente inflamatorio (realce, engrosamiento en capas) del fibrótico.",
EC22:"La NEE excluye antígenos dietarios y aditivos (emulsificantes), modifica la microbiota y los ácidos biliares, y aporta nutrición completa. En niños además favorece el crecimiento sin corticoides. La limitación en adultos es la adherencia a 6–8 semanas de fórmula exclusiva.",
EC23:"El SES-CD cuantifica la carga de úlceras y la superficie inflamada por segmento, variables que se asocian a progresión (SES-CD ≥4) y cirugía. Al sumar segmentos, refleja la extensión real; su simplicidad frente al CDEIS favorece su uso fuera de ensayos.",
EC24:"Los síntomas de EC dependen también de estenosis, sales biliares, sobrecrecimiento bacteriano y síndrome de intestino irritable superpuesto; por eso los índices sintomáticos no reflejan la inflamación. El CDAI además pondera variables como el hematocrito y el peso que cambian por causas no inflamatorias.",
TR03:"El metotrexato inhibe la síntesis de purinas y timidilato en tejidos de división rápida: en el embrión produce el síndrome aminopterina/metotrexato (defectos craneofaciales, esqueléticos) y pérdida gestacional. Se poliglutamata y persiste en tejidos semanas, de ahí el período de lavado.",
TR07:"JAK1/JAK3 median la señal de IL-2, IL-15 e interferones, esenciales para linfocitos T CD8 y células NK que mantienen latente al virus varicela-zóster en los ganglios sensitivos. Por eso el zóster es el evento adverso característico y dosis-dependiente de los JAK. La vacuna recombinante (glicoproteína E + adyuvante) no replica.",
TR11:"El TDM proactivo busca mantener exposición por sobre un umbral antes de que la subexposición genere inflamación o anticuerpos. El beneficio depende del momento: es mayor en inducción y alto aclaramiento, y menor en pacientes estables, donde la mayoría ya está en rango. Eso explica los resultados mixtos de los ensayos.",
TR12:"La falla primaria suele indicar que la vía bloqueada no domina en ese paciente (falla farmacodinámica) o una subexposición grave en inducción. La pérdida de respuesta secundaria tiene más a menudo causa farmacocinética (anticuerpos, aclaramiento), corregible con optimización.",
TR13:"Un biosimilar tiene la misma secuencia de aminoácidos y diferencias menores de glicosilación dentro de rangos aceptados; se demuestra equivalencia farmacocinética y clínica. Por eso el cambio no requiere reinducción. La inmunogenicidad es comparable y los anticuerpos contra el originador reconocen al biosimilar.",
TR14:"Las tiopurinas son mutagénicas (6-TGN en el ADN sensibiliza a UV-A) y reducen la vigilancia inmune de EBV; el linfoma hepatoesplénico de células T γδ se asocia a exposición prolongada, sobre todo combinada con anti-TNF en varones jóvenes. El anti-TNF reduce la inmunovigilancia antitumoral de melanocitos.",
TR17:"La pancreatitis por tiopurinas es una reacción de hipersensibilidad idiosincrásica, no mediada por metabolitos ni dosis; por eso aparece temprano y recurre con cualquier tiopurina. El tabaquismo y la EC aumentan el riesgo.",
TR18:"La restricción de los JAK deriva de ORAL Surveillance (tofacitinib en artritis reumatoide ≥50 años con factor de riesgo CV): más MACE, neoplasias y trombosis vs anti-TNF. Los datos en EII (población más joven, exposición distinta) no replican la magnitud, lo que permitió a la FDA flexibilizar la secuencia sin retirar las advertencias.",
TR21:"La inflamación activa aumenta factores procoagulantes (fibrinógeno, factor VIII), plaquetas y disfunción endotelial; se suman inmovilización, corticoides, catéteres y cirugía. El sangrado mucoso de la CU rara vez aumenta de forma relevante con dosis profilácticas de HBPM.",
TR22:"La LRS garantiza protección financiera para tratamientos de alto costo con protocolos definidos; su canasta de EII se diseñó sobre anti-TNF. Las terapias posteriores, aunque con recomendación GRADE fuerte en ACTECCU 2026, no han sido incorporadas, lo que condiciona la secuencia real en el sistema público.",
TR23:"TL1A (TNFSF15) se une a DR3 en linfocitos y fibroblastos, activando inflamación Th1/Th17 y activación fibroblástica: por eso se postula efecto antiinflamatorio y antifibrótico. Obefazimod aumenta miR-124 en células inmunes, que frena la traducción de mediadores inflamatorios (vía STAT3, IL-6) sin inmunosupresión clásica.",
TR26:"La integrina α4β7 se une a MAdCAM-1, adresina expresada casi exclusivamente en vénulas del intestino y del tejido linfoide asociado; α4β1 (VLA-4) se une a VCAM-1, expresado también en el endotelio del SNC. Bloquear solo α4β7 preserva la vigilancia inmune cerebral.",
TR27:"HLA-DQA1*05 presentaría péptidos derivados del anticuerpo terapéutico a linfocitos T CD4 cooperadores, facilitando la maduración de linfocitos B productores de anticuerpos anti-fármaco. El inmunomodulador concomitante reduce esa activación.",
TR28:"El trayecto fistuloso tiene alta carga de TNF tisular y mala perfusión; se necesita mayor concentración sérica para lograr exposición suficiente en el tejido perianal. De ahí que los umbrales luminales sean insuficientes para cerrar fístulas.",
TR29:"La inhibición de la vía JAK/STAT (especialmente IL-6) reduce la actividad de la lipasa y modifica el catabolismo de lipoproteínas; el mismo fenómeno ocurre con tocilizumab (anti-IL-6). El aumento de LDL no parece traducir un riesgo aterogénico equivalente en EII, pero se trata según riesgo CV global."
};

{id:"CU46",md:"E",b:"CU",t:"Anatomía patológica",n:"R",
