{id:"CU55",md:"X",b:"CU",t:"CU aguda grave",n:"F",
q:"Hombre de 36 años con CU extensa, en azatioprina a dosis plena hace 1 año (con 6-TGN terapéutico), ingresa con CUAG. Día 3 de corticoide IV: Oxford positivo. ¿Mejor rescate?",
o:["Ciclosporina IV con puente a azatioprina","Infliximab (± continuar tiopurina), con TDM precoz si la albúmina es baja","Aumentar azatioprina","Tacrolimus oral de mantención indefinida"],
c:1,
e:"Si ya hubo <b>falla a tiopurina</b>, la ciclosporina pierde su puente natural (la mantención tras ciclosporina clásica es con tiopurina). Infliximab ofrece inducción y mantención con el mismo fármaco. Alternativas: JAK (off-label) o ciclosporina con puente a vedolizumab en centros con experiencia.",
w:{0:"Puente a un fármaco que ya falló.",2:"Sin rol en CUAG.",3:"No es estrategia de mantención estándar."},
p:"El rescate se elige pensando en la mantención.",
r:"ECCO UC Medical 2026 rec. 45 · ACG UC 2025"},

{id:"CU56",md:"X",b:"CU",t:"CU aguda grave",n:"F",
q:"Paciente con CUAG en día 2 de metilprednisolona desarrolla distensión, FC 125 lpm, T° 38,9 °C; radiografía: colon transverso de 7 cm. Potasio 2,9 mEq/L. Recibía loperamida indicada en urgencias. ¿Conducta?",
o:["Megacolon tóxico: suspender loperamida, corregir potasio/magnesio, antibióticos de amplio espectro, reposo digestivo, corticoides IV y evaluación quirúrgica inmediata; sin mejoría en 24–72 h o deterioro → colectomía","Colonoscopía completa para evaluar extensión","Agregar neostigmina y observar","Iniciar vedolizumab"],
c:0,
e:"Criterios de megacolon tóxico. Suspender precipitantes (antidiarreicos, opioides, anticolinérgicos), corregir electrolitos, antibióticos, descompresión (cambios de posición, sonda), cirugía avisada. Perforación, deterioro o falta de mejoría → colectomía subtotal urgente. Colonoscopía contraindicada.",
w:{1:"Riesgo de perforación.",2:"No es manejo estándar en colitis tóxica.",3:"Inicio lento; no tiene rol."},
p:"Descartar <i>C. difficile</i> y CMV como precipitantes.",
r:"ACG UC 2025 · AGA CPU Inpatient 2026"},

{id:"CU57",md:"X",b:"CU",t:"CU aguda grave",n:"S",
q:"Mujer de 27 años, segundo episodio de CUAG en 8 meses pese a infliximab 10 mg/kg c/6 sem (nivel valle 12 µg/mL, sin anticuerpos) tras rescate previo. Día 3 de corticoide IV sin respuesta. ¿Conducta más razonable?",
o:["Ciclosporina IV como rescate","Colectomía (subtotal con ileostomía) tras discusión, o en centro experto considerar JAK como tercera línea seleccionada","Duplicar infliximab a 20 mg/kg","Alta con prednisona oral"],
c:1,
e:"Es una falla farmacodinámica a infliximab con nivel adecuado y CUAG recurrente corticorrefractaria: el escenario de <b>tercera línea</b> (ECCO rec. 47) solo en pacientes muy seleccionados y centro experto; la colectomía es una opción definitiva y legítima, con reconstrucción diferida en buenas condiciones.",
w:{0:"Sin puente de mantención razonable y alta probabilidad de falla.",2:"Exposición ya adecuada.",3:"No responde a corticoide IV."},
p:"Discutir fertilidad femenina con IPAA y opciones (dos tiempos modificado, ileorrectal en casos seleccionados).",
r:"ECCO UC Medical 2026 rec. 47 · ECCO UC Surgical 2026"},

{id:"CU58",md:"X",b:"CU",t:"CU leve–moderada",n:"R",
q:"CU izquierda en remisión con mesalazina. Tras dejar de fumar hace 2 meses presenta brote moderado. ¿Conducta?",
o:["Recomendar volver a fumar","Tratar el brote (optimizar 5-ASA oral + tópico, corticoide si no responde); mantener la cesación tabáquica","Parches de nicotina como tratamiento de primera línea","Colectomía"],
c:1,
e:"El tabaco es 'protector' en CU y su cese puede precipitar brotes, pero <b>nunca se recomienda fumar</b> (riesgo CV y oncológico). La nicotina transdérmica tuvo eficacia modesta con mala tolerancia; no es estándar. Tratar el brote según gravedad.",
w:{0:"Inaceptable por riesgo global.",2:"No es primera línea.",3:"Desproporcionado."},
p:"En EC el tabaco empeora el curso: la cesación es de las intervenciones más eficaces.",
r:"ACG UC 2025 · Guía Estudio EII 2026 §19"},

{id:"CU59",md:"X",b:"CU",t:"CU leve–moderada",n:"R",
q:"Paciente con CU en remisión consulta por brote tras 10 días de ibuprofeno por lumbago. ¿Conducta?",
o:["Suspender AINE, descartar infección (incluida <i>C. difficile</i>), optimizar tratamiento del brote; para analgesia preferir paracetamol","Continuar ibuprofeno y agregar prednisona","Cambiar a celecoxib dosis alta indefinida","Escalar de inmediato a JAK"],
c:0,
e:"Los AINE no selectivos se asocian a brotes (alteración de prostaglandinas mucosas protectoras). Evitar su uso regular; un inhibidor COX-2 por corto plazo parece de menor riesgo si es imprescindible. Descartar infección siempre ante un brote.",
w:{1:"Perpetúa el gatillante.",2:"Uso crónico no recomendado.",3:"Prematuro sin optimizar."},
p:"Brote: siempre coprocultivo y toxina de <i>C. difficile</i>.",
r:"ACG UC 2025"},

{id:"CU60",md:"X",b:"CU",t:"Posicionamiento terapéutico",n:"F",
q:"Mujer de 30 años con CU corticodependiente, desea embarazo en 12 meses. Naïve a terapia avanzada. ¿Mejor elección?",
o:["Tofacitinib","Ozanimod","Vedolizumab o anti-TNF (infliximab/adalimumab/golimumab), lograr remisión objetiva antes de concebir y continuar durante el embarazo","Metotrexato"],
c:2,
e:"Planificación: elegir un fármaco compatible con embarazo y lactancia, alcanzar <b>remisión objetiva ≥3–6 meses antes de concebir</b> y mantenerlo. Anti-TNF (más datos) o vedolizumab (datos tranquilizadores); ustekinumab también es opción. JAK, S1P y metotrexato están contraindicados.",
w:{0:"Contraindicado en embarazo.",1:"Contraindicado; lavado prolongado.",3:"Teratógeno y sin eficacia en CU."},
p:"En Chile, anti-TNF por LRS; vedolizumab según cobertura.",
r:"ECCO Pregnancy 2023 · Global Consensus 2019"},

{id:"CU61",md:"X",b:"CU",t:"Anti-integrina",n:"F",
q:"CU en vedolizumab desde hace 16 semanas (con dosis adicional en semana 10): sin respuesta clínica, calprotectina 1.400 µg/g, MES 3. ¿Conducta?",
o:["Esperar hasta la semana 30","Falla primaria a vedolizumab: cambiar de mecanismo (anti-TNF, JAK, anti-IL-23, ustekinumab o S1P según perfil)","Agregar azatioprina","Pasar a vedolizumab SC"],
c:1,
e:"Tras inducción completa, dosis extra y tiempo suficiente (≥14 semanas) sin respuesta objetiva = <b>falla primaria</b>; la vía α4β7 no es la dominante o la actividad supera su capacidad. Cambiar de mecanismo. Valorar gravedad: si es moderada-grave, preferir un agente rápido (anti-TNF o JAK).",
w:{0:"Prolonga inflamación sin beneficio esperable.",2:"No rescata una falla primaria.",3:"Mismo fármaco."},
p:"El TDM de vedolizumab tiene correlación exposición-respuesta más débil; no se usa para rescatar falla primaria tardía.",
r:"Guía Simposio PANCCO–ACTECCU 2026 §8 · ECCO UC Medical 2026"},

{id:"CU62",md:"X",b:"CU",t:"Moduladores S1P",n:"F",
q:"Hombre de 45 años con CU moderada, prefiere terapia oral. ECG: bloqueo AV de segundo grado Mobitz II no tratado. ¿Qué evitar?",
o:["Upadacitinib","Moduladores S1P (ozanimod/etrasimod)","Vedolizumab","Ustekinumab"],
c:1,
e:"S1P: contraindicados en bloqueo AV de 2.º grado Mobitz II o 3.er grado sin marcapasos, infarto/ACV/IC descompensada reciente. No contraindicados en bloqueo de 1.er grado, portadores de marcapasos o cardiopatía estable. Alternativa oral: JAK si no hay restricciones.",
w:{0:"Posible si no hay factores de riesgo CV/trombótico mayores.",2:"Opción segura.",3:"Opción segura."},
p:"Evaluación cardiológica y eventual marcapasos antes de reconsiderar S1P.",
r:"Ficha técnica ozanimod/etrasimod · Guía Simposio PANCCO–ACTECCU 2026 §6"},

{id:"CU63",md:"X",b:"CU",t:"Moduladores S1P",n:"F",
q:"Mujer de 58 años, diabética, con CU moderada, iniciará ozanimod. ¿Qué evaluación adicional es necesaria?",
o:["Fondo de ojo/tomografía de coherencia óptica basal y durante el tratamiento por riesgo de edema macular","Ecocardiograma de esfuerzo","Biopsia hepática","Espirometría obligatoria en todos"],
c:0,
e:"Edema macular: raro, mayor en diabetes y uveítis previa → evaluación oftalmológica basal y ante síntomas visuales. Además ECG basal, hemograma, pruebas hepáticas, serología VZV. Función pulmonar si hay enfermedad respiratoria (reducción de VEF1/DLCO descrita).",
w:{1:"No requerido de rutina.",2:"No indicado.",3:"Solo con enfermedad respiratoria."},
p:"El edema macular por S1P suele ser reversible al suspender.",
r:"Guía Simposio PANCCO–ACTECCU 2026 §6 · Sandborn WJ et al. NEJM 2021 (TRUE NORTH)"},

{id:"CU64",md:"X",b:"CU",t:"Displasia y CCR",n:"S",
q:"En la vigilancia de CU extensa, biopsias aleatorias muestran displasia de bajo grado en un fragmento; la cromoendoscopía no mostró lesión. ¿Siguiente paso?",
o:["Proctocolectomía inmediata","Confirmación por patólogo experto y nueva cromoendoscopía de alta definición por endoscopista experto (idealmente en 3–6 meses) para buscar lesión visible","Control en 5 años","Aumentar mesalazina y no repetir"],
c:1,
e:"Displasia <b>invisible</b>: confirmar con segundo patólogo experto y repetir evaluación con cromoendoscopía (virtual o colorante) de alta definición por experto. Si se encuentra lesión resecable → resección y vigilancia. Displasia invisible de bajo grado unifocal confirmada: vigilancia intensiva vs colectomía, decisión compartida. Invisible de alto grado o multifocal → colectomía.",
w:{0:"Prematuro sin confirmación y búsqueda de lesión.",2:"Riesgo inaceptable.",3:"No aborda el hallazgo."},
p:"Hasta 80–90% de la displasia es visible con técnica adecuada.",
r:"SCENIC 2015 · Murthy SK et al. AGA CPU 2021"},

{id:"CU65",md:"X",b:"CU",t:"Cirugía",n:"F",
q:"Paciente con CU operada con colectomía subtotal e ileostomía hace 1 año, con muñón rectal. Consulta por rectorragia y tenesmo. ¿Diagnóstico y manejo?",
o:["Proctitis del muñón (diversion/CU activa): 5-ASA o corticoide tópico; vigilancia endoscópica del muñón (riesgo de displasia) y plan de proctectomía o reconstrucción","Hemorroides; ligadura","Normal postoperatorio","Reiniciar infliximab IV"],
c:0,
e:"El muñón rectal mantiene la CU y puede sumar colitis por derivación. Tratamiento tópico; vigilancia endoscópica si se deja in situ (ECCO quirúrgica 2026, enunciado 4) por riesgo de cáncer; planificar proctectomía de completación con o sin reservorio.",
w:{1:"Otra causa; no la más probable.",2:"No es esperable.",3:"No es primera línea."},
p:"Evitar muñones rectales cortos bajo la reflexión peritoneal (enunciado 3).",
r:"ECCO UC Surgical 2026 enunciados 3–4"},

{id:"CU66",md:"X",b:"CU",t:"Infecciones en CU",n:"F",
q:"CU moderada con respuesta parcial a prednisona. Biopsias: CMV por inmunohistoquímica con 1 inclusión aislada. Clínicamente mejora al día 5. ¿Conducta?",
o:["Ganciclovir IV 14–21 días","No tratar el CMV: carga baja y buena evolución; continuar tratamiento de la CU y vigilar","Suspender corticoides","Colectomía"],
c:1,
e:"Con carga histológica baja y respuesta clínica, el CMV suele ser espectador. El antiviral se reserva para carga alta (≥5 inclusiones o PCR tisular alta) con colitis corticorrefractaria.",
w:{0:"Sobretratamiento con toxicidad medular.",2:"Innecesario.",3:"Desproporcionado."},
p:"Reevaluar si hay refractariedad posterior.",
r:"ECCO Infections 2026"},

{id:"CU67",md:"X",b:"CU",t:"Poblaciones especiales",n:"S",
q:"Hombre de 70 años con CU extensa en remisión profunda hace 3 años con infliximab + azatioprina. Tuvo un carcinoma espinocelular cutáneo. ¿Conducta?",
o:["Continuar combinación","Suspender la azatioprina manteniendo infliximab (idealmente con TDM para asegurar niveles); control dermatológico estricto","Suspender ambos","Cambiar a tofacitinib"],
c:1,
e:"Edad >65 y cáncer cutáneo no melanoma → retirar la tiopurina. Mantener infliximab en monoterapia con TDM (la retirada de la tiopurina es la desescalada de menor riesgo: SPARE). Fotoprotección y control dermatológico.",
w:{0:"Mantiene un riesgo evitable.",2:"Mayor riesgo de recaída.",3:"JAK con reparos por edad y cáncer cutáneo."},
p:"Alternativa si recae: vedolizumab o anti-IL-23.",
r:"ACTECCU 2026 · Louis E et al. Lancet Gastroenterol Hepatol 2023 (SPARE)"},

{id:"CU68",md:"X",b:"CU",t:"Anti-TNF",n:"F",
q:"CU en infliximab 5 mg/kg c/8 sem con pérdida de respuesta. Nivel valle 2,1 µg/mL, anticuerpos anti-infliximab en título bajo (drug-tolerant). ¿Conducta?",
o:["Cambiar de clase de inmediato","Intensificar infliximab (10 mg/kg o intervalo c/6 sem) + agregar inmunomodulador y remedir en 4–8 semanas","Suspender e iniciar corticoides crónicos","Cambiar a golimumab sin inmunomodulador"],
c:1,
e:"Nivel bajo + anticuerpos en <b>título bajo o transitorio</b>: la intensificación junto con un inmunomodulador puede suprimir los anticuerpos y recuperar niveles. Si los anticuerpos persisten altos → cambio intraclase con inmunomodulador o cambio de mecanismo.",
w:{0:"Prematuro.",2:"Los corticoides no son estrategia.",3:"Sin inmunomodulador, la inmunogenicidad puede repetirse."},
p:"Remedir anticuerpos: si desaparecen, se puede volver a espaciar.",
r:"Guía Simposio PANCCO–ACTECCU 2026 §9"},

{id:"CU69",md:"X",b:"CU",t:"Anti-IL-23",n:"S",
q:"CU con falla a infliximab (inmunogénica) y a vedolizumab (primaria). Hombre de 69 años, ex fumador, con cardiopatía isquémica estable. ¿Mejor opción?",
o:["Upadacitinib 45 mg","Anti-IL-23 p19 (mirikizumab, guselkumab o risankizumab) o ustekinumab","Tofacitinib 10 mg c/12 h","Ozanimod"],
c:1,
e:"Edad, tabaquismo pasado y cardiopatía restringen JAK (solo si no hay alternativa) y hacen poco deseable S1P. Anti-IL-23/ustekinumab: eficaces en bioexpuestos, sin señal CV. Evaluar también la opción quirúrgica si falla.",
w:{0:"Restricción regulatoria.",2:"Idem.",3:"Cardiopatía isquémica: precaución S1P."},
p:"En CU bioexpuesta, los anti-IL-23 rinden algo menos que en naïve; la persistencia es buena.",
r:"ECCO UC Medical 2026 rec. 25–32 · FDA/EMA JAK safety"},

{id:"CU70",md:"X",b:"CU",t:"Reservorio",n:"S",
q:"Paciente con IPAA por CU hace 6 años, con reservoritis dependiente de antibióticos (3 episodios/año). Pouchoscopía: úlceras en el reservorio y en el íleon pre-reservorio largo, fístula perianal nueva. ¿Qué sospechas?",
o:["Cuffitis","Enfermedad tipo Crohn del reservorio: estudiar (RM pélvica, entero-RM, histología) y tratar como EC con terapia avanzada (anti-TNF de preferencia)","Reservoritis aguda simple","Síndrome de reservorio irritable"],
c:1,
e:"Inflamación del asa aferente/pre-reservorio extensa, fístulas o estenosis tardías (>6–12 meses) sugieren <b>Crohn del reservorio</b>. Manejo como EC: anti-TNF (mejor evidencia), ustekinumab/vedolizumab; riesgo de fracaso del reservorio.",
w:{0:"Cuffitis es del manguito rectal.",2:"No explica fístula ni afectación pre-reservorio.",3:"Diagnóstico de exclusión sin inflamación."},
p:"Descartar causas secundarias: AINE, isquemia, infección.",
r:"Guía Simposio PANCCO–ACTECCU 2026 §14"},

{id:"EC50",md:"X",b:"EC",t:"Complicaciones",n:"R",
q:"EC ileal con absceso intraabdominal de 1,8 cm sin gas, paciente estable. ¿Manejo inicial?",
o:["Antibióticos EV (cobertura de gramnegativos y anaerobios) sin drenaje, con control imagenológico; retomar terapia tras resolución","Laparotomía urgente","Drenaje percutáneo obligatorio","Infliximab inmediato"],
c:0,
e:"Abscesos pequeños (<2–3 cm) suelen responder a antibióticos solos; mayores → drenaje percutáneo. La cirugía se reserva para peritonitis, sepsis no controlada o falla. Tras controlar la fuente, reanudar/iniciar terapia avanzada y discutir resección diferida.",
w:{1:"Sin indicación de urgencia.",2:"No es necesario en abscesos pequeños.",3:"Inmunosuprimir sin control infeccioso es riesgoso."},
p:"Nutrición enteral exclusiva y optimización prequirúrgica mejoran desenlaces.",
r:"ACG CD 2025 · Guía Estudio EII 2026 §13.3"},

{id:"EC51",md:"X",b:"EC",t:"Estrategia y pronóstico",n:"S",
q:"Mujer de 28 años con EC ileocecal limitada (25 cm), inflamatoria, sin estenosis crítica, con falla a corticoides. Rechaza terapia biológica prolongada. ¿Qué evidencia apoya discutir resección ileocecal laparoscópica como alternativa?",
o:["LIR!C: resección laparoscópica fue comparable a infliximab en calidad de vida a 1 año, con menos necesidad de terapia posterior en seguimiento a largo plazo","SONIC","CALM","Ninguna; la cirugía solo es para complicaciones"],
c:0,
e:"<b>LIR!C</b>: en EC ileocecal limitada (<40 cm) no estenosante tras falla convencional, la resección laparoscópica fue comparable a infliximab en calidad de vida a 12 meses; en seguimiento a largo plazo, ~la mitad de los operados no necesitó tratamiento de EC y un tercio del grupo infliximab terminó operado. Es una opción válida en decisión compartida.",
w:{1:"Terapia combinada.",2:"Tight control.",3:"La cirugía precoz tiene evidencia en este nicho."},
p:"Tras la resección: estratificar riesgo de recurrencia y colonoscopía a 6–12 meses.",
r:"Ponsioen CY et al. Lancet Gastroenterol Hepatol 2017 (LIR!C) · Stevens TW et al. 2020"},

{id:"EC52",md:"X",b:"EC",t:"Complicaciones",n:"F",
q:"EC con estenosis ileal de 15 cm con dilatación preestenótica de 4 cm, cuadros suboclusivos repetidos y RM con predominio fibrótico, pese a anti-TNF optimizado. ¿Conducta?",
o:["Dilatación endoscópica","Cirugía (resección o estenoplastia según longitud/segmentos), optimizando nutrición y reduciendo corticoides","Intensificar a 20 mg/kg","Agregar vedolizumab"],
c:1,
e:"Estenosis larga (>5 cm), fibrótica, con dilatación preestenótica y obstrucciones → <b>cirugía</b>. La dilatación endoscópica es para estenosis cortas (<5 cm), rectas y sin fístula. Estenoplastia para estenosis cortas múltiples (preserva longitud).",
w:{0:"No indicada en estenosis larga.",2:"No revierte fibrosis.",3:"No revierte fibrosis."},
p:"Profilaxis de recurrencia postoperatoria: probable alto riesgo (falla anti-TNF).",
r:"ACG CD 2025 · Guía Simposio PANCCO–ACTECCU 2026 §22"},

{id:"EC53",md:"X",b:"EC",t:"Diagnóstico diferencial",n:"S",
q:"Hombre de 34 años, migrante desde zona de alta incidencia de TBC, con ileítis terminal y úlceras transversales, válvula ileocecal patulosa, IGRA positivo, biopsias con granulomas sin necrosis y PCR/cultivo para micobacterias negativos. Rx de tórax normal. ¿Conducta?",
o:["Iniciar anti-TNF de inmediato","Prueba terapéutica antituberculosa completa con reevaluación clínica y endoscópica a las 8–12 semanas antes de inmunosuprimir","Corticoides y reevaluar","Cirugía diagnóstica"],
c:1,
e:"Ante duda razonable EC vs TBC intestinal en paciente de riesgo, la conducta aceptada es <b>tratamiento antituberculoso</b> y reevaluar: la respuesta mucosa clara en 2–3 meses apoya TBC (completar esquema); la falta de respuesta orienta a EC. Inmunosuprimir una TBC no tratada puede ser fatal.",
w:{0:"Riesgo de TBC diseminada.",2:"Riesgoso si es TBC.",3:"No es primera opción."},
p:"TC: adenopatías necróticas favorecen TBC; signo del peine y compromiso segmentario largo favorecen EC.",
r:"Makharia GK et al. Am J Gastroenterol 2010 · Guía Estudio EII 2026 §3"},

{id:"EC54",md:"X",b:"EC",t:"Anti-TNF",n:"F",
q:"Durante la cuarta infusión de infliximab (tras una pausa de 6 meses), el paciente presenta hipotensión, broncoespasmo y urticaria. ¿Conducta?",
o:["Detener la infusión, manejo de anafilaxia; no reexponer a infliximab; cambiar a otra clase o a adalimumab con inmunomodulador según el caso","Reducir velocidad y continuar","Premedicar con antihistamínico y reintentar la próxima semana","Continuar a la misma velocidad"],
c:0,
e:"Reacción infusional <b>grave</b> (anafilactoide) tras reintroducción → no reexponer. Reacciones leves (prurito, rubor) se manejan con pausa, reducción de velocidad y premedicación. Estas reacciones se asocian a anticuerpos anti-infliximab.",
w:{1:"Riesgo vital en reacción grave.",2:"La premedicación no previene reacciones graves por anticuerpos.",3:"Contraindicado."},
p:"Medir anticuerpos anti-infliximab para documentar.",
r:"ACG CD 2025 · ECCO"},

{id:"EC55",md:"X",b:"EC",t:"Anti-TNF",n:"F",
q:"Mujer con EC en adalimumab hace 2 años presenta poliartralgias, pleuritis y anticuerpos anti-histona y anti-dsDNA positivos. ¿Diagnóstico y conducta?",
o:["Lupus inducido por anti-TNF: suspender adalimumab y cambiar a otro mecanismo (vedolizumab, ustekinumab/anti-IL-23)","Lupus eritematoso sistémico primario: agregar hidroxicloroquina y mantener","Manifestación extraintestinal de EC","Artritis psoriásica"],
c:0,
e:"El lupus inducido por anti-TNF suele resolver en semanas-meses tras suspender. Recaería probablemente con otro anti-TNF: cambiar de clase. Los ANA positivos aislados sin clínica no obligan a suspender.",
w:{1:"El cuadro es inducido por fármaco.",2:"El perfil serológico no es de MEI.",3:"No corresponde."},
p:"Lupus inducido: anti-histona + frecuentemente anti-dsDNA con anti-TNF; complemento generalmente normal, raro compromiso renal.",
r:"ECCO · Guía Simposio PANCCO–ACTECCU 2026 §5"},

{id:"EC56",md:"X",b:"EC",t:"Terapia convencional",n:"R",
q:"EC en metotrexato 15 mg SC semanal hace 5 meses consulta por tos seca, disnea progresiva y fiebre. Radiografía con infiltrados intersticiales. ¿Conducta?",
o:["Continuar y dar antibióticos","Suspender metotrexato de inmediato y evaluar neumonitis por metotrexato (descartar infección, incluido <i>P. jirovecii</i>); no reintroducir","Aumentar ácido fólico","Cambiar a metotrexato oral"],
c:1,
e:"La <b>neumonitis por metotrexato</b> es una reacción de hipersensibilidad rara pero grave; suspensión inmediata, estudio infeccioso, corticoides si se confirma, y no reexponer.",
w:{0:"Riesgo de progresión.",2:"No previene neumonitis.",3:"Mismo fármaco."},
p:"El ácido fólico reduce toxicidad GI/hepática/hematológica, no pulmonar.",
r:"Guía Simposio PANCCO–ACTECCU 2026 §4"},

{id:"EC57",md:"X",b:"EC",t:"Crohn perianal",n:"F",
q:"EC en remisión luminal con fístula perianal interesfinteriana baja, orificio único, sin absceso ni proctitis, sintomática. ¿Conducta?",
o:["Proctectomía","Evaluación coloproctológica: fistulotomía o setón en fístula simple sin proctitis, antibióticos; considerar terapia avanzada si persiste o recurre","Solo observación","Iniciar tacrolimus"],
c:1,
e:"Fístula <b>simple</b> sin proctitis: la fistulotomía es opción con bajo riesgo de incontinencia; antibióticos como adyuvante. Si es sintomática persistente o recurrente, o hay enfermedad luminal, terapia avanzada (anti-TNF).",
w:{0:"Desproporcionado.",2:"Sintomática: se trata.",3:"No es primera línea."},
p:"Proctitis activa contraindica fistulotomía y colgajos.",
r:"ACG CD 2025 · ECCO CD Surgical"},

{id:"EC58",md:"X",b:"EC",t:"Crohn perianal",n:"S",
q:"EC perianal compleja en infliximab 10 mg/kg c/6 sem con nivel 6 µg/mL, sin anticuerpos; drenaje persistente de 2 trayectos pese a setón. Proctitis leve. ¿Mejor paso?",
o:["Cambiar a vedolizumab","Optimizar infliximab para alcanzar niveles ≥10–20 µg/mL (acortar a c/4 sem) ± inmunomodulador; reevaluar con RM y examen bajo anestesia","Retirar el setón y observar","Colgajo de avance inmediato"],
c:1,
e:"En perianal, los niveles objetivo son más altos (≥10 µg/mL; series >20): con nivel 6 aún hay margen farmacocinético. Si no responde con niveles altos: upadacitinib o anti-IL-23/ustekinumab. La reparación quirúrgica exige recto sin inflamación.",
w:{0:"Débil en perianal.",2:"Riesgo de absceso con drenaje activo.",3:"Proctitis activa: alto riesgo de falla."},
p:"Clasificación de Geldof para definir objetivo (reparación vs control de síntomas).",
r:"Yarur AJ et al. APT 2017 · Guía Simposio PANCCO–ACTECCU 2026 §15"},

{id:"EC59",md:"X",b:"EC",t:"Recurrencia posquirúrgica",n:"F",
q:"Postoperatorio de resección ileocólica (alto riesgo) en profilaxis con azatioprina. Colonoscopía a los 6 meses: Rutgeerts i3. ¿Conducta?",
o:["Continuar azatioprina y repetir en 1 año","Escalar a anti-TNF (u otra terapia avanzada, p. ej. vedolizumab o ustekinumab) y reevaluar a los 6–12 meses","Mesalazina","Nueva cirugía"],
c:1,
e:"i3 = recurrencia significativa con tiopurina → escalar. Anti-TNF es la opción con mejor evidencia en prevención y tratamiento de recurrencia; vedolizumab (REPREVIO) y ustekinumab son alternativas.",
w:{0:"Recurrencia pese a profilaxis.",2:"Insuficiente.",3:"Sin indicación."},
p:"POCER: colonoscopía a los 6 meses con escalada según hallazgos.",
r:"De Cruz P et al. Lancet 2015 (POCER) · ACG CD 2025"},

{id:"EC60",md:"X",b:"EC",t:"Anti-TNF",n:"F",
q:"EC ileocolónica en adalimumab 40 mg c/2 sem. Paciente con IMC 38. Recaída con calprotectina 850 µg/g, nivel valle 3,2 µg/mL, sin anticuerpos. ¿Conducta?",
o:["Intensificar a 40 mg semanal (u 80 mg c/2 sem)","Cambiar a vedolizumab","Agregar prednisona crónica","Suspender adalimumab"],
c:0,
e:"Obesidad y alta carga inflamatoria aumentan el aclaramiento: <b>falla farmacocinética no inmune</b> → intensificar (recuperación 50–70%). Objetivo de mantención >5–7,5 µg/mL (más alto en perianal).",
w:{1:"Prematuro.",2:"No es estrategia.",3:"Pierde un fármaco útil."},
p:"La obesidad visceral se asocia a peor respuesta a biológicos de dosis fija.",
r:"Guía Simposio PANCCO–ACTECCU 2026 §9, §19"},

{id:"EC61",md:"X",b:"EC",t:"Manifestaciones extraintestinales",n:"F",
q:"EC colónica con hidradenitis supurativa axilar e inguinal moderada-grave. ¿Terapia que cubre ambas?",
o:["Adalimumab (aprobado en hidradenitis) o infliximab","Vedolizumab","Ozanimod","Mesalazina"],
c:0,
e:"La hidradenitis supurativa se asocia a EC; <b>adalimumab</b> está aprobado en hidradenitis (PIONEER) e infliximab tiene evidencia. Anti-IL-17 (secukinumab, bimekizumab) están aprobados en hidradenitis pero pueden empeorar la EII.",
w:{1:"No trata la hidradenitis.",2:"Sin indicación en EC.",3:"Sin eficacia en EC."},
p:"Evitar anti-IL-17 en pacientes con EII (riesgo de brotes o EII de novo).",
r:"Guía Simposio PANCCO–ACTECCU 2026 §7 · ECCO EIM"},

{id:"EC62",md:"X",b:"EC",t:"Clasificación",n:"R",
q:"Adolescente de 15 años con EC, talla bajo su carril genético y retraso puberal. ¿Qué debe priorizar el manejo?",
o:["Evitar corticoides repetidos y privilegiar nutrición enteral exclusiva o anti-TNF precoz para lograr remisión y recuperar crecimiento; clasificar con París","Ciclos de prednisona","Mesalazina","Esperar a la adultez"],
c:0,
e:"En EC pediátrica el crecimiento es un objetivo (STRIDE-II: crecimiento normal en niños). NEE como primera línea de inducción, anti-TNF precoz en alto riesgo, evitar corticoides repetidos. París registra G1 (retraso de crecimiento).",
w:{1:"Deterioran crecimiento.",2:"Sin eficacia en EC.",3:"Pierde la ventana de crecimiento."},
p:"Transición estructurada al llegar a la adultez: consulta conjunta y resumen terapéutico con niveles.",
r:"STRIDE-II 2021 · ECCO-ESPGHAN pediatric CD"},

{id:"EC63",md:"X",b:"EC",t:"Crohn alto",n:"S",
q:"EC con compromiso duodenal: estenosis bulbar corta con síntomas de vaciamiento gástrico lento; inflamación activa en biopsias. Ileocolon en remisión con ustekinumab. ¿Conducta?",
o:["Gastrectomía","IBP, optimizar/cambiar terapia avanzada para la actividad alta y dilatación endoscópica con balón de la estenosis corta; cirugía si falla","Solo IBP","Budesonida ileal"],
c:1,
e:"EC gastroduodenal (SUMM-CD 2026: proximal al Treitz): manejo individualizado. IBP como adyuvante, terapia sistémica eficaz (la actividad alta puede ser discordante con el íleon), dilatación endoscópica de estenosis cortas; cirugía (derivación/estenoplastia) si hay falla.",
w:{0:"Desproporcionado.",2:"Insuficiente con actividad inflamatoria.",3:"Libera en íleon; no actúa en duodeno."},
p:"Endoscopía alta solo ante sospecha (síntomas altos o anemia), no de rutina en adultos.",
r:"Cohen NA et al. Lancet Gastroenterol Hepatol 2026;11:243 (SUMM-CD)"},

{id:"EC64",md:"X",b:"EC",t:"Anti-integrina",n:"F",
q:"Mujer de 76 años con EC colónica en vedolizumab hace 7 meses: calprotectina 700 µg/g, SES-CD 12. Sin respuesta pese a intensificación c/4 sem. ¿Siguiente opción?",
o:["Upadacitinib 45 mg","Ustekinumab o anti-IL-23 p19 (risankizumab/guselkumab)","Azatioprina","Corticoides crónicos"],
c:1,
e:"En adulta mayor con falla a vedolizumab: anti-IL-23/ustekinumab por eficacia y perfil de seguridad. JAK restringidos por edad. Tiopurinas con mayor riesgo de linfoma y cáncer cutáneo en >65 años.",
w:{0:"Restricción por edad.",2:"Riesgo en adulto mayor y lenta.",3:"Deletéreos."},
p:"Valoración geriátrica integral antes de escalar.",
r:"GETECCU fragilidad 2025 · ACG CD 2025"},

{id:"CU71",md:"E",b:"CU",t:"CU aguda grave",n:"R",
q:"Índice de Lindgren (Seo) en CUAG:",
o:["Deposiciones/día + 0,14 × PCR (mg/L) al día 3; >8 predice falla corticoidea","Albúmina + PCR + UCEIS","Frecuencia × 2 + temperatura","Mayo endoscópico + Hb"],
c:0,
e:"Índice de Lindgren (Seo): <b>frecuencia + 0,14 × PCR</b> al día 3; >8 → alta probabilidad de colectomía. Es distinto de los criterios de Oxford y del índice ACE (albúmina, PCR, endoscopía al ingreso).",
w:{1:"Es el ACE.",2:"No existe.",3:"No existe."},
p:"Todas estas herramientas convergen en decidir el rescate al día 3.",
m:"Frecuencia deposicional y PCR integran carga inflamatoria mucosa y sistémica; la PCR, de vida media corta, refleja con rapidez la respuesta al corticoide.",
r:"Lindgren SC et al. Eur J Gastroenterol Hepatol 1998"},

{id:"EC65",md:"E",b:"EC",t:"Scores",n:"R",
q:"¿Cuál es el principal uso clínico del PDAI perianal (Irvine)?",
o:["Cuantificar síntomas e impacto de la enfermedad perianal (descarga, dolor, actividad sexual, tipo, induración; 0–20) como complemento de la RM","Medir actividad luminal","Clasificar la anatomía de la fístula","Predecir colectomía"],
c:0,
e:"PDAI perianal: 5 ítems (0–4 cada uno), 0–20; >4 sugiere actividad (descarga/inflamación). No reemplaza a la RM (MAGNIFI-CD) ni a Parks/AGA. Desenlace de ensayos: Fistula Drainage Assessment (cierre ≥50% = respuesta; cierre de todos ≥4 semanas = remisión).",
w:{1:"Otro índice.",2:"Eso es Parks.",3:"No aplica."},
p:"No confundir con el PDAI de reservoritis (Sandborn).",
m:"Los síntomas perianales dependen tanto de la inflamación del trayecto como de la anatomía; un índice clínico ayuda a seguir el impacto, pero la persistencia del trayecto solo se ve por imagen.",
r:"Irvine EJ. J Clin Gastroenterol 1995"},

{id:"EC66",md:"E",b:"EC",t:"Terapia combinada",n:"F",
q:"¿Qué variable fue la principal explicación del beneficio de la terapia combinada en SONIC?",
o:["Mayor nivel de infliximab y menor inmunogenicidad","Efecto antiinflamatorio aditivo de la azatioprina independiente de la farmacocinética","Menor tabaquismo","Mayor uso de corticoides"],
c:0,
e:"Análisis post hoc de SONIC: al estratificar por cuartiles de nivel de infliximab, la remisión fue similar con o sin azatioprina; el beneficio se explica sobre todo por <b>mejor farmacocinética</b> (niveles más altos, menos anticuerpos).",
w:{1:"No se sostuvo al ajustar por niveles.",2:"No es la explicación.",3:"No aplica."},
p:"Corolario: con TDM proactivo se puede lograr exposición adecuada sin tiopurina en algunos pacientes.",
m:"La tiopurina suprime la respuesta humoral contra el anticuerpo quimérico, prolonga su vida media y aumenta los niveles valle.",
r:"Colombel JF et al. Clin Gastroenterol Hepatol 2019 (SONIC post hoc)"},

{id:"EC67",md:"E",b:"EC",t:"Complicaciones",n:"R",
q:"Déficit nutricional característico tras resección ileal >60 cm en EC:",
o:["Vitamina B12 (absorción en íleon terminal con factor intrínseco)","Hierro exclusivamente","Vitamina C","Yodo"],
c:0,
e:"La B12 se absorbe en el íleon terminal: resecciones >60 cm o ileítis extensa → déficit (anemia megaloblástica, neuropatía). Controlar anualmente y suplementar IM o en altas dosis orales. También vitamina D, zinc, magnesio, folato.",
w:{1:"El hierro se absorbe en duodeno.",2:"No es característico.",3:"No es característico."},
p:"Hiperoxaluria y diarrea por ácidos biliares son otras consecuencias de la resección ileal.",
m:"El complejo B12-factor intrínseco se une al receptor cubilina-amnionless exclusivo del íleon distal.",
r:"ACG Preventive Care 2025"}
];

{id:"TR57",md:"X",b:"TR",t:"Embarazo",n:"F",
q:"Paciente con EC en metotrexato 20 mg SC semanal descubre embarazo de 6 semanas no planificado. ¿Conducta?",
o:["Continuar metotrexato hasta el segundo trimestre","Suspender metotrexato de inmediato, ácido fólico en dosis altas, derivar a obstetricia/medicina materno-fetal para consejería y ecografía detallada; iniciar alternativa compatible para la EC","Indicar interrupción obligatoria","Cambiar a tofacitinib"],
c:1,
e:"Exposición en el primer trimestre: suspender, folato, evaluación de riesgo (embriopatía por metotrexato) con especialista; la decisión sobre continuar el embarazo es de la paciente con información adecuada. Mantener la EC controlada con un fármaco compatible (p. ej. anti-TNF); no iniciar tiopurina de novo en el embarazo por su latencia.",
w:{0:"Teratógeno.",2:"No es obligatoria; es una decisión informada.",3:"Contraindicado en embarazo."},

{id:"TR58",md:"X",b:"TR",t:"Embarazo",n:"F",
q:"Mujer con CU en remisión con upadacitinib 15 mg quiere embarazarse en 6 meses. ¿Plan?",
o:["Continuar upadacitinib durante el embarazo","Cambiar a un fármaco compatible (vedolizumab, anti-TNF o ustekinumab), confirmar remisión objetiva con el nuevo fármaco y luego suspender anticoncepción (lavado de upadacitinib ≥4 semanas)","Suspender todo y buscar embarazo","Cambiar a ozanimod"],

r:"ECCO Pregnancy 2023 · Ficha técnica upadacitinib"},

{id:"TR59",md:"X",b:"TR",t:"Embarazo",n:"R",
q:"Recién nacido de madre con EC tratada con certolizumab pegol durante todo el embarazo. ¿Vacunas vivas del lactante (BCG, rotavirus)?",
o:["Pueden administrarse según calendario habitual: la transferencia placentaria de certolizumab es mínima","Diferir 12 meses","Contraindicadas de por vida","Solo tras medir niveles en el lactante siempre"],
c:0,
e:"Certolizumab carece de Fc: niveles en el recién nacido mínimos o indetectables → no es necesario diferir vacunas vivas (Consenso Global). Para anti-TNF IgG1 (infliximab, adalimumab, golimumab), vedolizumab y ustekinumab con exposición en el tercer trimestre: diferir vivas 6 meses (o hasta niveles indetectables).",
w:{1:"Innecesario.",2:"Incorrecto.",3:"No es requisito con certolizumab."},
p:"En Chile coordinar con pediatría la BCG neonatal según el biológico materno.",
r:"Mahadevan U et al. Global Consensus 2019"},

{id:"TR60",md:"X",b:"TR",t:"Embarazo",n:"S",
q:"Embarazada de 14 semanas con EC ileocolónica: brote moderado-grave (dolor, 8 deposiciones, PCR 60 mg/L, IUS con pared de 7 mm e hiperemia). Naïve a biológicos, en azatioprina desde hace 2 años. ¿Conducta?",
o:["Esperar al segundo trimestre","Tratar el brote: corticoide sistémico y/o iniciar anti-TNF (infliximab o adalimumab), manteniendo la azatioprina ya en uso; monitorizar con IUS y calprotectina","Metotrexato","Upadacitinib por rapidez"],
c:1,
e:"La actividad es el mayor riesgo obstétrico. Corticoides (vigilar diabetes gestacional) y/o anti-TNF (datos más amplios). La tiopurina ya iniciada puede continuarse (no iniciarla de novo). Excluir absceso con IUS/RM sin gadolinio si hay dolor focal.",
w:{0:"La enfermedad activa daña al embarazo.",2:"Contraindicado.",3:"Contraindicado."},
p:"Programar la última dosis de anti-TNF considerando el parto y plan de vacunas del lactante.",
r:"Global Consensus 2019 · ECCO Pregnancy 2023"},

{id:"TR61",md:"X",b:"TR",t:"Vacunas",n:"R",
q:"Paciente con EC en azatioprina planea viajar a zona endémica de fiebre amarilla en 3 semanas. ¿Recomendación?",
o:["Vacunar igualmente","La vacuna es viva y está contraindicada bajo tiopurinas: desaconsejar el viaje o emitir certificado de exención con medidas de protección; vacunar solo si puede suspenderse la inmunosupresión ≥3 meses antes","Vacunar con media dosis","Suspender azatioprina 1 semana antes y vacunar"],
c:1,
e:"Fiebre amarilla: vacuna viva, contraindicada con tiopurinas, metotrexato >0,4 mg/kg/sem, corticoides ≥20 mg >2 semanas, biológicos y JAK. Opciones: exención, posponer viaje, medidas antivectoriales. Planificar vacunas del viajero antes de iniciar inmunosupresión.",
w:{0:"Riesgo de enfermedad viscerotrópica vacunal.",2:"No existe esa estrategia validada.",3:"Intervalo insuficiente."},
p:"Registrar el estado vacunal al diagnóstico, antes de inmunosuprimir.",
r:"ACG Preventive Care 2025 · ECCO Infections 2026"},

{id:"TR62",md:"X",b:"TR",t:"Tamizaje e infecciones",n:"S",
q:"Paciente con EC con VIH en tratamiento antirretroviral, carga viral indetectable y CD4 480/µL, requiere terapia avanzada. ¿Conducta?",
o:["Contraindicación absoluta de biológicos","Puede recibir terapia avanzada con ART eficaz y seguimiento conjunto con infectología; preferir mecanismos de menor riesgo infeccioso (vedolizumab, anti-IL-23/ustekinumab) si el fenotipo lo permite, con profilaxis según CD4","Suspender la terapia antirretroviral","Solo corticoides"],
c:1,
e:"Con VIH controlado, las terapias avanzadas han mostrado seguridad aceptable en series; se decide con infectología, considerando interacciones y profilaxis (<i>P. jirovecii</i> si CD4 <200). La elección depende del fenotipo (p. ej. perianal compleja → anti-TNF).",
w:{0:"No es contraindicación absoluta.",2:"Inaceptable.",3:"No es tratamiento de mantención."},
p:"Tamizaje de VIH en todo paciente antes de inmunosuprimir.",
r:"ECCO Infections 2026"},

{id:"TR63",md:"X",b:"TR",t:"Tamizaje e infecciones",n:"F",
q:"Paciente con CU y hepatitis C crónica (ARN positivo, sin cirrosis) candidato a terapia avanzada. ¿Conducta?",
o:["Contraindica toda terapia avanzada","Tratar el VHC con antivirales de acción directa (curación >95%), idealmente antes o en paralelo; el VHC no contraindica anti-TNF","Solo interferón","Ignorar"],
c:1,
e:"A diferencia del VHB, el VHC no se reactiva de forma grave con anti-TNF; aun así debe tratarse con antivirales de acción directa por su propio beneficio. Revisar interacciones farmacológicas.",
w:{0:"No contraindica.",2:"El interferón puede empeorar la EII y está obsoleto.",3:"Debe tratarse."},
p:"Tamizaje pre-biológico: VHB (HBsAg, anti-HBc, anti-HBs), VHC, VIH.",
r:"ECCO Infections 2026"},

{id:"TR64",md:"X",b:"TR",t:"Anti-TNF: seguridad",n:"S",
q:"Hombre de 38 años con EC en infliximab presenta neuritis óptica y lesiones desmielinizantes en RM cerebral. ¿Conducta?",
o:["Continuar infliximab y agregar corticoides","Suspender definitivamente anti-TNF, derivar a neurología y cambiar a un mecanismo sin señal desmielinizante (vedolizumab, anti-IL-23/ustekinumab; natalizumab si se diagnostica EM)","Cambiar a adalimumab","Reducir la dosis de infliximab"],
c:1,
e:"Desmielinización con anti-TNF → suspender la clase. Alternativas según fenotipo. Natalizumab trata EM y EC (con riesgo de LMP según anticuerpos anti-JC). No reexponer a anti-TNF.",
w:{0:"Puede progresar.",2:"Efecto de clase.",3:"No resuelve."},
p:"Antes de anti-TNF preguntar por síntomas neurológicos y antecedentes familiares de EM.",
r:"Guía Simposio PANCCO–ACTECCU 2026 §7 · ACG CD 2025"},

{id:"TR65",md:"X",b:"TR",t:"Monitorización (TDM)",n:"S",
q:"EC en remisión profunda (SES-CD 0, calprotectina 40) con infliximab 10 mg/kg c/4 sem tras una pérdida de respuesta antigua. Nivel valle 28 µg/mL. ¿Conducta?",
o:["Mantener sin cambios","Desescalar de forma guiada por niveles (p. ej. alargar a c/6–8 sem o bajar dosis) con objetivo de mantención ≥5–10 µg/mL y control de calprotectina/nivel","Suspender infliximab","Agregar azatioprina"],
c:1,
e:"Niveles muy supraterapéuticos en remisión profunda permiten desescalar con TDM (menor costo, menor exposición), vigilando recaída. La desescalada no guiada tiene más riesgo; el TDM antes y después de desescalar es uno de los momentos de mayor valor.",
w:{0:"Sobreexposición y costo innecesarios.",2:"Mayor riesgo de recaída.",3:"Sin fundamento."},
p:"En perianal, mantener objetivos más altos.",
r:"Guía Simposio PANCCO–ACTECCU 2026 §9"},

{id:"TR66",md:"X",b:"TR",t:"Monitorización (TDM)",n:"F",
q:"CU en adalimumab con síntomas persistentes: calprotectina 45 µg/g, PCR normal, colonoscopía MES 0. Nivel valle 9 µg/mL. ¿Conducta?",
o:["Cambiar de clase","Intensificar","No hay falla terapéutica: buscar causas no inflamatorias (intestino irritable superpuesto, malabsorción de ácidos biliares, sobrecrecimiento, intolerancias, fármacos) y no escalar","Agregar corticoides"],
c:2,
e:"<b>Sin inflamación demostrada no hay falla terapéutica.</b> Hasta un tercio de pacientes en remisión tiene síntomas funcionales. Escalar sería sobretratamiento.",
w:{0:"No hay falla.",1:"No hay falla.",3:"No hay inflamación."},
p:"Neuromoduladores y manejo de intestino irritable son útiles; evitar opioides.",
r:"Guía Simposio PANCCO–ACTECCU 2026 §8"},

{id:"TR67",md:"X",b:"TR",t:"Inhibidores JAK",n:"F",
q:"CU en tofacitinib 10 mg c/12 h. Control a 8 semanas: LDL de 110 a 160 mg/dL, remisión clínica. Sin otros factores de riesgo CV, 35 años. ¿Conducta?",
o:["Suspender tofacitinib","Continuar (bajar a 5 mg c/12 h en mantención si está en remisión) y manejar los lípidos según riesgo CV global (estatina si corresponde)","Cambiar a upadacitinib","Agregar fibratos a todos"],
c:1,
e:"Elevación de lípidos esperada con JAK: se maneja como en población general según riesgo global. En mantención, usar la menor dosis eficaz (5 mg c/12 h).",
w:{0:"No es motivo de suspensión.",2:"Mismo efecto de clase.",3:"No indicado de rutina."},
p:"Perfil lipídico basal y a las 4–8 semanas.",
r:"OCTAVE · Guía Simposio PANCCO–ACTECCU 2026 §6"},

{id:"TR68",md:"X",b:"TR",t:"Inhibidores JAK",n:"S",
q:"Hombre de 58 años, hipertenso controlado y ex fumador, con CU grave con falla a infliximab, vedolizumab y ustekinumab; rechaza colectomía. ¿Uso de JAK?",
o:["Prohibido en todos los casos","Puede usarse si no hay alternativa adecuada, documentando la razón y el balance riesgo-beneficio, con tromboprofilaxis en hospitalización, vacuna de zóster y control CV/lipídico","Solo con aspirina obligatoria","Solo tofacitinib"],
c:1,
e:"La restricción regulatoria (≥65 años, tabaquismo actual o pasado, riesgo CV, neoplasia) no prohíbe: exige que no exista alternativa adecuada y documentar la decisión. Considerar también anti-IL-23 p19 o S1P según perfil, y la opción quirúrgica. Datos en EII (cohortes 2026) no muestran exceso de MACE/TEV vs anti-TNF.",
w:{0:"No está prohibido.",2:"No es requisito.",3:"Upadacitinib también es opción."},
p:"Decisión compartida y documentada en la ficha.",
r:"FDA/EMA JAK safety · Ahuja D et al. CGH 2026;24:794"},

{id:"TR69",md:"X",b:"TR",t:"Seguridad y cáncer",n:"F",
q:"Paciente con EII en azatioprina desarrolla mononucleosis por VEB grave con fiebre persistente, esplenomegalia, pancitopenia y ferritina >5.000. ¿Qué sospechar?",
o:["Brote de EII","Síndrome hemofagocítico (linfohistiocitosis hemofagocítica) asociado a VEB y tiopurinas: suspender inmunosupresión y manejo hematológico urgente","Hepatitis por azatioprina","Efecto esperado"],
c:1,
e:"La primoinfección por VEB bajo tiopurinas (sobre todo en varones jóvenes seronegativos) puede desencadenar <b>síndrome hemofagocítico</b> o linfoproliferación. Criterios HLH-2004 (fiebre, esplenomegalia, citopenias, ferritina alta, hipertrigliceridemia/hipofibrinogenemia, hemofagocitosis). Urgencia hematológica.",
w:{0:"No explica el cuadro.",2:"No explica citopenias y ferritina.",3:"Es potencialmente fatal."},
p:"Por esto se pide serología VEB antes de tiopurina en varón joven.",
r:"Guía Simposio PANCCO–ACTECCU 2026 §4 · ECCO Infections 2026"},

{id:"TR70",md:"X",b:"TR",t:"Seguridad y cáncer",n:"S",
q:"Mujer de 45 años con EC en remisión con adalimumab recibe diagnóstico de cáncer de mama que iniciará quimioterapia. ¿Conducta con el biológico?",
o:["Suspender todo tratamiento de la EII de forma definitiva","Decisión multidisciplinaria con oncología: habitualmente pausar el anti-TNF durante la quimioterapia citotóxica (que suele controlar la EII) y reevaluar; al retomar, preferir vedolizumab o anti-IL-23 si el riesgo oncológico lo aconseja","Continuar adalimumab e iniciar tiopurina","Cambiar a tofacitinib"],
c:1,
e:"Durante quimioterapia la inmunosupresión adicional aumenta el riesgo infeccioso; la EII suele mejorar con la quimioterapia. Plan conjunto. Tras el tratamiento, elegir mecanismo por riesgo oncológico (vedolizumab/anti-IL-23 sin señal), según evidencia limitada (SAPPHIRE, I-CARE en curso).",
w:{0:"Innecesario de forma definitiva.",2:"Tiopurinas: evitar con cáncer reciente.",3:"Neoplasia: restricción JAK."},
p:"ACTECCU 2026: con cáncer <2 años o activo, evitar inmunomoduladores.",
r:"ACTECCU 2026 · Guía Estudio EII 2026 §16.3"},

{id:"TR71",md:"X",b:"TR",t:"Manifestaciones extraintestinales",n:"R",
q:"Paciente con CU activa refiere ojo rojo doloroso, fotofobia y visión borrosa. ¿Conducta?",
o:["Colirio lubricante y control en 1 mes","Derivación oftalmológica urgente por sospecha de uveítis anterior (lámpara de hendidura; corticoide tópico/sistémico); considerar anti-TNF si es recurrente","Antibiótico tópico","Solo tratar la CU"],
c:1,
e:"Dolor, fotofobia y visión borrosa → <b>uveítis</b> (urgencia, riesgo de secuelas visuales). La epiescleritis es menos dolorosa, sin compromiso visual, y sigue la actividad luminal. La uveítis es independiente; anti-TNF (adalimumab/infliximab) útiles en recurrente.",
w:{0:"Riesgo de daño visual.",2:"No es conjuntivitis bacteriana.",3:"Insuficiente."},
p:"Vedolizumab no controla la uveítis.",
r:"ECCO EIM · Guía Estudio EII 2026 §3"},

{id:"TR72",md:"X",b:"TR",t:"Manifestaciones extraintestinales",n:"F",
q:"Paciente con EC con ileostomía desarrolla úlcera periestomal dolorosa de bordes violáceos socavados. ¿Diagnóstico y manejo?",
o:["Infección de piel: antibióticos y debridamiento","Pioderma gangrenoso periestomal: evitar debridamiento (patergia), corticoide tópico/intralesional o tacrolimus tópico; en extenso, corticoide sistémico o anti-TNF (infliximab); revisar actividad luminal","Dermatitis de contacto por la placa","Recurrencia de EC en estoma: cirugía"],
c:1,
e:"Pioderma gangrenoso periestomal: diagnóstico clínico, de exclusión. Patergia → no debridar. Tratamiento tópico en lesiones pequeñas; sistémico (corticoides, infliximab, adalimumab; ciclosporina) en extensas. Ajustar dispositivo con estomaterapia.",
w:{0:"El debridamiento empeora por patergia.",2:"No explica bordes violáceos socavados.",3:"No es la explicación."},
p:"La reubicación del estoma no evita recurrencias.",
r:"ECCO EIM guideline"},

{id:"TR73",md:"X",b:"TR",t:"Poblaciones especiales",n:"F",
q:"Hombre de 80 años con CU extensa moderada de debut reciente. Toma anticoagulante por fibrilación auricular y tiene deterioro cognitivo leve. ¿Mejor enfoque?",
o:["Corticoides en ciclos prolongados","Valoración geriátrica integral; objetivos individualizados; preferir 5-ASA si es leve-moderada, y para escalar vedolizumab o ustekinumab/anti-IL-23; minimizar corticoides; evitar JAK y tiopurinas","Tofacitinib por vía oral","Azatioprina"],
c:1,
e:"En EII de debut tardío predomina el fenotipo colónico; la fragilidad determina tolerancia. Vedolizumab/ustekinumab/anti-IL-23 por seguridad. Corticoides: delirium, fracturas, infecciones. Revisión de polifarmacia e interacciones.",
w:{0:"Alto riesgo en adulto mayor.",2:"Restricción por edad.",3:"Linfoma y cáncer de piel."},
p:"La mayoría de los ensayos excluyó >65–75 años: evidencia observacional.",
r:"GETECCU fragilidad 2025 · ACTECCU 2026"},

{id:"TR74",md:"X",b:"TR",t:"Poblaciones especiales",n:"S",
q:"Paciente con EII hospitalizado por brote, dado de alta tras colectomía por CUAG, con cáncer activo y movilidad reducida. ¿Profilaxis tromboembólica?",
o:["Solo durante la hospitalización","Considerar profilaxis extendida (~4 semanas) tras el alta por muy alto riesgo (cirugía mayor reciente, neoplasia, inmovilidad)","Contraindicada tras colectomía","Aspirina"],
c:1,
e:"ECCO quirúrgica 2026 (enunciado 11): profilaxis en todo paciente operado, y considerar extendida ~4 semanas en alto riesgo. La AGA reconoce evidencia insuficiente para generalizarla fuera de la cirugía, pero la sugiere en muy alto riesgo.",
w:{0:"Insuficiente en alto riesgo.",2:"Incorrecto.",3:"No es la profilaxis indicada."},
p:"El riesgo de TEV persiste semanas tras el alta.",
r:"ECCO UC Surgical 2026 enunciado 11 · AGA CPU Inpatient 2026"},

{id:"TR75",md:"X",b:"TR",t:"Acceso en Chile",n:"F",
q:"Paciente FONASA con EC ileocolónica moderada-grave y factores de mal pronóstico. Por evidencia elegirías risankizumab, pero no tiene cobertura. ¿Conducta más adecuada en el sistema público chileno?",
o:["No indicar terapia avanzada","Postular a Ley Ricarte Soto con infliximab o adalimumab (ambos con evidencia fuerte en EC), optimizarlo con TDM ± inmunomodulador, y documentar fallas para gestionar un segundo mecanismo","Indicar risankizumab sin gestión de acceso","Tiopurina en monoterapia indefinida"],
c:1,
e:"LRS en EC cubre infliximab y adalimumab (fármaco, no administración). Requisitos: resumen médico, colonoscopía con biopsia, IGRA/ELISPOT, serologías VIH/VHB/VHC, Rx de tórax, imagen seccional (o cápsula). La optimización del anti-TNF es la herramienta principal en el sistema público.",
w:{0:"Deja al paciente con riesgo alto sin tratar.",2:"Sin acceso real no hay tratamiento.",3:"Insuficiente en alto riesgo."},
p:"En el oral: primero jerarquía por evidencia, luego ajuste por acceso.",
r:"FONASA LRS · ACTECCU 2026"},

{id:"TR76",md:"X",b:"TR",t:"Monitorización (TDM)",n:"F",
q:"EC en ustekinumab 90 mg c/8 sem con pérdida de respuesta. Nivel valle 0,6 µg/mL. ¿Conducta?",
o:["Cambiar de clase inmediatamente","Intensificar a c/4–6 semanas (o reinducción IV) y reevaluar a las 12–16 semanas","Agregar metotrexato","Suspender"],
c:1,
e:"Ustekinumab tiene baja inmunogenicidad; la pérdida de respuesta con nivel bajo responde a intensificación (c/4 sem) o reinducción IV en una proporción relevante. Si no responde → cambio a anti-p19 o JAK.",
w:{0:"Primero optimizar la exposición.",2:"Sin fundamento.",3:"Pierde un fármaco útil."},
p:"Umbral orientativo de mantención >0,8–1,4 µg/mL.",
r:"Guía Simposio PANCCO–ACTECCU 2026 §9"},

{id:"TR77",md:"X",b:"TR",t:"Biosimilares y formulaciones",n:"F",
q:"Paciente con EC estable en infliximab IV 5 mg/kg c/8 sem desea terapia domiciliaria. ¿Opción?",
o:["Cambiar a infliximab SC (CT-P13 SC) 120 mg c/2 semanas, con seguimiento de niveles; la exposición valle suele ser mayor que con IV","No existe formulación SC","Adalimumab obligatoriamente","Vedolizumab SC"],
c:0,
e:"Infliximab SC (CT-P13) 120 mg c/2 sem tras inducción IV: LIBERTY-CD/UC mostraron superioridad vs placebo en mantención; el cambio IV→SC en pacientes estables mantiene eficacia con niveles valle más altos y estables. En pacientes intensificados IV (10 mg/kg c/4–6), el cambio a 120 mg SC puede requerir dosis mayores o seguimiento estrecho.",
w:{1:"Existe.",2:"No es obligatorio cambiar de molécula.",3:"Cambio de mecanismo innecesario en paciente estable."},
p:"Tema de protocolo institucional (cambio IV→SC y LRS).",
r:"Hanauer SB et al. Gastroenterology 2024 (LIBERTY)"},

{id:"TR78",md:"X",b:"TR",t:"Guías: discrepancias",n:"S",
q:"CU moderada en paciente naïve: ¿qué contraste existe entre ECCO 2026, ACG 2025 y ACTECCU 2026 respecto de adalimumab?",
o:["Todas lo recomiendan como primera elección","ECCO sugiere preferir vedolizumab sobre adalimumab (rec. 24); ACG 2025 posiciona vedolizumab por sobre adalimumab e infliximab como anti-TNF preferido; ACTECCU le da recomendación débil en inducción. En Chile, adalimumab sigue siendo accesible por LRS","Ninguna menciona adalimumab","Todas lo contraindican"],
c:1,
e:"Consistencia entre guías: adalimumab es menos eficaz en CU (VARSITY; dosis fija, inmunogenicidad). Al decidir se integra evidencia y acceso: infliximab o golimumab (LRS) pueden preferirse al adalimumab cuando el anti-TNF es la opción financiada.",
w:{0:"Incorrecto.",2:"Todas lo mencionan.",3:"No está contraindicado."},
p:"Cuando las guías discrepan, mostrar las posturas y justificar la elección.",
r:"ECCO UC Medical 2026 · ACG UC 2025 · ACTECCU 2026"},

{id:"TR79",md:"X",b:"TR",t:"Terapia combinada avanzada",n:"S",
q:"Paciente con EC luminal controlada con vedolizumab, pero con espondiloartritis axial activa refractaria a AINE. ¿Conducta?",
o:["Cambiar todo a anti-TNF (cubre intestino y columna) si no hay contraindicación; alternativa: agregar un segundo mecanismo en centro experto (terapia combinada avanzada para MEI discordante)","Agregar ustekinumab","Aumentar vedolizumab","Metotrexato oral para la columna"],
c:0,
e:"La espondiloartritis axial responde a anti-TNF o JAK, no a vedolizumab ni a IL-12/23/IL-23. Opción más simple: cambiar a un anti-TNF que cubra ambos. La combinación avanzada (MEI discordante) es opción de centro experto con consentimiento.",
w:{1:"Ineficaz en axial.",2:"No actúa en articulaciones.",3:"Sin eficacia en enfermedad axial."},
p:"Coordinar con reumatología.",
r:"Guía Simposio PANCCO–ACTECCU 2026 §7, §10"},

{id:"TR80",md:"X",b:"TR",t:"Colitis por inmunoterapia",n:"F",
q:"Paciente con EII de base en remisión que requiere inmunoterapia (anti-PD-1) por melanoma metastásico. ¿Consideración correcta?",
o:["La EII contraindica absolutamente la inmunoterapia","No contraindica: aumenta el riesgo de brote/colitis inmunomediada (~30–40%); decidir con oncología, vigilar estrechamente y tratar precozmente; vedolizumab es opción atractiva si se requiere terapia","Suspender la mesalazina","Iniciar infliximab profiláctico en todos"],
c:1,
e:"Pacientes con EII preexistente tienen más eventos GI con ICI; la mayoría manejables. La decisión oncológica prima; plan de vigilancia, calprotectina basal, bajo umbral para endoscopía y tratamiento precoz (corticoides, vedolizumab/infliximab).",
w:{0:"No es absoluta.",2:"Sin fundamento.",3:"Sin evidencia de profilaxis."},
p:"Infliximab en melanoma: señal de riesgo teórico; vedolizumab más selectivo.",
r:"Dougan M et al. AGA CPU ICI 2021 · Guía Estudio EII 2026 §16.3"},

{id:"TR81",md:"X",b:"TR",t:"Tamizaje e infecciones",n:"R",
q:"Paciente en infliximab consulta por herpes zóster dermatómico no complicado. ¿Conducta?",
o:["Suspender definitivamente el anti-TNF","Antiviral oral (valaciclovir/aciclovir), pausar transitoriamente la inmunosupresión según gravedad y reanudar tras resolución; vacuna recombinante después del episodio","Solo analgesia","Corticoides"],
c:1,
e:"Zóster localizado: antiviral, pausa breve según gravedad; zóster diseminado o en inmunosupresión intensa: aciclovir EV y suspensión. Vacunar con recombinante tras el episodio para prevenir recurrencias.",
w:{0:"No es necesario en zóster localizado.",2:"Insuficiente.",3:"Contraindicado."},
p:"Riesgo de zóster: JAK > combinación > anti-TNF.",
r:"ECCO Infections 2026 · ACG Preventive Care 2025"},

{id:"TR82",md:"X",b:"TR",t:"Embarazo",n:"R",
q:"Paciente con CU y IPAA desea embarazo. ¿Consejería correcta?",
o:["La fecundidad puede estar reducida por adherencias pélvicas (considerar laparoscopía y derivación precoz a fertilidad); el parto por cesárea suele preferirse para proteger la función esfinteriana del reservorio","El reservorio no afecta la fertilidad","Debe desmontar el reservorio antes de embarazarse","El embarazo está contraindicado"],
c:0,
e:"La proctocolectomía con IPAA (sobre todo abierta) reduce la fecundidad femenina por adherencias pélvicas; el abordaje laparoscópico la reduce menos. Por eso en mujeres jóvenes se discute diferir la reconstrucción o considerar anastomosis ileorrectal en casos seleccionados. Vía del parto: habitualmente cesárea (decisión con obstetra y cirujano).",
w:{1:"Sí puede afectarla.",2:"Incorrecto.",3:"Incorrecto."},
p:"FIV es opción eficaz si hay infertilidad.",
r:"ECCO UC Surgical 2026 · ECCO Pregnancy 2023"}
];

</script>
<script>
(function(){
"use strict";
const SNAP="<!doctype html>\n"+document.documentElement.outerHTML;
const STUDY=new Set(STUDY_IDS);
const ALL=[...Q_CU,...Q_EC,...Q_TR,...Q_NEW,...Q_X1,...Q_X2,...Q_X3,...Q_X4].map(q=>({...q,mode:q.md||(STUDY.has(q.id)?"E":"X"),m:q.m||MECH[q.id]||""}));
const byId=Object.fromEntries(ALL.map(q=>[q.id,q]));
const BL={CU:"Colitis ulcerosa",EC:"Enfermedad de Crohn",TR:"Transversal"};
const NV={R:"Residente",F:"Fellow",S:"Staff"};
const LET="ABCDE";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- almacenamiento local (opcional) ---------- */
const KEY="quizEII_v6";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
const DB=load(); DB.q=DB.q||{}; DB.exams=DB.exams||[];
function record(id,ok){const r=DB.q[id]||{n:0,ok:0};r.n++;if(ok)r.ok++;r.last=ok?1:0;DB.q[id]=r;save()}

/* ---------- tema ---------- */
$("#themeBtn").addEventListener("click",()=>{
  const root=document.documentElement;
  const cur=root.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const next=cur==="dark"?"light":"dark";root.setAttribute("data-theme",next);DB.theme=next;save();
});
if(DB.theme)document.documentElement.setAttribute("data-theme",DB.theme);

/* ---------- pestañas ---------- */
const tabs=[...document.querySelectorAll(".tabs button")];
function showTab(t){tabs.forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
  document.querySelectorAll("main>section").forEach(s=>s.hidden=s.id!=="tab-"+t);
  DB.tab=t;save(); if(t==="stats")renderStats(); if(t==="flash")renderFlash();}
tabs.forEach(b=>b.addEventListener("click",()=>showTab(b.dataset.tab)));
$("#nStudy").textContent=ALL.filter(q=>q.mode==="E").length;
$("#nExam").textContent=ALL.filter(q=>q.mode==="X").length;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function segHTML(name,opts,val){return `<div class="seg" data-seg="${name}">`+opts.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${v===val}">${l}</button>`).join("")+`</div>`}
function bindSeg(root,name,cb){root.querySelectorAll(`[data-seg="${name}"] button`).forEach(b=>b.addEventListener("click",()=>cb(b.dataset.v)))}
function chips(q){return `<span class="chip b-${q.b}">${q.b==="TR"?"CU + EC":q.b}</span><span class="chip lv-${q.n}">${NV[q.n]}</span><span class="chip">${esc(q.t)}</span>`+(q.fix?`<span class="chip fix">corrige v5</span>`:"")+(q.nuevo?`<span class="chip new">actualización</span>`:"")}
function explainHTML(q,order,chosen){
  const ok=chosen===q.c;
  const wrongs=order.map((oi,pos)=>oi===q.c?"":`<li><b class="L">${LET[pos]}</b>${q.w[oi]}</li>`).join("");
  return `<div class="explain">
    ${chosen==null?`<div class="verdict bad">Sin responder</div>`:`<div class="verdict ${ok?"ok":"bad"}">${ok?"Correcto.":"Incorrecto."} Respuesta: ${LET[order.indexOf(q.c)]}</div>`}
    <div class="blk"><h4>Explicación</h4><p>${q.e}</p></div>
    <div class="blk"><h4>Por qué no las otras</h4><ul>${wrongs}</ul></div>
    ${q.m?`<div class="blk mech"><h4>Mecanismo / fisiopatología</h4><p>${q.m}</p></div>`:""}
    <div class="blk pearl"><h4>Perla</h4><p>${q.p}</p></div>
    ${q.nuevo?`<div class="blk newbox"><h4>Qué cambió</h4><p>${q.nuevo}</p></div>`:""}
    ${q.fix?`<div class="blk fixbox"><h4>Corrección respecto de v5 / otras herramientas</h4><p>${q.fix}</p></div>`:""}
    <div class="blk refs"><h4>Referencias</h4><p>${q.r}</p></div>
  </div>`;
}
function themes(list){return [...new Set(list.map(q=>q.t))].sort((a,b)=>a.localeCompare(b,"es"))}

/* ================= ESTUDIO ================= */
const ST={bank:"E",b:"all",n:"all",t:"all",failed:false,i:0,orders:{},ans:{}};
function studyList(){return ALL.filter(q=>(ST.bank==="all"||q.mode==="E")&&(ST.b==="all"||q.b===ST.b)&&(ST.n==="all"||q.n===ST.n)&&(ST.t==="all"||q.t===ST.t)&&(!ST.failed||(DB.q[q.id]&&DB.q[q.id].last===0)))}
function renderStudy(){
  const root=$("#tab-study");const list=studyList();
  if(ST.i>=list.length)ST.i=Math.max(0,list.length-1);
  const pool=ALL.filter(q=>ST.bank==="all"||q.mode==="E");
  let h=`<div class="filters">
    <span><span class="flabel">Banco</span>${segHTML("bank",[["E",`Estudio (${ALL.filter(q=>q.mode==="E").length})`],["all",`Todo (${ALL.length})`]],ST.bank)}</span>
    <span><span class="flabel">Bloque</span>${segHTML("b",[["all","Todos"],["CU","CU"],["EC","Crohn"],["TR","Transversal"]],ST.b)}</span>
    <span><span class="flabel">Nivel</span>${segHTML("n",[["all","Todos"],["R","Residente"],["F","Fellow"],["S","Staff"]],ST.n)}</span>
    <span><label class="flabel" for="stTema">Tema</label><select id="stTema"><option value="all">Todos</option>${themes(pool).map(t=>`<option ${t===ST.t?"selected":""}>${esc(t)}</option>`).join("")}</select></span>
    <span>${segHTML("failed",[["0","Todas"],["1","Solo falladas"]],ST.failed?"1":"0")}</span>
  </div>`;
  if(!list.length){root.innerHTML=h+`<div class="card empty">No hay preguntas con estos filtros${ST.failed?" (aún no registras preguntas falladas)":""}.</div>`;bindStudy(root);return;}
  const q=list[ST.i];
  if(!ST.orders[q.id])ST.orders[q.id]=shuffle(q.o.map((_,i)=>i));
  const order=ST.orders[q.id];const chosen=ST.ans[q.id];const done=chosen!==undefined;
  h+=`<div class="progressbar"><i style="width:${((ST.i+1)/list.length*100).toFixed(1)}%"></i></div>
  <article class="card qcard">
    <div class="meta">${chips(q)}<span class="counter">${q.id} · ${ST.i+1}/${list.length}</span></div>
    <p class="stem">${q.q}</p>
    <div class="opts">${order.map((oi,pos)=>{
      let cls="opt";if(done){if(oi===q.c)cls+=" right";else if(oi===chosen)cls+=" wrong";}
      return `<button type="button" class="${cls}" data-oi="${oi}" ${done?"disabled":""}><span class="L">${LET[pos]}</span><span>${q.o[oi]}</span></button>`}).join("")}</div>
    ${done?explainHTML(q,order,chosen):""}
    <div class="actions">
      <button class="btn" type="button" id="stPrev" ${ST.i===0?"disabled":""}>← Anterior</button>
      <span class="spacer"></span>
      ${done?`<button class="btn ghost" type="button" id="stRetry">Reintentar</button>`:""}
      <button class="btn primary" type="button" id="stNext" ${ST.i>=list.length-1?"disabled":""}>Siguiente →</button>
    </div>
    <div class="palette" aria-label="Navegación">${list.map((x,k)=>{const a=ST.ans[x.id];let c=k===ST.i?"cur":"";if(a!==undefined)c+=a===x.c?" ok":" bad";return `<button type="button" class="${c}" data-k="${k}" title="${x.id}">${k+1}</button>`}).join("")}</div>
  </article>`;
  root.innerHTML=h;bindStudy(root);
  root.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{const oi=+b.dataset.oi;ST.ans[q.id]=oi;record(q.id,oi===q.c);renderStudy();}));
  const r=$("#stRetry");if(r)r.addEventListener("click",()=>{delete ST.ans[q.id];ST.orders[q.id]=shuffle(q.o.map((_,i)=>i));renderStudy()});
  $("#stPrev").addEventListener("click",()=>{ST.i--;renderStudy();scrollTop()});
  $("#stNext").addEventListener("click",()=>{ST.i++;renderStudy();scrollTop()});
  root.querySelectorAll(".palette button").forEach(b=>b.addEventListener("click",()=>{ST.i=+b.dataset.k;renderStudy()}));
}
function bindStudy(root){
  bindSeg(root,"bank",v=>{ST.bank=v;ST.t="all";ST.i=0;renderStudy()});
  bindSeg(root,"b",v=>{ST.b=v;ST.i=0;renderStudy()});
  bindSeg(root,"n",v=>{ST.n=v;ST.i=0;renderStudy()});
  bindSeg(root,"failed",v=>{ST.failed=v==="1";ST.i=0;renderStudy()});
  const s=root.querySelector("#stTema");if(s)s.addEventListener("change",()=>{ST.t=s.value;ST.i=0;renderStudy()});
}
function scrollTop(){const t=$("#tab-study");if(t&&t.getBoundingClientRect().top<0)window.scrollTo({top:0});}

/* ================= EXAMEN ================= */
const EX={b:"all",n:"all",count:"20",timer:"on",state:"setup",qs:[],orders:{},ans:{},i:0,t0:0,limit:0,tick:null,confirm:false,only:null};
function examPool(){return ALL.filter(q=>q.mode==="X"&&(EX.b==="all"||q.b===EX.b)&&(EX.n==="all"||q.n===EX.n))}
function renderExam(){
  const root=$("#tab-exam");
  if(EX.state==="setup"){
    const pool=examPool();
    root.innerHTML=`<div class="filters"></div><div class="card setup">
      <h2>Simulación de examen</h2>
      <p>Casos clínicos integrados (${ALL.filter(q=>q.mode==="X").length} en el banco), sin retroalimentación hasta finalizar. Al terminar ves el puntaje por bloque y nivel, y la explicación completa de cada caso.</p>
      <div class="filters" style="margin:0">
        <span><span class="flabel">Bloque</span>${segHTML("b",[["all","Todos"],["CU","CU"],["EC","Crohn"],["TR","Transversal"]],EX.b)}</span>
        <span><span class="flabel">Nivel</span>${segHTML("n",[["all","Todos"],["R","Residente"],["F","Fellow"],["S","Staff"]],EX.n)}</span>
      </div>
      <div class="filters" style="margin:0">
        <span><span class="flabel">Preguntas</span>${segHTML("count",[["10","10"],["20","20"],["30","30"],["50","50"],["all",`Todas (${pool.length})`]],EX.count)}</span>
        <span><span class="flabel">Tiempo</span>${segHTML("timer",[["on","90 s por pregunta"],["off","Sin límite"]],EX.timer)}</span>
      </div>
      <div class="actions" style="margin:0"><button class="btn primary" type="button" id="exStart" ${pool.length?"":"disabled"}>Comenzar (${Math.min(pool.length,EX.count==="all"?pool.length:+EX.count)} preguntas)</button>
      <span class="muted" style="font-size:13px">${pool.length} casos disponibles con estos filtros</span></div>
    </div>`;
    bindSeg(root,"b",v=>{EX.b=v;renderExam()});bindSeg(root,"n",v=>{EX.n=v;renderExam()});
    bindSeg(root,"count",v=>{EX.count=v;renderExam()});bindSeg(root,"timer",v=>{EX.timer=v;renderExam()});
    $("#exStart").addEventListener("click",()=>startExam(shuffle(pool)));
    return;
  }
  if(EX.state==="run"){
    const q=EX.qs[EX.i];const order=EX.orders[q.id];const chosen=EX.ans[q.id];
    const answered=EX.qs.filter(x=>EX.ans[x.id]!==undefined).length;
    root.innerHTML=`<div class="filters"><span class="flabel">Examen en curso</span><span class="muted">${answered}/${EX.qs.length} respondidas</span><span class="spacer"></span>${EX.timer==="on"?`<span class="timer" id="exTimer"></span>`:""}</div>
    <div class="progressbar"><i style="width:${(answered/EX.qs.length*100).toFixed(1)}%"></i></div>
    <article class="card qcard">
      <div class="meta">${chips({...q,fix:null,nuevo:null})}<span class="counter">${EX.i+1}/${EX.qs.length}</span></div>
      <p class="stem">${q.q}</p>
      <div class="opts">${order.map((oi,pos)=>`<button type="button" class="opt ${chosen===oi?"sel":""}" data-oi="${oi}"><span class="L">${LET[pos]}</span><span>${q.o[oi]}</span></button>`).join("")}</div>
      <div class="actions">
        <button class="btn" type="button" id="exPrev" ${EX.i===0?"disabled":""}>← Anterior</button>
        <button class="btn" type="button" id="exNext" ${EX.i>=EX.qs.length-1?"disabled":""}>Siguiente →</button>
        <span class="spacer"></span>
        <button class="btn ${EX.confirm?"primary":""}" type="button" id="exEnd">${EX.confirm?`Confirmar: finalizar (${EX.qs.length-answered} sin responder)`:"Finalizar examen"}</button>
      </div>
      <div class="palette">${EX.qs.map((x,k)=>`<button type="button" class="${k===EX.i?"cur":""} ${EX.ans[x.id]!==undefined?"ans":""}" data-k="${k}">${k+1}</button>`).join("")}</div>
    </article>`;
    root.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{EX.ans[q.id]=+b.dataset.oi;EX.confirm=false;if(EX.i<EX.qs.length-1)EX.i++;renderExam()}));
    $("#exPrev").addEventListener("click",()=>{EX.i--;EX.confirm=false;renderExam()});
    $("#exNext").addEventListener("click",()=>{EX.i++;EX.confirm=false;renderExam()});
    $("#exEnd").addEventListener("click",()=>{if(EX.confirm)finishExam();else{EX.confirm=true;renderExam()}});
    root.querySelectorAll(".palette button").forEach(b=>b.addEventListener("click",()=>{EX.i=+b.dataset.k;EX.confirm=false;renderExam()}));
    updTimer();return;
  }
  if(EX.state==="done"){
    const qs=EX.qs;const ok=qs.filter(q=>EX.ans[q.id]===q.c).length;const pct=Math.round(ok/qs.length*100);
    const group=(key,labels)=>Object.keys(labels).map(k=>{const g=qs.filter(q=>q[key]===k);if(!g.length)return "";const o=g.filter(q=>EX.ans[q.id]===q.c).length;const p=Math.round(o/g.length*100);
      return `<div class="bar"><span>${labels[k]}</span><span class="track"><i style="width:${p}%;background:${p>=70?"var(--ok)":p>=50?"var(--warn)":"var(--bad)"}"></i></span><span class="v">${o}/${g.length}</span></div>`}).join("");
    const secs=Math.round((Date.now()-EX.t0)/1000);
    root.innerHTML=`<div class="filters"></div><div class="card">
      <div class="score"><div><div class="big">${pct}%</div><div class="sub">${ok} de ${qs.length} correctas · ${Math.floor(secs/60)} min ${secs%60} s</div></div>
      <div class="sub" style="max-width:40ch">${pct>=80?"Nivel sólido. Revisa igual las explicaciones de las correctas por azar.":pct>=60?"Base adecuada; enfócate en los bloques bajo 70%.":"Conviene repasar en modo estudio los temas con más errores."}</div></div>
      <div class="bars">${group("b",BL)}${group("n",NV)}</div>
    </div>
    <div class="actions">
      <button class="btn primary" type="button" id="exWrong" ${ok===qs.length?"disabled":""}>Repetir solo las falladas</button>
      <button class="btn" type="button" id="exNew">Nuevo examen</button>
    </div>
    <div class="review">${qs.map((q,k)=>{const a=EX.ans[q.id];const st=a===undefined?"na":a===q.c?"ok":"bad";
      return `<details class="rv"><summary><span class="mark ${st}">${st==="ok"?"✓":st==="bad"?"✗":"—"} ${k+1}</span><span class="rvq">${q.q}</span></summary>
      <div class="meta" style="margin-top:12px">${chips(q)}<span class="counter">${q.id}</span></div>
      <div class="opts">${EX.orders[q.id].map((oi,pos)=>{let c="opt";if(oi===q.c)c+=" right";else if(oi===a)c+=" wrong";return `<div class="${c}"><span class="L">${LET[pos]}</span><span>${q.o[oi]}</span></div>`}).join("")}</div>
      ${explainHTML(q,EX.orders[q.id],a===undefined?null:a)}</details>`}).join("")}</div>`;
    $("#exWrong").addEventListener("click",()=>startExam(qs.filter(q=>EX.ans[q.id]!==q.c)));
    $("#exNew").addEventListener("click",()=>{EX.state="setup";renderExam()});
  }
}
function startExam(pool){
  const n=EX.count==="all"?pool.length:Math.min(pool.length,+EX.count);
  EX.qs=pool.slice(0,n);EX.orders={};EX.ans={};EX.i=0;EX.confirm=false;
  EX.qs.forEach(q=>EX.orders[q.id]=shuffle(q.o.map((_,i)=>i)));
  EX.t0=Date.now();EX.limit=EX.timer==="on"?EX.qs.length*90:0;EX.state="run";
  clearInterval(EX.tick);if(EX.limit)EX.tick=setInterval(updTimer,1000);
  renderExam();window.scrollTo({top:0});
}
function updTimer(){
  const el=$("#exTimer");if(!EX.limit||EX.state!=="run")return;
  const left=EX.limit-Math.floor((Date.now()-EX.t0)/1000);
  if(left<=0){finishExam();return;}
  if(el){el.textContent=`⏱ ${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;el.classList.toggle("low",left<60);}
}
function finishExam(){
  clearInterval(EX.tick);EX.state="done";
  EX.qs.forEach(q=>{if(EX.ans[q.id]!==undefined)record(q.id,EX.ans[q.id]===q.c)});
  const ok=EX.qs.filter(q=>EX.ans[q.id]===q.c).length;
  DB.exams.push({d:Date.now(),n:EX.qs.length,ok});if(DB.exams.length>30)DB.exams.shift();save();
  renderExam();window.scrollTo({top:0});
}

/* ================= FLASHCARDS ================= */
const FL={b:"all",list:null,i:0,flip:false};
function renderFlash(){
  const root=$("#tab-flash");
  if(!FL.list)FL.list=ALL.filter(q=>FL.b==="all"||q.b===FL.b);
  const q=FL.list[FL.i];
  root.innerHTML=`<div class="filters">
    <span><span class="flabel">Bloque</span>${segHTML("b",[["all","Todos"],["CU","CU"],["EC","Crohn"],["TR","Transversal"]],FL.b)}</span>
    <button class="btn ghost" type="button" id="flShuffle">Barajar</button>
    <span class="muted" style="font-size:13px">Clic o espacio para girar · ← → para avanzar</span></div>
  <div class="flash"><div class="card fc ${FL.flip?"flip":""}" id="fc" tabindex="0" role="button" aria-label="Girar tarjeta">
    <div class="face front"><div class="meta">${chips({...q,fix:null,nuevo:null})}<span class="counter">${FL.i+1}/${FL.list.length}</span></div>
      <p class="stem" style="margin:0">${q.q}</p><span class="hint">Piensa tu respuesta y gira la tarjeta.</span></div>
    <div class="face back"><div class="meta"><span class="chip">Respuesta</span><span class="counter">${q.id}</span></div>
      <div class="ans">${q.o[q.c]}</div><p style="margin:0">${q.p}</p><p class="refs" style="margin:0">${q.r}</p></div>
  </div></div>
  <div class="actions"><button class="btn" type="button" id="flPrev" ${FL.i===0?"disabled":""}>← Anterior</button><span class="spacer"></span><button class="btn primary" type="button" id="flNext" ${FL.i>=FL.list.length-1?"disabled":""}>Siguiente →</button></div>`;
  const fc=$("#fc");
  const fit=()=>{const f=fc.querySelectorAll(".face");let h=300;f.forEach(x=>{h=Math.max(h,x.scrollHeight)});fc.style.minHeight=h+"px"};fit();
  fc.addEventListener("click",()=>{FL.flip=!FL.flip;fc.classList.toggle("flip",FL.flip)});
  bindSeg(root,"b",v=>{FL.b=v;FL.list=null;FL.i=0;FL.flip=false;renderFlash()});
  $("#flShuffle").addEventListener("click",()=>{FL.list=shuffle(FL.list);FL.i=0;FL.flip=false;renderFlash()});
  $("#flPrev").addEventListener("click",()=>{FL.i--;FL.flip=false;renderFlash()});
  $("#flNext").addEventListener("click",()=>{FL.i++;FL.flip=false;renderFlash()});
}
document.addEventListener("keydown",e=>{
  if($("#tab-flash").hidden||e.target.tagName==="SELECT")return;
  if(e.key===" "){e.preventDefault();const fc=$("#fc");if(fc){FL.flip=!FL.flip;fc.classList.toggle("flip",FL.flip)}}
  if(e.key==="ArrowRight"&&FL.list&&FL.i<FL.list.length-1){FL.i++;FL.flip=false;renderFlash()}
  if(e.key==="ArrowLeft"&&FL.i>0){FL.i--;FL.flip=false;renderFlash()}
});

/* ================= PROGRESO ================= */
function renderStats(){
  const root=$("#tab-stats");const seen=ALL.filter(q=>DB.q[q.id]);
  const tot=seen.reduce((a,q)=>a+DB.q[q.id].n,0),okc=seen.reduce((a,q)=>a+DB.q[q.id].ok,0);
  const failed=seen.filter(q=>DB.q[q.id].last===0);
  const rows=themes(ALL).map(t=>{const g=ALL.filter(q=>q.t===t);const s=g.filter(q=>DB.q[q.id]);const n=s.reduce((a,q)=>a+DB.q[q.id].n,0),o=s.reduce((a,q)=>a+DB.q[q.id].ok,0);const p=n?Math.round(o/n*100):null;
    return `<div class="bar"><span>${esc(t)} <span class="muted">(${s.length}/${g.length})</span></span><span class="track"><i style="width:${p||0}%;background:${p==null?"transparent":p>=70?"var(--ok)":p>=50?"var(--warn)":"var(--bad)"}"></i></span><span class="v">${p==null?"—":p+"%"}</span></div>`}).join("");
  root.innerHTML=`<div class="filters"></div><div class="card">
    <div class="score"><div><div class="big">${tot?Math.round(okc/tot*100)+"%":"—"}</div><div class="sub">aciertos · ${seen.length}/${ALL.length} casos vistos · ${tot} respuestas</div></div>
    <div class="sub">Exámenes rendidos: ${DB.exams.length}${DB.exams.length?` · último ${Math.round(DB.exams[DB.exams.length-1].ok/DB.exams[DB.exams.length-1].n*100)}%`:""}</div></div>
    <div class="bars">${rows}</div></div>
  <div class="actions"><button class="btn primary" type="button" id="goFailed" ${failed.length?"":"disabled"}>Repasar ${failed.length} falladas en modo estudio</button>
  <span class="spacer"></span><button class="btn ghost" type="button" id="resetP">${statsConfirm?"Confirmar: borrar progreso":"Borrar progreso"}</button></div>
  <p class="muted" style="font-size:13px">El progreso se guarda solo en este navegador.</p>`;
  $("#goFailed").addEventListener("click",()=>{ST.bank="all";ST.failed=true;ST.b="all";ST.n="all";ST.t="all";ST.i=0;renderStudy();showTab("study")});
  $("#resetP").addEventListener("click",()=>{if(statsConfirm){DB.q={};DB.exams=[];save();statsConfirm=false}else statsConfirm=true;renderStats()});
}
